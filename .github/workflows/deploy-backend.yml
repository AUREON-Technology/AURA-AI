name: Deploy VPS

# After Backend CI succeeds on main, SSH to the Contabo host and run
# deploy/scripts/vps-update.sh against the tested SHA.
#
# This replaced the unused Cloud Run workflow: the production target is the
# VPS at vars.VPS_HOST, not GCP.
#
# Required (repo Settings â†’ Secrets and variables â†’ Actions, or the
# `production` environment):
#   secrets.VPS_SSH_KEY   ed25519 private key; public half is in root's
#                         authorized_keys on the VPS (comment github-actions-aura-cd)
#   vars.VPS_HOST         IPv4, currently 169.58.188.43
#   vars.VPS_USER         root
#
# Manual deploy: Actions â†’ Deploy VPS â†’ Run workflow.
# The Flutter APK is not deployed here -- BACKEND_URL is compile-time;
# use release-apk.yml when you need a new binary.
#
# The host checkout is often dirty (hotfixes, CRLF, leftover console edits).
# ci-deploy.sh sets AURA_STASH_DIRTY=1 so those tracked files are stashed
# rather than failing the job. Untracked files are ignored. The scripts
# executed on the host are taken from AURA_SHA, not from the stale tree.

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (empty = the commit that started this run)"
        required: false
        default: ""
      dev_ops:
        description: "Run vps-dev-bring-up after prod deploy (TLS/dev stack; not for routine CI deploy)"
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve target SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.inputs.sha }}
          RUN_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="${DISPATCH_SHA:-$RUN_SHA}"
          else
            SHA="$WORKFLOW_SHA"
          fi
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA"

      - name: Install SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not set" >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cp deploy/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          DEV_OPS: ${{ github.event_name == 'workflow_dispatch' && inputs.dev_ops }}
          # Baked into the image so /health/version can name the run that produced it (BLOCK-03).
          DEPLOYMENT_ID: gha-${{ github.run_id }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$TARGET_SHA"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${VPS_USER}@${VPS_HOST}" \
            env AURA_SHA="$TARGET_SHA" \
                AURA_DEV_OPS="$([ "$DEV_OPS" = "true" ] && echo 1 || echo 0)" \
                AURA_REPO=/opt/aura-stack \
                AURA_COMPOSE=/opt/aura-stack/deploy/docker-compose.prod.yml \
                AURA_PROJECT=aura \
                AURA_BACKEND_SERVICE=gateway \
                AURA_STASH_DIRTY=1 \
                AURA_DEPLOYMENT_ID="$DEPLOYMENT_ID" \
                AURA_GIT_REF=refs/heads/main \
                bash -s <<'REMOTE'
          set -euo pipefail
          git -C /opt/aura-stack fetch origin main
          if git -C /opt/aura-stack cat-file -e "${AURA_SHA}:deploy/scripts/ci-deploy.sh"; then
            git -C /opt/aura-stack show "${AURA_SHA}:deploy/scripts/ci-deploy.sh" > /tmp/ci-deploy.sh
            bash /tmp/ci-deploy.sh
          else
            bash /opt/aura-stack/deploy/scripts/vps-update.sh
          fi
          REMOTE

  # A deploy that did not happen has to be visible.
  #
  # `workflow_run` fires on *completed*, whatever the conclusion, so when Backend CI failed this
  # workflow simply concluded `skipped` -- a grey tick that satisfies branch protection, reads as
  # success on the Actions home page, and pages nobody. Production served a 2026-09-13 image for
  # two weeks while every subsequent merge looked fine, because "did not deploy" and "deployed"
  # were rendered identically. This job makes the first one red and says what is wrong.
  blocked:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the blocked deploy
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "### Deploy VPS did not run"
            echo
            echo "Backend CI concluded **\`$CI_CONCLUSION\`** for \`$CI_SHA\`."
            echo "Nothing was deployed -- production is still serving whatever it served before."
            echo
            echo "[Backend CI run]($CI_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Deploy VPS did not run: Backend CI concluded '$CI_CONCLUSION' for $CI_SHA. Nothing was deployed; production still serves the previous revision. See $CI_URL"
          exit 1

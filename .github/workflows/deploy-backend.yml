name: Deploy VPS

# After Backend CI succeeds on main, SSH to the Contabo host and run
# deploy/scripts/vps-update.sh against the tested SHA.
#
# This replaced the unused Cloud Run workflow: the production target is the
# VPS at vars.VPS_HOST, not GCP.
#
# Required (repo Settings â†’ Secrets and variables â†’ Actions, or the
# `production` environment):
#   secrets.VPS_SSH_KEY   ed25519 private key; public half is in root's
#                         authorized_keys on the VPS (comment github-actions-aura-cd)
#   vars.VPS_HOST         IPv4, currently 169.58.188.43
#   vars.VPS_USER         root
#
# Manual deploy: Actions â†’ Deploy VPS â†’ Run workflow.
# The Flutter APK is not deployed here -- BACKEND_URL is compile-time;
# use release-apk.yml when you need a new binary.
#
# The host checkout is often dirty (hotfixes, CRLF, leftover console edits).
# ci-deploy.sh sets AURA_STASH_DIRTY=1 so those tracked files are stashed
# rather than failing the job. Untracked files are ignored. The scripts
# executed on the host are taken from AURA_SHA, not from the stale tree.
#
# AURA_SHA (audit F47) must be a full 40-character hex SHA on origin/main --
# checked on the runner, then again on the host before any script is taken
# from it -- and reaches the host as data on stdin, never on the ssh command
# line, which the remote shell would re-parse.

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (empty = the commit that started this run)"
        required: false
        default: ""
      dev_ops:
        description: "Run vps-dev-bring-up after prod deploy (TLS/dev stack; not for routine CI deploy)"
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only a push to main in this repository may deploy (audit F-38 / SEC-11). `branches: [main]`
  # above filters on the *head branch name* alone, and a pull request from a fork whose branch is
  # also called `main` matches it: Backend CI runs on that PR, and its completion would otherwise
  # start this job in the base repository with the production environment and its secrets. The
  # three workflow_run checks below pin the triggering run to a push, to this repository, and to
  # main. workflow_dispatch needs write access, so it is trusted as before.
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: "Verify the SHA is on main" needs main's ancestry, not one commit.
          fetch-depth: 0

      - name: Resolve target SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.inputs.sha }}
          RUN_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="${DISPATCH_SHA:-$RUN_SHA}"
          else
            SHA="$WORKFLOW_SHA"
          fi
          # F47: a full lowercase hex SHA, nothing else. The dispatch input is free text and this
          # value selects the scripts the host runs as root; a branch name, a short SHA or anything
          # carrying shell syntax stops here. The value itself is not echoed back: printed, it
          # could forge workflow commands in the log.
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to deploy: the target is not a full 40-character commit SHA." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA"

      # A dispatched SHA can name any commit the repository holds, including one only on a
      # branch nobody reviewed. vps-update.sh checks ancestry too, but only after ci-deploy.sh has
      # already been taken from that commit and run -- so it is checked here first.
      - name: Verify the SHA is on main
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "::error::Refusing to deploy $TARGET_SHA: it is not on origin/main." >&2
            exit 1
          fi

      - name: Install SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not set" >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cp deploy/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          DEV_OPS: ${{ github.event_name == 'workflow_dispatch' && inputs.dev_ops }}
          # Baked into the image so /health/version can name the run that produced it (BLOCK-03).
          DEPLOYMENT_ID: gha-${{ github.run_id }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$TARGET_SHA"
          dev_ops=0
          if [ "$DEV_OPS" = "true" ]; then dev_ops=1; fi
          # F47: the remote command line is the literal `bash -s`. The per-run values travel on
          # stdin as %q-quoted exports ahead of the fixed script, so the remote shell never
          # re-parses anything that came from an input.
          {
            printf 'export AURA_SHA=%q\n' "$TARGET_SHA"
            printf 'export AURA_DEV_OPS=%q\n' "$dev_ops"
            printf 'export AURA_DEPLOYMENT_ID=%q\n' "$DEPLOYMENT_ID"
            cat <<'REMOTE'
          set -euo pipefail
          export AURA_REPO=/opt/aura-stack
          export AURA_COMPOSE=/opt/aura-stack/deploy/docker-compose.prod.yml
          export AURA_PROJECT=aura
          export AURA_BACKEND_SERVICE=gateway
          export AURA_STASH_DIRTY=1
          export AURA_GIT_REF=refs/heads/main
          if ! [[ "$AURA_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "AURA_SHA is not a full commit SHA" >&2
            exit 1
          fi
          git -C /opt/aura-stack fetch origin main </dev/null
          # Before any script is taken from that commit, not after (vps-update.sh's own check).
          git -C /opt/aura-stack merge-base --is-ancestor "$AURA_SHA" origin/main \
            || { echo "refusing $AURA_SHA: not on origin/main" >&2; exit 1; }
          if git -C /opt/aura-stack cat-file -e "${AURA_SHA}:deploy/scripts/ci-deploy.sh"; then
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            git -C /opt/aura-stack show "${AURA_SHA}:deploy/scripts/ci-deploy.sh" > "$work/ci-deploy.sh"
            bash "$work/ci-deploy.sh" </dev/null
          else
            bash /opt/aura-stack/deploy/scripts/vps-update.sh </dev/null
          fi
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${VPS_USER}@${VPS_HOST}" bash -s

  # A deploy that did not happen has to be visible.
  #
  # `workflow_run` fires on *completed*, whatever the conclusion, so when Backend CI failed this
  # workflow simply concluded `skipped` -- a grey tick that satisfies branch protection, reads as
  # success on the Actions home page, and pages nobody. Production served a 2026-09-13 image for
  # two weeks while every subsequent merge looked fine, because "did not deploy" and "deployed"
  # were rendered identically. This job makes the first one red and says what is wrong.
  # Gated on the same trusted-push checks as `deploy`: a fork PR that fails CI is not a blocked
  # production deploy, and must not turn this workflow red.
  blocked:
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion != 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the blocked deploy
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "### Deploy VPS did not run"
            echo
            echo "Backend CI concluded **\`$CI_CONCLUSION\`** for \`$CI_SHA\`."
            echo "Nothing was deployed -- production is still serving whatever it served before."
            echo
            echo "[Backend CI run]($CI_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Deploy VPS did not run: Backend CI concluded '$CI_CONCLUSION' for $CI_SHA. Nothing was deployed; production still serves the previous revision. See $CI_URL"
          exit 1

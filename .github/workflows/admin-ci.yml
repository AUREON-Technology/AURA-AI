name: Admin CI

# Gates every PR touching aura_admin (the Next.js operator console) on a clean install, a
# typecheck, a production build, and the Playwright suite (CB-30 / audit F-37).
#
# The suite needs no live stack: playwright.config.ts starts tests/e2e/mock-gateway.mjs and
# `next dev` itself (its `webServer` block), so it runs against the mock gateway here exactly as
# it does locally. This used to fire only after VPS Dev Ops brought up the dev stack and point
# PLAYWRIGHT_BASE_URL at https://dev.<domain> -- which never ran on a pull request, and
# dev.aureon-ai.tech no longer resolves. A manual run can still target a live console with the
# optional `base_url` input.
#
# `npm run lint` is a gate since 2026-11-09 (audit G-10): eslint.config.mjs loads Next's own rule
# sets and the script fails on warnings too, so a hook-dependency slip reads as red here rather
# than as a stale page in production.

on:
  pull_request:
    paths:
      - "aura_admin/**"
      - ".github/workflows/admin-ci.yml"
  push:
    branches: [main]
    paths:
      - "aura_admin/**"
      - ".github/workflows/admin-ci.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional: run the e2e suite against this console URL instead of the local mock stack"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admin-ci:
    name: Admin Dashboard CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aura_admin
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: aura_admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The browser revision must match the locked @playwright/test, so install through the
      # package's own CLI rather than a separate action.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          CI: "true"
          # Empty unless a manual run named a target; playwright.config.ts then uses its local
          # mock stack (http://127.0.0.1:3000).
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-playwright-report
          path: |
            aura_admin/playwright-report
            aura_admin/test-results
          retention-days: 7
          if-no-files-found: ignore

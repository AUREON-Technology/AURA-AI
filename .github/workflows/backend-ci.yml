name: Backend CI

# Gates every PR touching aura_backend on syntax, both test suites, and a
# Docker build.
#
# There are two suites because there are two code trees during the strangler
# migration (ADR-002):
#
#   * `aura_core` is pytest, needs no infrastructure, and is the suite that
#     matters going forward.
#   * The legacy tree is unittest and includes a testcontainers-backed sync
#     integration test that needs Docker.
#
# Each runs under its own runner, and both need requirements-dev.txt on the
# path: unittest discovery imports every `test_*.py` in the tree — including
# the pytest modules — so a runner without pytest installed fails the legacy
# step with an import error that has nothing to do with the legacy code.

on:
  pull_request:
    paths:
      - "aura_backend/**"
      - ".github/workflows/backend-ci.yml"
      - "deploy/**"
  push:
    branches: [main]
    paths:
      - "aura_backend/**"
      - "deploy/**"

permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight; runs on main are never cancelled, so
# every merge keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aura_backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            aura_backend/requirements.lock
            aura_backend/requirements.txt
            aura_backend/requirements-dev.lock

      - name: Install dependencies
        # Hash-checked (F-38): every artefact must match a hash recorded in requirements.lock.
        # The lock names no index; torch's +cpu wheel exists only on PyTorch's CPU index, so it
        # is passed here, and --require-hashes means neither index can substitute a file.
        # The test tooling is hash-pinned too (G-06 / GAP-033): requirements-dev.lock is compiled
        # against requirements.lock as a constraint, so a package in both carries one version.
        # Two installs because pip resolves each command's requirement set on its own.
        run: |
          pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock

      # Audit FSA-081: every engine-backed speech and OCR test is skipif-gated on these binaries,
      # and none had run anywhere but a contributor's machine. The Dockerfile installs the same
      # packages, so this is the image's behaviour being tested, not a CI-only one.
      - name: Install speech and OCR engines
        run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng tesseract-ocr

      - name: Dockerfile boots aura_service (AURA-012)
        run: |
          grep -q 'aura_service:app' Dockerfile
          grep -q 'requirements.lock' Dockerfile
          ! grep -E '^\s*CMD\b' Dockerfile | grep -q 'main:app'

      - name: Syntax check (full tree)
        run: |
          python -c "
          import ast, os
          for root, _, files in os.walk('.'):
              if any(seg in root for seg in ('venv', '__pycache__', '.git')):
                  continue
              for f in files:
                  if f.endswith('.py'):
                      p = os.path.join(root, f)
                      ast.parse(open(p, encoding='utf-8').read(), p)
          print('Syntax OK')
          "

      - name: aura_core suite (pytest)
        # --cov-fail-under is a ratchet, not a target (audit F-37): 83.4% of aura_core was covered
        # when it was set (2026-10-30, Python 3.11, local run), and the floor sits one point under
        # that to absorb run-to-run skips. Raise it as coverage rises; never lower it to land a PR.
        run: pytest tests --cov=aura_core --cov-report=term --cov-fail-under=82

      - name: Architecture fitness functions
        # Called out as its own step so a layering violation reads as a
        # layering violation in the checks list, not as "some test failed".
        run: pytest tests/architecture -q

      - name: Legacy suite (unittest)
        env:
          TESTING: "True"
        # unittest has no exclude, so discovery still *imports* the modules
        # under tests/ before finding no TestCase subclasses in them. That is
        # why requirements-dev.txt is installed above even for this step:
        # without pytest on the runner, every one of those imports raises and
        # the failure reads as "legacy suite broken" rather than "wrong
        # runner".
        #
        # Under coverage for the platform packages the aura_core ratchet above does not see
        # (audit G-05): api/, services/, infrastructure/ -- ADR-002's permanent adapters, JWT and
        # sync included. Reported, not yet floored: the first measured number sets the floor.
        run: |
          python -m coverage run --source=api,services,infrastructure -m unittest discover -p "test_*.py"
          python -m coverage report --skip-empty

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aura_backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: aura_backend/requirements.lock

      - name: Audit lockfile (AURA-020)
        # --disable-pip: audit the pins as written rather than installing them.
        # Fail on known CVEs. Do not mass-upgrade here: scan first, upgrade with tests later.
        #
        # torch is pinned to the CPU wheel (2.13.0+cpu, see requirements.lock). A local
        # version specifier has no PyPI entry, and pip-audit silently *skips* what it cannot
        # resolve -- which would drop torch out of the scan while still reporting success.
        # Strip the local segment for the scan only: the CPU wheel is built from the same
        # source as the PyPI release, so upstream advisories apply unchanged.
        #
        # The lock is hash-pinned (F-38), and the +cpu hashes cannot match PyPI's torch files,
        # so the scan reads bare `name==version` lines: the pin lines, with the trailing
        # continuation backslash and the local segment removed. Nothing is installed here, so
        # dropping the hashes for the scan loses no protection. The two checks after it fail the
        # job if the extraction ever leaves a hash or backslash behind, or loses torch.
        run: |
          pip install pip-audit
          grep -E '^[A-Za-z0-9._-]+==' requirements.lock \
            | sed -E 's/[[:space:]]*\\$//; s/\+[A-Za-z0-9.]+$//' > /tmp/audit.lock
          if grep -q -e '--hash' -e '[\]' /tmp/audit.lock || ! grep -qx 'torch==[0-9.]*' /tmp/audit.lock; then
            echo "::error::could not reduce requirements.lock to name==version pins for pip-audit"
            exit 1
          fi
          # No pipe here: the default shell has no pipefail, so `pip-audit | tee` would
          # report tee's status and swallow a CVE finding.
          pip-audit --disable-pip --no-deps -r /tmp/audit.lock > /tmp/audit.out 2>&1 || {
            cat /tmp/audit.out
            exit 1
          }
          cat /tmp/audit.out
          if grep -q "could not be audited" /tmp/audit.out; then
            echo "::error::pip-audit skipped a pinned package, so it was not scanned"
            exit 1
          fi

  # P1.3: backup encryption / manifest / retention / offsite-verification logic
  # (deploy/scripts/backup-lib.sh). Shell, so neither pytest suite sees it. No Docker, no network:
  # the test round-trips real age encryption in temp dirs and stubs rclone onto a local directory.
  # Proves the logic, not a real backup -- that needs a drill on the VPS with encryption on.
  backup-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -y -q age

      - name: shellcheck backup scripts
        # shellcheck is preinstalled on GitHub's Ubuntu runners. -s sh: these run under busybox
        # ash in the backup image, so bashisms are errors.
        run: |
          shellcheck -x -s sh \
            deploy/scripts/backup-lib.sh deploy/scripts/backup.sh deploy/scripts/backup-open.sh \
            deploy/scripts/restore.sh deploy/scripts/restore-drill.sh \
            deploy/scripts/tests/test_backup_crypto.sh

      - name: Backup crypto / integrity / retention tests
        env:
          REQUIRE_AGE: "1"
        # dash (Ubuntu's sh), not bash, to keep the library POSIX.
        run: sh deploy/scripts/tests/test_backup_crypto.sh

  # The `*_postgres` tests under tests/load (audit F-37). They are opt-in (`-m load`) and skip
  # unless AURA_TEST_DATABASE_URL is set, so before this job no CI run had ever executed them --
  # against CLAUDE.md's own rule that a Postgres-backed change is verified against a real Postgres.
  # Each test creates its own database and migrates it with `alembic upgrade head`, so this also
  # proves the migration chain applies to an empty database. Only the Postgres files are selected:
  # the rest of tests/load needs Qdrant, Redis, Ollama or Docker.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aura_backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            aura_backend/requirements.lock
            aura_backend/requirements-dev.lock

      - name: Install dependencies
        # Hash-checked (F-38): every artefact must match a hash recorded in requirements.lock.
        # The lock names no index; torch's +cpu wheel exists only on PyTorch's CPU index, so it
        # is passed here, and --require-hashes means neither index can substitute a file.
        # The test tooling is hash-pinned too (G-06 / GAP-033): requirements-dev.lock is compiled
        # against requirements.lock as a constraint, so a package in both carries one version.
        # Two installs because pip resolves each command's requirement set on its own.
        run: |
          pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Postgres adapter tests (real database)
        env:
          AURA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        # `-rs` lists skips, so a test that silently stopped reaching the database is visible.
        run: pytest tests/load/*_postgres.py -m load -q -rs

      # The legacy tree's seven Postgres integration suites (audit G-05). They used to need a
      # Docker daemon for a testcontainers Postgres and so ran only where one happened to be;
      # legacy_postgres.py gives each suite a fresh database on this job's server instead.
      # `-v` so a suite that silently skipped reads as skipped, not as passed.
      - name: Legacy integration suites (real database)
        env:
          TESTING: "True"
          AURA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          python -m unittest discover -p "test_*_integration.py" -v 2>&1 | tee legacy-integration.log
          ! grep -q "skipped=" legacy-integration.log

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image (no push — build-only gate)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: aura_backend
          push: false
          tags: aura-backend:ci

      # The engineer agent's workspace image. Built here because otherwise nothing builds it at
      # all: it is behind the `sandbox` compose profile, so the first attempt would be on the VPS
      # during a deploy, where a broken base digest or apt layer is indistinguishable from the
      # feature itself failing. This proves the pinned digest still resolves and uid 10001 exists.
      - name: Build sandbox image (no push — build-only gate)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: deploy/sandbox
          push: false
          tags: aura-sandbox:ci

      # The backup sidecar's image. Built here so the pinned Alpine branch and the `age~1.3`
      # constraint (P1.3) are proven to resolve before a deploy depends on them; the Dockerfile's
      # own `age --version` fails the build if the binary is missing.
      - name: Build backup image (no push — build-only gate)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: deploy/backup
          push: false
          tags: aura-backup:ci

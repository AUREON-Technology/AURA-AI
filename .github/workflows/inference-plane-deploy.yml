name: Deploy Inference Plane (Hugging Face)

# Validates and (on main, once configured) deploys deploy/spaces/inference-vllm/ to a Hugging
# Face Space. Independent of the Control Plane's Railway deploy (control-plane-deploy.yml) --
# path-filtered so the two never trigger each other. See docs/deployment/inference-plane.md.
#
# Required for the deploy job (repo Settings -> Secrets and variables -> Actions):
#   secrets.HF_TOKEN     Hugging Face access token with write access to the target Space.
#   vars.HF_SPACE_ID     "<namespace>/<space-name>", e.g. "your-org/aura-inference-vllm".
#
# Set vars.INFERENCE_DEPLOY_REQUIRED=true once the Space exists. Until then a missing token
# skips the deploy with a notice; after it, a missing token FAILS the run -- "skipped" reads as
# success everywhere it is displayed, which is how a dead deploy path stays unnoticed.

on:
  pull_request:
    paths:
      - "deploy/spaces/inference-vllm/**"
      - ".github/workflows/inference-plane-deploy.yml"
  push:
    branches: [main]
    paths:
      - "deploy/spaces/inference-vllm/**"

concurrency:
  group: deploy-inference-plane
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint entrypoint.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck deploy/spaces/inference-vllm/entrypoint.sh

      - name: Free runner disk (the vLLM base image is ~20 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && docker image prune -af

      - name: Build the Space image
        run: docker build -t aura-inference-vllm-ci deploy/spaces/inference-vllm

      - name: Startup validation (must refuse to boot without VLLM_API_KEY)
        run: |
          set +e
          out=$(docker run --rm aura-inference-vllm-ci 2>&1)
          status=$?
          set -e
          echo "$out"
          test "$status" -ne 0
          echo "$out" | grep -q "FATAL: VLLM_API_KEY is not set"

      - name: Configuration validation (Control Plane / Inference Plane contract)
        working-directory: aura_backend
        run: |
          # Two installs: the lock is hash-pinned (F-38) and requirements-dev.txt is not, and pip
          # refuses to mix them in one command.
          python -m pip install --quiet --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock 2>/dev/null || true
          python -m pip install --quiet -r requirements-dev.txt 2>/dev/null || true
          python -m pytest tests/deployment/test_inference_contract.py -q

  # Whether the Space is configured, decided in a step rather than in a job-level `if:`.
  # `secrets` is not among the contexts GitHub exposes to `jobs.<id>.if` (only `github`,
  # `needs`, `vars` and `inputs`), so referencing it there does not evaluate false -- it makes
  # the file unevaluable and the entire run a startup failure with zero jobs, including
  # `validate`, which has no secret reference of its own. That is why this file failed in 0
  # seconds with nothing to read. A step can see `secrets`, so the check lives there.
  preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check deploy configuration
        id: check
        env:
          # Tested for emptiness only -- never echoed, never written to an output.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          DEPLOY_REQUIRED: ${{ vars.INFERENCE_DEPLOY_REQUIRED }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$HF_TOKEN" ]    || missing+=("secrets.HF_TOKEN")
          [ -n "$HF_SPACE_ID" ] || missing+=("vars.HF_SPACE_ID")

          if [ ${#missing[@]} -eq 0 ]; then
            echo "All required Hugging Face settings are present."
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Not configured: %s\n' "${missing[*]}"
          if [ "${DEPLOY_REQUIRED:-}" = "true" ]; then
            echo "::error::Inference Plane deploy is marked required (vars.INFERENCE_DEPLOY_REQUIRED=true) but these are unset: ${missing[*]}. See docs/deployment/inference-plane.md."
            exit 1
          fi
          echo "::notice::Hugging Face Space is not configured yet (${missing[*]} unset) -- deploy skipped. Set vars.INFERENCE_DEPLOY_REQUIRED=true once it is."
          echo "configured=false" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [validate, preflight]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install -U huggingface_hub

      - name: Publish/update Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          HfApi().upload_folder(
              repo_id=os.environ['HF_SPACE_ID'],
              repo_type='space',
              folder_path='deploy/spaces/inference-vllm',
          )
          "

      - name: Wait for the Space to build and report ready
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          python -c "
          import os, sys
          from huggingface_hub import HfApi
          api = HfApi()
          info = api.space_runtime(os.environ['HF_SPACE_ID'])
          print('stage:', info.stage)
          sys.exit(0 if info.stage == 'RUNNING' else 1)
          " || echo "::warning::Space did not report RUNNING immediately -- check the Space logs; cold builds can take several minutes."

  # Kept as a distinct, visible row so an unconfigured deploy is legible in the checks list
  # rather than simply absent. The notice itself is emitted by preflight.
  not-configured:
    needs: preflight
    if: needs.preflight.outputs.configured == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hugging Face Space deploy not configured -- see the preflight job's notice and docs/deployment/inference-plane.md."

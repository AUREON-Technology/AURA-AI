name: Real-Model Evaluation

# Every AI-quality number in the repository came from the hash embedder and scripted providers
# (audit FSA-082 / G-02 / G-09). That is right for the merge gate in eval-ci.yml, which has to be
# deterministic, and useless as a measurement of what users get. This workflow is the measurement:
# the agent suite through the real kernel against a real hosted provider and the production
# embedder, and the vision evaluator against a live gateway, on a schedule and on demand.
#
# It reports; it does not gate. The scripted baselines are tautological (1.0/1.0/1.0 by
# construction), so `--baseline` is deliberately absent. Results are uploaded as artifacts and
# summarised; the owner commits the first report under docs/reports/ (GAP-021's exit evidence).
#
# Credentials and slot settings are read the way verify-hosted-inference.yml reads them:
#   secrets.AURA_HOSTED1_API_KEY            the hosted provider's key (required)
#   vars.AURA_HOSTED1_BASE_URL / _MODEL     the slot; the openrouter-free preset applies when unset
#   vars.AURA_EVAL_HOSTED1_MAX_DATA_CLASSIFICATION   `internal` (default) or `sensitive`; a `:free`
#                                           model can never be raised, so with the preset every turn
#                                           that touches memory or documents has no provider -- the
#                                           report shows that, which is itself a finding (FSA-024)
#   secrets.AURA_EVAL_TOKEN                 a user access token for the vision run (optional)
# Missing credentials end the run with a notice and no results, never with a pass.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Agent suite to run through the real kernel"
        type: choice
        default: agent_tasks
        options: [agent_tasks, agent_runs]
      vision_base_url:
        description: "Gateway origin for the vision evaluator (empty = skip the vision run)"
        type: string
        default: ""
      vision_label:
        description: "Report label for the vision run"
        type: string
        default: "gateway"
  schedule:
    # Weekly, Monday 02:47 UTC: off the hour, outside the 06:00-09:00 Pacific congestion window.
    - cron: "47 2 * * 1"

permissions:
  contents: read

concurrency:
  group: real-model-eval
  cancel-in-progress: false

jobs:
  agent-eval:
    name: Agent suite (real provider, real embedder)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: aura_backend
    # Each slot setting: the variable when it is set, else the openrouter-free preset's value.
    env:
      HOSTED1_BASE_URL: ${{ vars.AURA_HOSTED1_BASE_URL || 'https://openrouter.ai/api/v1' }}
      HOSTED1_MODEL: ${{ vars.AURA_HOSTED1_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
      HOSTED1_ALLOW_TRAINING: ${{ vars.AURA_HOSTED1_ALLOW_PROMPT_TRAINING || 'true' }}
      HOSTED1_EXTRA_BODY: ${{ vars.AURA_HOSTED1_EXTRA_BODY || '{"reasoning":{"enabled":false}}' }}
      HOSTED1_RPM: ${{ vars.AURA_HOSTED1_RPM || '20' }}
      HOSTED1_RPD: ${{ vars.AURA_HOSTED1_RPD || '50' }}
      HOSTED1_CONTEXT: ${{ vars.AURA_HOSTED1_CONTEXT_WINDOW || '32768' }}
      HOSTED1_CEILING: ${{ vars.AURA_EVAL_HOSTED1_MAX_DATA_CLASSIFICATION || 'internal' }}
      EVAL_SUITE: ${{ inputs.suite || 'agent_tasks' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Decided in a step, not a job-level `if:`: `secrets` is not a context GitHub evaluates
      # there (see control-plane-deploy.yml for the failure that taught this).
      - name: Check configuration
        id: check
        env:
          HOSTED1_API_KEY: ${{ secrets.AURA_HOSTED1_API_KEY }}
        run: |
          if [ -z "$HOSTED1_API_KEY" ]; then
            echo "::notice::Real-model evaluation skipped: secrets.AURA_HOSTED1_API_KEY is unset. This is NOT a pass -- no measurement was made (GAP-021 stays open)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "slot: $HOSTED1_MODEL at $HOSTED1_BASE_URL, ceiling $HOSTED1_CEILING, suite $EVAL_SUITE"

      - name: Set up Python
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            aura_backend/requirements.lock
            aura_backend/requirements-dev.lock

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        # Both locks hash-checked (F-38, G-06); two installs because pip resolves each command's
        # requirement set on its own. The runtime lock carries sentence-transformers.
        run: |
          pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Run the agent suite through the real kernel
        if: steps.check.outputs.configured == 'true'
        env:
          AURA_ENVIRONMENT: "local"
          AURA_JWT_SECRET: "real-model-eval-only"
          AURA_ALLOW_REMOTE_INFERENCE: "false"
          AURA_ALLOW_HOSTED_INFERENCE: "true"
          AURA_LLM_PROVIDERS: "hosted1"
          AURA_PROVIDER_HOSTED1_KIND: openai_compatible
          AURA_PROVIDER_HOSTED1_BASE_URL: ${{ env.HOSTED1_BASE_URL }}
          AURA_PROVIDER_HOSTED1_MODEL: ${{ env.HOSTED1_MODEL }}
          AURA_PROVIDER_HOSTED1_API_KEY: ${{ secrets.AURA_HOSTED1_API_KEY }}
          AURA_PROVIDER_HOSTED1_ALLOW_PROMPT_TRAINING: ${{ env.HOSTED1_ALLOW_TRAINING }}
          AURA_PROVIDER_HOSTED1_EXTRA_BODY: ${{ env.HOSTED1_EXTRA_BODY }}
          AURA_PROVIDER_HOSTED1_RPM: ${{ env.HOSTED1_RPM }}
          AURA_PROVIDER_HOSTED1_RPD: ${{ env.HOSTED1_RPD }}
          AURA_PROVIDER_HOSTED1_CONTEXT_WINDOW: ${{ env.HOSTED1_CONTEXT }}
          AURA_PROVIDER_HOSTED1_MAX_DATA_CLASSIFICATION: ${{ env.HOSTED1_CEILING }}
          # The production embedder (docs/deployment/control-plane.md), never the hash one.
          AURA_EMBEDDING_PROVIDER: sentence-transformers
          AURA_EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          AURA_EMBEDDING_DIMENSION: "384"
        run: |
          python -m evaluation.runner --suite "$EVAL_SUITE" --output "real-model-eval-$EVAL_SUITE.json" --max-turns 8 --timeout 120 | tee "real-model-eval-$EVAL_SUITE.log"

      - name: Summarise
        if: always() && steps.check.outputs.configured == 'true'
        run: |
          {
            echo "## Real-model evaluation: $EVAL_SUITE"
            echo
            echo "Provider \`$HOSTED1_MODEL\` at \`$HOSTED1_BASE_URL\`, data ceiling \`$HOSTED1_CEILING\`, embedder \`BAAI/bge-small-en-v1.5\`."
            echo
            echo '```'
            sed -n '/^=== /,$p' "real-model-eval-$EVAL_SUITE.log" 2>/dev/null || echo "no summary (the run failed before reporting)"
            echo '```'
            echo
            echo "Report, not gate: commit the results JSON under docs/reports/ as GAP-021's evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always() && steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-model-eval-${{ env.EVAL_SUITE }}
          path: |
            aura_backend/real-model-eval-*.json
            aura_backend/real-model-eval-*.log
          if-no-files-found: ignore

  vision-eval:
    name: Vision evaluator (live gateway)
    if: inputs.vision_base_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: aura_backend
    env:
      VISION_BASE_URL: ${{ inputs.vision_base_url }}
      VISION_LABEL: ${{ inputs.vision_label || 'gateway' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check configuration
        id: check
        env:
          AURA_EVAL_TOKEN: ${{ secrets.AURA_EVAL_TOKEN }}
        run: |
          if [ -z "$AURA_EVAL_TOKEN" ]; then
            echo "::notice::Vision evaluation skipped: secrets.AURA_EVAL_TOKEN is unset. This is NOT a pass -- no measurement was made (G-09 stays open)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            aura_backend/requirements.lock
            aura_backend/requirements-dev.lock

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: |
          pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Run the vision evaluator against the gateway
        if: steps.check.outputs.configured == 'true'
        env:
          AURA_EVAL_TOKEN: ${{ secrets.AURA_EVAL_TOKEN }}
        run: |
          mkdir -p vision-report
          python -m evaluation.vision_eval run --target gateway --base-url "$VISION_BASE_URL" \
            --label "$VISION_LABEL" --report-dir vision-report | tee vision-report/run.log

      - name: Upload report
        if: always() && steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vision-eval-${{ env.VISION_LABEL }}
          path: aura_backend/vision-report/
          if-no-files-found: ignore

name: Host Daemon CI

# aura_hostd is a pure-Dart package (no Flutter dependency), so this uses dart-lang/setup-dart
# directly rather than the Flutter action client-ci.yml needs. It is its own workflow rather than
# a job bolted onto client-ci.yml because it gates on a different path and has nothing in common
# with the Flutter build/test steps there.

on:
  pull_request:
    paths:
      - "aura_hostd/**"
      - ".github/workflows/hostd-ci.yml"
  push:
    branches: [main]
    paths:
      - "aura_hostd/**"

permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight; runs on main are never cancelled, so
# every merge keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    # The suite takes well under a minute. This bounds any hang that keeps the test process from
    # exiting (PosixPtySession's reader isolate blocked in read() once did, up to GitHub's 6-hour
    # job limit) instead of letting it run to that limit.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aura_hostd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Dart 3.12.2 is the SDK Flutter 3.44.6 ships (client-ci.yml's pin), so the daemon and the
      # desktop client are analyzed by the same toolchain. Satisfies pubspec.yaml's ^3.11.4.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.12.2"

      # control_server_test's debug-console case spawns a real `python -m debugpy` (the DAP
      # server debug_session_manager.dart tunnels); without it the case fails with
      # process_exited rather than exercising the tunnel.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install debugpy
        run: python -m pip install debugpy==1.8.22

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

  analyze-and-test-windows:
    # aura_hostd is "Windows-first" (ADR-015/docs/architecture/015-desktop-ide.md) and has
    # Windows-specific code (ConPTY via win32/ffi in pty_session.dart, containment.dart's
    # symlink/junction resolution) that had zero Windows CI coverage before this job existed --
    # nothing Windows-specific here had ever actually run anywhere but a contributor's own
    # machine. It was continue-on-error until a green run was observed; that run was PR #221
    # (2026-11-08, run 42518363353), so a red Windows job now fails the run, as client-ci.yml's
    # build-windows already does (audit G-03 / FSA-063).
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aura_hostd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.12.2"

      # control_server_test's debug-console case spawns a real `python -m debugpy` (the DAP
      # server debug_session_manager.dart tunnels); without it the case fails with
      # process_exited rather than exercising the tunnel.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install debugpy
        run: python -m pip install debugpy==1.8.22

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

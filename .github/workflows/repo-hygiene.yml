name: Repo Hygiene

# Repository-wide checks that no app's own CI covers, because each of those is path-filtered to
# its own directory (audit F-37, CB-13, CB-30):
#
#   * actionlint -- every workflow file, including shellcheck over its `run:` scripts. Before this,
#     a typo in a workflow surfaced only when the workflow next fired (CB-07's remedy names it).
#   * tracked artefacts -- scripts/check_tracked_artifacts.py fails if the git index holds an APK,
#     an executable, a log, a local database or any file over 5 MB. An APK added under
#     aura_client/ would never trigger Backend CI, so this runs on every PR whatever it touches.
#
# Stdlib Python and one pinned, checksum-verified binary: nothing new runs with the job's token.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: "1.7.12"
  # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's own checksums file.
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint

      # shellcheck is preinstalled on GitHub's Ubuntu runners, so actionlint also lints every
      # `run:` script. Config (per-file ignores, with reasons): .github/actionlint.yaml.
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  tracked-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: No build artefacts, binaries or logs in the index
        run: python3 scripts/check_tracked_artifacts.py

      # The same file also pins the workflows themselves (actions by SHA, Flutter/Dart by exact
      # version, Admin CI on PRs). Backend CI runs it too, but only when aura_backend/ changes, so
      # a workflow-only PR would otherwise skip it. It imports nothing from the backend, hence
      # --noconftest and pytest alone.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Workflow pin checks
        working-directory: aura_backend
        run: |
          python -m pip install --quiet "pytest==9.2.0"  # the version the dev lock pins
          python -m pytest --noconftest -p no:cacheprovider tests/unit/test_repo_hygiene.py

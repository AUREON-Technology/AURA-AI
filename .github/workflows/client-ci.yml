name: Client CI

# Doc/V2_BLUEPRINT.md §10/§11 — gate every PR touching aura_client on
# `flutter analyze` and the full test suite (32 tests as of Phase 4: design
# system contrast, SSE/marker parsing, encryption, AI routing, inference,
# widget smoke test). Android and Linux builds are release-config smoke tests, not
# store-ready/packaged builds (no signing config wired in CI, no packaging step for Linux).

on:
  pull_request:
    paths:
      - "aura_client/**"
      - ".github/workflows/client-ci.yml"
  push:
    branches: [main]
    paths:
      - "aura_client/**"
      - ".github/workflows/client-ci.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aura_client
    steps:
      - uses: actions/checkout@v4

      # Pin Flutter to a version verified (by a real local run, not just claimed) to ship a
      # Dart SDK satisfying pubspec.yaml's `sdk: ^3.11.4`. Two prior pins here (3.35.0 -> Dart
      # 3.9.0, then 3.38.0 -> Dart 3.10.0-beta) both silently failed `flutter pub get`'s version
      # solving on every run, so analyze/test never actually executed despite the job reporting
      # green on unrelated grounds. 3.44.6 ships Dart 3.12.2, confirmed against this pubspec.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate Drift codegen
        run: dart run build_runner build --delete-conflicting-outputs

      # `flutter analyze` fails on warnings as well as errors, which is the right gate here.
      #
      # The previous comment claimed 61 pre-existing info/warning lints made that impossible. That
      # is no longer true and may never have been measurable: this step had never run, because the
      # pinned Flutter version could not resolve the pubspec's Dart constraint. On its first real
      # execution the whole client produced 2 warnings, both unused imports.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      # The release APK build ran the runner out of disk at Gradle `mergeJavaRes` ("No space left
      # on device", Client CI runs 142-143). The image carries toolchains this job never uses;
      # removing them frees well over 20 GB. Kept: the Android SDK (/usr/local/lib/android) and
      # the JDK, which this build needs. Inline rather than a third-party action, so nothing new
      # runs with the job's token.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@v4

      # Pin Flutter to a version with Dart >= 3.11.4 (pubspec constraint: sdk: ^3.11.4).
      # 3.44.6 ships Dart 3.12.2, confirmed by a real local `flutter pub get`/`analyze`/`test`
      # run against this pubspec — the previous 3.38.0 pin actually ships Dart 3.10.0-beta and
      # failed version solving on every CI run.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        working-directory: aura_client
        run: flutter pub get

      - name: Regenerate Drift codegen
        working-directory: aura_client
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK (unsigned — build-only gate, not a publishable artifact)
        working-directory: aura_client
        run: flutter build apk --release --dart-define=BACKEND_URL=https://staging.placeholder.invalid

  build-windows:
    # docs/architecture/015-desktop-ide.md (Desktop IDE, Phase K) — build-only gate for the
    # Windows desktop target the Desktop IDE work targets first. Non-blocking for the Desktop
    # IDE's D1-D3 merge until proven green here (see scripts/run_desktop_stack.ps1's own docs);
    # required from D4 onward. Does not run or package aura_hostd, same as build-linux.
    runs-on: windows-latest
    needs: analyze-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # See analyze-and-test's own comment: 3.44.6 ships Dart 3.12.2, satisfying pubspec.yaml's
      # `sdk: ^3.11.4`; the previous 3.38.0 pin did not and failed `flutter pub get` on every run.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: aura_client
        run: flutter pub get

      - name: Regenerate Drift codegen
        working-directory: aura_client
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: aura_client
        run: flutter analyze

      - name: Test
        working-directory: aura_client
        run: flutter test

      - name: Build release Windows bundle (build-only gate, not a publishable artifact)
        working-directory: aura_client
        run: flutter build windows --release --dart-define=BACKEND_URL=https://staging.placeholder.invalid

  build-linux:
    # ADR-011 (docs/architecture/011-desktop-engineer-agent.md) Unit 9. Build-only gate for the
    # Linux desktop target `aura_client/linux/` already carries — this never ran in CI before,
    # so a desktop-only regression (a plugin with no Linux implementation, a missing native dep)
    # could land unnoticed. Does not run or package `aura_hostd`; that stays a separate,
    # user-configured executable (see scripts/deploy_client_desktop.sh).
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      # See analyze-and-test's own comment: 3.44.6 ships Dart 3.12.2, satisfying pubspec.yaml's
      # `sdk: ^3.11.4`; the previous 3.38.0 pin did not and failed `flutter pub get` on every run.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"

      # Flutter's Linux desktop embedder needs GTK 3 and a native build toolchain that
      # ubuntu-latest doesn't ship by default. The rest of this list is not Flutter's own
      # requirement -- each was pulled in by a plugin's native Linux build failing without it,
      # confirmed one at a time by this job's own real runs: libgstreamer1.0-dev/
      # libgstreamer-plugins-base1.0-dev (audioplayers_linux's CMakeLists.txt,
      # `pkg_check_modules(... gstreamer-1.0 ...)`), libsecret-1-dev
      # (flutter_secure_storage_linux's CMakeLists.txt, `libsecret-1`), libasound2-dev
      # (flutter_soloud vendors SoLoud's own ALSA backend, which fails to compile without
      # `alsa/asoundlib.h` even though its CMake configure step succeeds).
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev libasound2-dev

      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        working-directory: aura_client
        run: flutter pub get

      - name: Regenerate Drift codegen
        working-directory: aura_client
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release Linux bundle (build-only gate, not a publishable artifact)
        working-directory: aura_client
        run: flutter build linux --release --dart-define=BACKEND_URL=https://staging.placeholder.invalid

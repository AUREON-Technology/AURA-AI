name: Client CI

# Doc/V2_BLUEPRINT.md §10/§11 — gate every PR touching aura_client on
# `flutter analyze` and the full test suite (32 tests as of Phase 4: design
# system contrast, SSE/marker parsing, encryption, AI routing, inference,
# widget smoke test). Android build is a release-config smoke test, not a
# store-ready build (no signing config wired in CI).

on:
  pull_request:
    paths:
      - "aura_client/**"
      - ".github/workflows/client-ci.yml"
  push:
    branches: [main]
    paths:
      - "aura_client/**"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aura_client
    steps:
      - uses: actions/checkout@v4

      # No flutter-version pin. Pinning one here duplicates the Dart constraint that
      # aura_client/pubspec.yaml already states (`sdk: ^3.11.4`), in a form that rots silently:
      # this job was pinned to Flutter 3.35.0, which ships Dart 3.9.0, so `flutter pub get`
      # failed version solving on every run and the analyze and test steps below had never
      # executed. Resolving `stable` keeps the pubspec as the single source of truth for what
      # the code needs. `^3.11.4` still excludes Dart 4, so this cannot silently jump a major.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate Drift codegen
        run: dart run build_runner build --delete-conflicting-outputs

      # `flutter analyze` fails on warnings as well as errors, which is the right gate here.
      #
      # The previous comment claimed 61 pre-existing info/warning lints made that impossible. That
      # is no longer true and may never have been measurable: this step had never run, because the
      # pinned Flutter version could not resolve the pubspec's Dart constraint. On its first real
      # execution the whole client produced 2 warnings, both unused imports.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      # No flutter-version pin. Pinning one here duplicates the Dart constraint that
      # aura_client/pubspec.yaml already states (`sdk: ^3.11.4`), in a form that rots silently:
      # this job was pinned to Flutter 3.35.0, which ships Dart 3.9.0, so `flutter pub get`
      # failed version solving on every run and the analyze and test steps below had never
      # executed. Resolving `stable` keeps the pubspec as the single source of truth for what
      # the code needs. `^3.11.4` still excludes Dart 4, so this cannot silently jump a major.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        working-directory: aura_client
        run: flutter pub get

      - name: Regenerate Drift codegen
        working-directory: aura_client
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK (unsigned — build-only gate, not a publishable artifact)
        working-directory: aura_client
        run: flutter build apk --release --dart-define=BACKEND_URL=https://staging.placeholder.invalid

name: Agent Evaluation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Evaluation suite to run'
        required: false
        default: 'agent_tasks'
        type: string
      baseline:
        description: 'Path to baseline JSON for regression gate'
        required: false
        type: string

permissions:
  contents: read

jobs:
  eval:
    name: Agent Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            aura_backend/requirements.lock
            aura_backend/requirements.txt
            aura_backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: aura_backend
        run: pip install -r requirements.lock -r requirements-dev.txt

      - name: Run agent evaluation
        working-directory: aura_backend
        env:
          AURA_DATABASE_URL: sqlite+aiosqlite:///:memory:
          AURA_JWT_SECRET: test-secret
          AURA_ALLOW_REMOTE_INFERENCE: "false"
        run: |
          python -m evaluation.runner --suite ${{ github.event.inputs.suite }} --max-turns 8 --timeout 60

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: aura_backend/evaluation-results*.json
name: Desktop Main Channel

# Every push to main that touches the desktop app (or its daemon, or the install page) builds the
# Windows installer and publishes it on the install page, https://web.aureon-ai.tech/desktop-ide/install,
# so a person can install the newest build from the website WITHOUT any access to the repository.
#
#   build       (Windows runner)  Flutter Windows release + aura_hostd + Inno Setup installer, then
#                                 latest.json (commit, version, installer name/size/SHA-256).
#   deploy-web  (Linux runner)    puts the installer and latest.json into aura_web/build-assets/ and
#                                 `railway up`s the AURA-Web service, then checks that the live
#                                 site reports THIS commit.
#
# Why the build is not on Railway: Railway runs Linux containers and Flutter cannot cross-build a
# Windows app from Linux, so the Windows build needs a Windows machine. This is also the packaging
# desktop-package.yml uses (bundled aura_hostd, Inno Setup installer), which
# scripts/deploy_client_desktop.ps1 alone does not produce. Railway only HOSTS the result.
#
# One-time setup (repository settings): the secret RAILWAY_WEB_TOKEN, a Railway PROJECT token for
# the `production` environment of project `intuitive-adaptation`. Without it deploy-web fails
# loudly instead of skipping.
#
# What this is NOT:
# - It is not the update channel installed apps read. That is desktop-package.yml's signed
#   desktop-v<version> releases, marked "latest".
# - It is not gated like a release: no `release` environment, because it holds no update-signing
#   key and changes nothing an installed app trusts. A main build is exactly as trustworthy as main
#   (which the Railway auto-deploy already ships ungated). Authenticode signing is applied when the
#   AURA_WINDOWS_SIGNING_* secrets desktop-package.yml uses exist.
#
# Served files (stable names): /desktop-ide/download/latest.json,
# /desktop-ide/download/aura-desktop-windows-x64-setup.exe, /desktop-ide/download/AURA-Desktop-Setup.cmd

on:
  push:
    branches: [main]
    paths:
      - "aura_client/**"
      - "aura_hostd/**"
      - "aura_web/**"
      - "scripts/AURA-Desktop-Setup.cmd"
      - ".github/workflows/desktop-main-channel.yml"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL to bake into the build"
        required: false
        default: "https://api.aureon-ai.tech"

permissions:
  contents: read

# Queue, never cancel: a run cancelled halfway through a deploy could leave the site mid-update.
# GitHub keeps only the newest waiting run.
concurrency:
  group: desktop-main-channel
  cancel-in-progress: false

env:
  BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://api.aureon-ai.tech' }}
  APP_BASE_URL: ${{ vars.APP_BASE_URL || '' }}
  UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/desktop-update.json
  INSTALLER_BASENAME: aura-desktop-windows-x64-setup
  SITE_URL: https://web.aureon-ai.tech

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.6"

      - name: Read the app version
        id: version
        run: |
          $line = Select-String -Path aura_client/pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $version = ($line.Matches[0].Groups[1].Value -split '\+')[0]
          $short = $env:GITHUB_SHA.Substring(0, 7)
          "version=$version" >> $env:GITHUB_OUTPUT
          "display=$version-main.$short" >> $env:GITHUB_OUTPUT

      - name: Compile aura_hostd
        working-directory: aura_hostd
        run: |
          dart pub get
          # `dart compile exe` does not create the output directory.
          New-Item -ItemType Directory -Force -Path build | Out-Null
          dart compile exe bin/aura_hostd.dart -o build/aura_hostd.exe

      # AURA_APP_VERSION is the plain pubspec version and the manifest URL is the stable channel's:
      # to the in-app update check this build is that version, so it is offered the next signed
      # desktop-v release as usual and never a main build.
      - name: Build the Windows release
        working-directory: aura_client
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build windows --release --dart-define=BACKEND_URL=$env:BACKEND_URL `
            --dart-define=APP_BASE_URL=$env:APP_BASE_URL `
            --dart-define=AURA_APP_VERSION=${{ steps.version.outputs.version }} `
            --dart-define=AURA_UPDATE_MANIFEST_URL=$env:UPDATE_MANIFEST_URL

      - name: Bundle aura_hostd next to the app
        run: Copy-Item aura_hostd/build/aura_hostd.exe aura_client/build/windows/x64/runner/Release/

      # No arguments prints usage and exits 64 (bin/aura_hostd.dart): proof the bundled binary
      # starts at all, without connecting anywhere.
      - name: Check the bundled daemon runs
        run: |
          & aura_client/build/windows/x64/runner/Release/aura_hostd.exe *> $null
          if ($LASTEXITCODE -ne 64) { throw "aura_hostd exited $LASTEXITCODE, expected 64 (usage)" }
          # Actions ends a pwsh step with `exit $LASTEXITCODE`; the 64 was the expected answer.
          $global:LASTEXITCODE = 0

      - name: Detect signing secrets
        id: signing
        env:
          CERT_B64: ${{ secrets.AURA_WINDOWS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ($env:CERT_B64 -and $env:CERT_PASSWORD) {
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::No Windows signing certificate configured; building unsigned."
          }

      - name: Sign the executables
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_B64: ${{ secrets.AURA_WINDOWS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
          $release = 'aura_client/build/windows/x64/runner/Release'
          foreach ($exe in "$release/aura_client.exe", "$release/aura_hostd.exe") {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw "signing $exe failed" }
          }
          Remove-Item $pfx

      # /F overrides OutputBaseFilename: the served installer has one stable name. The version
      # shown in "Apps & features" (and compared by the setup file) carries the commit.
      - name: Build the installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $release = (Resolve-Path aura_client/build/windows/x64/runner/Release).Path
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dist = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=${{ steps.version.outputs.display }}" "/DSourceDir=$release" "/DOutputDir=$dist" "/F$env:INSTALLER_BASENAME" aura_client/windows/installer/aura.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (-not (Test-Path "dist/$env:INSTALLER_BASENAME.exe")) { throw "ISCC did not write dist/$env:INSTALLER_BASENAME.exe" }

      - name: Sign the installer
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_B64: ${{ secrets.AURA_WINDOWS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/$env:INSTALLER_BASENAME.exe"
          if ($LASTEXITCODE -ne 0) { throw "signing the installer failed" }
          Remove-Item $pfx

      # Computed AFTER signing: signing changes the file's bytes, and the setup file verifies
      # exactly what is served.
      - name: Write latest.json
        run: |
          $installer = Get-Item "dist/$env:INSTALLER_BASENAME.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          [ordered]@{
            schema         = 1
            channel        = 'main'
            commit         = $env:GITHUB_SHA
            version        = '${{ steps.version.outputs.display }}'
            pubspecVersion = '${{ steps.version.outputs.version }}'
            builtAt        = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            installer      = [ordered]@{ name = $installer.Name; sha256 = $hash; size = $installer.Length }
          } | ConvertTo-Json -Depth 4 | Set-Content -Path dist/latest.json -Encoding utf8
          Get-Content dist/latest.json
          Get-ChildItem dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aura-desktop-main-windows-x64
          path: dist/
          retention-days: 14

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_WEB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the built installer
        run: |
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name aura-desktop-main-windows-x64 --dir artifacts
          ls -l artifacts

      # The manifest and the installer must belong together before anything is published.
      - name: Check the installer matches its manifest
        run: |
          set -euo pipefail
          want="$(python3 -c "import json; print(json.load(open('artifacts/latest.json'))['installer']['sha256'])")"
          have="$(sha256sum "artifacts/${INSTALLER_BASENAME}.exe" | cut -d' ' -f1)"
          if [ "$want" != "$have" ]; then
            echo "::error::installer SHA-256 ($have) does not match latest.json ($want)"
            exit 1
          fi

      # aura_web/Dockerfile builds from the repository root and copies aura_web/build-assets/ into
      # the image, so the staged tree has the same layout as the repo.
      - name: Stage the web service
        run: |
          set -euo pipefail
          mkdir -p stage/scripts
          cp -r aura_web stage/aura_web
          cp scripts/AURA-Desktop-Setup.cmd stage/scripts/
          cp "artifacts/${INSTALLER_BASENAME}.exe" artifacts/latest.json stage/aura_web/build-assets/
          ls -l stage/aura_web/build-assets

      - name: Deploy to Railway
        working-directory: stage
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::The RAILWAY_WEB_TOKEN secret is not set, so the install page cannot be updated. Create a Railway project token for the production environment and add it as that repository secret."
            exit 1
          fi
          npm install --global @railway/cli@5.23.0
          railway up --service AURA-Web --ci

      # Railway swaps the container only once the new one is healthy; wait for it and prove the
      # public site now offers THIS commit and the exact installer that was built.
      - name: Check the live site serves this build
        run: |
          set -euo pipefail
          want_size="$(python3 -c "import json; print(json.load(open('artifacts/latest.json'))['installer']['size'])")"
          for attempt in $(seq 1 30); do
            live="$(curl -fsS "${SITE_URL}/desktop-ide/download/latest.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['commit'])" || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then
              got_size="$(curl -fsSI "${SITE_URL}/desktop-ide/download/${INSTALLER_BASENAME}.exe" | tr -d '\r' | awk 'tolower($1)=="content-length:" {print $2}')"
              if [ "$got_size" = "$want_size" ]; then
                echo "Live site serves commit ${GITHUB_SHA} (installer ${got_size} bytes)."
                exit 0
              fi
              echo "attempt ${attempt}: commit matches but installer size is '${got_size}', expected ${want_size}"
            else
              echo "attempt ${attempt}: live commit is '${live}', waiting for ${GITHUB_SHA}"
            fi
            sleep 10
          done
          echo "::error::The live site did not start serving this build within 5 minutes."
          exit 1

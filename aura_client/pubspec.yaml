name: aura_client
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.0.1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to the application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  encrypt: ^5.0.3
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  firebase_core: ^4.10.0
  # google_generative_ai deliberately absent: the client must not be able to reach a hosted
  # inference API. All AI processing happens on our own server, behind authentication. Re-adding
  # this package would also re-add the on-device API key it needed, which is a credential that
  # cannot be rotated out of an installed app.
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  path_provider: ^2.1.5
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.5.3
  intl: ^0.20.2
  path: ^1.9.1
  flutter_markdown: ^0.7.7+1
  http: ^1.6.0
  local_auth: ^2.3.0
  # Opens the GitHub authorization page in the system browser for the per-user GitHub OAuth
  # connect flow (features/engineering/presentation/github_connection_page.dart). GitHub's
  # redirect back lands on the backend, not this app, so no custom URL scheme / deep link is
  # registered for it.
  url_launcher: ^6.3.1
  # Client-side halves of Phase F (multimodal/voice): file_picker lets the Knowledge Center
  # attach a PDF to POST /api/v3/knowledge/documents/upload; record and audioplayers capture a
  # voice note for POST /api/v3/voice/transcribe and play back POST /api/v3/voice/speak's WAV
  # response. All three keep processing server-side -- nothing here runs local inference.
  file_picker: ^8.1.2
  # Pinned to 7.x, not the first 5.x release tried: 5.2.1 resolves record_linux 0.7.2 against
  # record_platform_interface 1.6.0, and that combination fails to compile -- RecordLinux does
  # not implement startStream/hasPermission as the newer platform interface declares them. 6.0.0
  # replaced the Linux backend (fmedia -> parecord/ffmpeg) precisely across that seam; 7.x keeps
  # its own platform packages in sync. The API this app calls (AudioRecorder(), hasPermission(),
  # start(RecordConfig(encoder: ...), path: ...), stop(), dispose()) is unchanged across 5.x-7.x.
  record: ^7.1.1
  audioplayers: ^6.1.0
  # Phase H live duplex: direct dep (may already be transitive). flutter_soloud is the
  # preferred streaming PCM sink behind LiveAudioSink; CI/device fallback stays null/audioplayers.
  web_socket_channel: ^3.0.2
  flutter_soloud: ^3.1.0
  # flutter_llama deliberately absent: no inference runs on the device. It also could not build --
  # its CMake 3.18.1 requirement failed the release APK gate on every run.

  crypto: any
  pointycastle: any
  meta: ^1.15.0
  # Desktop IDE dependencies
  flutter_code_editor: ^0.3.5
  highlight: ^0.7.0
  shared_preferences: ^2.5.5
  xterm: ^4.0.0
  # The device's IANA zone name ("Asia/Riyadh"), which Dart's DateTime cannot give (only an
  # abbreviation or an offset). Sent as X-Client-Timezone so the backend computes "today" for
  # insights and the daily briefing in the user's day, not UTC's (audit F-17).
  flutter_timezone: ^5.1.1
  firebase_auth: ^6.7.1
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information on deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # V2 i18n (Doc/V2_BLUEPRINT.md §12) — generates AppLocalizations from
  # lib/l10n/*.arb per l10n.yaml. Scaffolded + wired into main.dart and the
  # Today screen as proof the pipeline works end to end; migrating every
  # remaining screen's strings is ongoing rollout, same phasing as the
  # design-system migration (§13).
  generate: true

  assets:
    - assets/app_icon.png

  # Arabic glyphs (docs/plans/arabic-language_plan.md, decision 13). Outfit, fetched by
  # google_fonts, has no Arabic; the themes list Cairo in fontFamilyFallback so Arabic text
  # renders the same on every platform and offline. SIL OFL 1.1, assets/fonts/cairo/OFL.txt.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
    # The Qwen2-1.5B GGUF asset was removed. It was a Git LFS pointer to 986 MB of model weights
    # bundled into the APK and extracted at first launch by LocalModelSeeder, so every install
    # carried a gigabyte of weights for inference that now happens on the server.

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  image_path_ios: "assets/app_icon_ios.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#0a0f1f"
    theme_color: "#0a0f1f"

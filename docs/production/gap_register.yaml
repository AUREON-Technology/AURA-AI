# AURA production gap register -- machine-readable source of truth.
#
# GAP_REGISTER.md is a rendered summary of this file; if they disagree, this file wins.
# Schema is enforced by aura_backend/tests/architecture/test_gap_register_schema.py.
#
# Baseline: tree at 11abb50 (branch claude/aura-production-roadmap-5x08so), verified 2026-09-24.
# Seeded from docs/reports/FULL_SYSTEM_ARCHITECTURE_AUDIT.md (audit baseline dd88f95, 2026-09-13),
# every finding re-verified against the current tree with file:line citations. Line numbers are
# as of 11abb50 and will drift; re-verify before acting on one.
#
# Required fields per entry:
#   gap_id, component, severity (P0-P3), current_state, target_state, owner, dependencies,
#   test, metric, exit_condition, status
# status is one of: open, in_progress, built_not_proven, proven, closed_stale
# `evidence` is required (non-empty) whenever status is `proven` or `closed_stale`.
#
# Severity:
#   P0 blocks the 50+ concurrent-user production target outright, or is a live integrity risk.
#   P1 must be closed before a production claim; a real correctness/security/honesty defect.
#   P2 needed for the full target platform; not a launch blocker on its own.
#   P3 hygiene, documentation accuracy, maintainability.
#
# Owners are roles, not people. Nothing here is assigned until someone takes it.


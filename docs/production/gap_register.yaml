      with a deadline instead of inside Ollama until the provider timeout. This bounds the
      queue; it does not add throughput. The gap stays open until GAP-012 lands and GAP-041
      measures it.
    reverified_2026_11_09: >-
      Audit FSA-025 (Phase 2): the admission cap was per *process* while the gateway runs
      AURA_WORKERS of them, and a hosted provider's daily budget was counted once per process.
      Now each capacity group's cap is divided by AURA_LLM_ADMISSION_PROCESSES (= AURA_WORKERS in
      both compose files; floored at one slot per process with a boot warning), and the daily
      request/token counters are atomic shared counters in the cache, so the budget is spent
      once across processes (tests/unit/test_cross_process_limits.py). Built and tested; the
      measured matrix on the live topology is still GAP-041's exit and has not been run.


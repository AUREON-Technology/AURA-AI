  - gap_id: GAP-004
    component: backend/ingestion
    severity: P0
    current_state: >-
      Audit (sec. 24, top-20 #12) flagged idempotency of legacy ingest_document_task as UNKNOWN.
      That task has zero callers; the live v3 ingestion path is idempotent on content hash.
    target_state: Re-ingesting unchanged content is a no-op on the live path.
    owner: backend
    dependencies: []
    test: >-
      aura_backend/tests/unit/test_knowledge.py:144 (test_ingestion_is_idempotent_on_content);
      tests/integration/test_learning_pipeline.py:65
    metric: n/a
    exit_condition: Live ingestion path skips unchanged content, with a test.
    status: built_not_proven
    evidence: >-
      aura_backend/aura_core/knowledge/engine.py:168-183 (content-hash lookup, skipped_reason
      "unchanged_content"). aura_backend/tasks.py:11 ingest_document_task has no caller anywhere
      in the tree; tasks.py:22 ingest_pdf_task is enqueued only from services/drive.py:154, reached
      only from services/agent.py, which the v3 gateway never imports. Legacy upserts use
      deterministic point ids (services/rag.py:237-252). Remaining concerns: concurrent duplicate
      uploads on real Postgres (GAP-015) and dead legacy tasks (GAP-038).
    reverified_2026_09_25: >-
      Re-verified by the P1.4 stream; the closed_stale verdict above was wrong. v3 ingestion was
      NOT idempotent and leaked across users: KnowledgeEngine derived document ids from Python's
      per-process-salted hash(title), not scoped to an owner, so (a) a retry on another worker
      or after a restart got a new id and duplicated every chunk, and (b) two users uploading
      the same title shared one id -- the second upload became a new version of the first user's
      document, still owned by the first user, who could then read it. A caller-supplied
      document_id owned by someone else also overwrote their document, delete_document removed
      other owners' vectors, the in-memory get_by_hash returned superseded versions, and
      concurrent duplicates all indexed. Fixed in 9b9f9e5: ids are sha256(owner, title), a
      foreign document_id is refused 409, deletes are owner-scoped, per-hash/per-id locks in-
      process, Idempotency-Key across workers. 11 regression tests
      (tests/unit/test_ingestion_idempotency.py; 8 failed before the fix), and ingestion
      scenarios re-run against a real Postgres 16 PostgresDocumentStore. Not proven: not
      deployed, CI cannot run (GAP-043), and existing production documents keep their old
      hash(title) ids.


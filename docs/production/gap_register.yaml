    metric: aura_llm_ttft_seconds, aura_turn_duration_seconds, aura_llm_queue_depth, throughput
    exit_condition: >-
      Load report in docs/reports/ showing TTFT p95 < 2.5 s and answer p95 < 15 s at 50
      concurrent users on the production topology.
    status: open
    reverified_2026_09_25: >-
      P2 (15a7dbd) adds admission control in front of every provider: per-provider concurrency
      caps (now also on stream()), a bounded priority queue (interactive/voice 1, Engineer 2,
      insight 3, indexing 4, training 5), queue timeout -> 503 + Retry-After, per-user quota ->

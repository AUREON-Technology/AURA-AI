# Included in the server block AND in every location that sets its own add_header: nginx drops all
# inherited add_header lines the moment a location adds one, so each such location repeats this.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# No inline script or style, no third-party origin: the page ships its own CSS and JS and uses
# system fonts. connect-src 'self' lets the page read its own latest.json. A change that needs more
# must widen this deliberately.
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

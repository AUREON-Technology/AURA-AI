# Headers for the web app under /app/. Included by every /app/ location (see the note in
# security-headers.conf: a location that sets add_header drops the inherited ones).
#
# The install page's policy is `default-src 'none'`; this app needs more, and each allowance below
# names the thing that needs it:
#   'wasm-unsafe-eval'      CanvasKit (Flutter's renderer) and sqlite3.wasm (the local database).
#   style 'unsafe-inline'   Flutter and the splash set inline styles.
#   www.gstatic.com         the Firebase JS SDK, which firebase_core_web loads at start.
#   apis.google.com /       Google's sign-in: the popup script, and Google Identity Services
#   accounts.google.com     (gsi/client, its button styles and its iframe).
#   *.googleusercontent.com the signed-in person's Google profile photo (the app fetches it).
#   *.firebaseapp.com       the sign-in popup's handler page (frame) and its auth domain.
#   *.googleapis.com        Firebase Auth's token and identity endpoints.
#   fonts.gstatic.com /     the Outfit font, which google_fonts fetches at run time on the web.
#   fonts.googleapis.com
#   api.aureon-ai.tech      the AURA API (https, and wss for live features).
# CanvasKit itself is self-hosted (the build uses --no-web-resources-cdn), so no script CDN beyond
# the two above. A change that needs more must widen this deliberately, and the Playwright smoke
# test in docs/deployment/web-app.md must still show no violation.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.aureon-ai.tech wss://api.aureon-ai.tech https://fonts.gstatic.com https://fonts.googleapis.com https://*.googleapis.com https://*.firebaseapp.com https://accounts.google.com https://*.googleusercontent.com; frame-src https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

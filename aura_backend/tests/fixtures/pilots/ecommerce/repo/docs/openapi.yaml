openapi: 3.0.3
info:
  title: Shop public API
  version: "1.2"
paths:
  /shop/customers:
    get:
      operationId: listCustomers
      summary: List customers, newest first.
      responses:
        "200":
          description: Customers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
components:
  schemas:
    Customer:
      type: object
      required: [id, email]
      properties:
        id: {type: integer}
        email: {type: string, format: email}
        full_name: {type: string}

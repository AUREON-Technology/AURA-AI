[pytest]
testpaths = tests
python_files = test_*.py bench_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Benchmarks and load tests are opted into, never out of: `-m bench` or `-m load` on the
# command line replaces this expression, so `pytest tests/benchmarks -m bench` or
# `pytest tests/load -m load` runs them and a bare `pytest` does not. Without the exclusion
# here, both would put wall-clock assertions (and, for load, a hard dependency on a real
# Postgres/Qdrant/Redis/Ollama stack) into every CI run. `training` is the same shape: the
# LoRA weight-change proof needs requirements-train.txt (peft) and a model download, so it runs
# only as `pytest tests/training -m training`.
addopts = -q --strict-markers -m "not bench and not load and not training"
markers =
    slow: tests that take more than a second
    bench: benchmarks, excluded from the default run
    load: load tests against a real data tier, excluded from the default run
    training: real LoRA training against a downloaded base model (needs requirements-train.txt), excluded from the default run
filterwarnings =
    ignore::DeprecationWarning

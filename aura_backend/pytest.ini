[pytest]
testpaths = tests
python_files = test_*.py bench_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Benchmarks are opted into, never out of: `-m bench` on the command line replaces this
# expression, so `pytest tests/benchmarks -m bench` runs them and a bare `pytest` does not.
# Without the exclusion here, adding bench_*.py to python_files would put wall-clock
# assertions into every CI run.
addopts = -q --strict-markers -m "not bench"
markers =
    slow: tests that take more than a second
    bench: benchmarks, excluded from the default run
filterwarnings =
    ignore::DeprecationWarning

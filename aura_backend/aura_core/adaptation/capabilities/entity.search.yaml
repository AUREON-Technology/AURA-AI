# Find records by the text they carry. Needs at least one searchable text-like attribute.
id: entity.search
version: 1
summary: Find records of an entity whose text fields match a query.
target: entity
target_filter:
  where: {source_type: [table, schema]}
  exclude: {readable: [false]}
requires:
  - name: searchable
    relation: child
    kind: attribute
    filter: {where: {semantic_type: [text, email, category, status]}}
risk: personal
cost: 2
relevance: 0.8
produces:
  tool: query.search
  views: [search]
  evals: [golden_search, injection_in_results]

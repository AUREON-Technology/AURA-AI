# List records narrowed by a closed value, a date range or a reference.
id: entity.list_filtered
version: 1
summary: List records of an entity filtered by a category, state, date or reference.
target: entity
target_filter:
  where: {source_type: [table, schema]}
  exclude: {readable: [false]}
requires:
  - name: filterable
    relation: child
    kind: attribute
    filter: {where: {semantic_type: [status, category, date, timestamp, reference, flag]}}
risk: personal
cost: 2
relevance: 0.75
produces:
  tool: query.list
  views: [entity_list]
  evals: [golden_filter]

# What happened to a record over time, from the timestamps the system keeps.
id: state.timeline
version: 1
summary: Show the recorded events of a record chronologically.
target: entity
target_filter:
  where: {source_type: [table, schema]}
  exclude: {readable: [false]}
requires:
  - name: events
    relation: referenced_by
    ref: entity
    kind: event
risk: personal
cost: 2
relevance: 0.6
produces:
  tool: query.timeline
  views: [timeline]
  evals: [golden_timeline]

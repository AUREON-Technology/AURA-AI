# Follow a declared link from one record to the records it points at.
id: relation.traverse
version: 1
summary: Follow a declared relation from a record to the related records.
target: relation
target_filter:
  where: {relation_type: [foreign_key, reference, embedded]}
requires:
  - name: from_entity
    relation: ref
    ref: from
    kind: entity
    filter: {exclude: {readable: [false]}}
  - name: to_entity
    relation: ref
    ref: to
    kind: entity
    filter: {exclude: {readable: [false]}}
risk: personal
cost: 2
relevance: 0.6
produces:
  tool: query.traverse
  views: [entity_detail]
  evals: [golden_traverse]

# Where records stand in a lifecycle: counts per state, and the states a record can move to.
# Workflow candidates are inferred (confidence < 1), hence the lower confidence floor.
id: workflow.status
version: 1
summary: Report how many records are in each lifecycle state, and a record's current state.
target: attribute
target_filter:
  where: {semantic_type: [status]}
requires:
  - name: states
    relation: child
    kind: state
    min: 2
  - name: process
    relation: referenced_by
    ref: state_attribute
    kind: workflow
    filter: {where: {role: [process]}}
risk: personal
cost: 1
relevance: 0.7
min_confidence: 0.4
produces:
  tool: query.group_count
  views: [metric_card, entity_list]
  evals: [golden_status]

# Fetch one record by its identifier. The most basic read any record-keeping system supports.
id: entity.lookup
version: 1
summary: Fetch one record of an entity by its identifier.
target: entity
target_filter:
  where: {source_type: [table, schema]}
  exclude: {readable: [false]}
requires:
  - name: identifier
    relation: child
    kind: attribute
    filter: {where: {semantic_type: [identifier]}}
risk: personal
cost: 1
relevance: 0.9
produces:
  tool: query.lookup
  views: [entity_detail]
  evals: [golden_row, not_found]

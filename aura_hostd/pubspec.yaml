name: aura_hostd
description: >
  Local daemon that lets AURA's Engineer agent act on this machine's real files and terminal.
  Pairs with the backend's /api/v3/host/agent WebSocket and enforces workspace containment
  locally -- see docs/architecture/011-desktop-engineer-agent.md.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.4

# This daemon runs commands and touches the real filesystem on the user's machine -- every
# dependency added here is code that runs with that same access, so the bar for pulling one in is
# high. `dart:io`'s `WebSocket` covers the transport without needing `web_socket_channel`; the one
# runtime dependency is `path`, the Dart team's own zero-dependency path-manipulation package
# (pure string logic, no I/O, no transitive deps), pinned to the same major version already
# vetted in `aura_client/pubspec.yaml`.
#
# `win32` (D4, Terminal + PTY) is the exception that clears the same bar: it is the only route
# from Dart to `CreatePseudoConsole`/`ResizePseudoConsole`/`ClosePseudoConsole` and the
# `ProcThreadAttributeList` calls a real Windows terminal needs -- there is no dart:io equivalent.
# It is FFI-only typed bindings generated from Microsoft's own API metadata (no native build step,
# no C toolchain requirement), and is already present transitively in `aura_client`'s own
# dependency tree, so this does not introduce a new supply-chain element for anyone already
# auditing that app.
#
# `crypto` (D5, interactive consent tiers) is the dart.dev team's own hashing package -- pure Dart,
# no FFI, no transitive deps -- used by `approval_queue.dart` to bind a pending approval to the
# exact command/cwd/root/workspace it was requested for, so a decision made after a human's review
# delay can be checked against tampering before it executes rather than trusted by id alone.
dependencies:
  path: ^1.9.1
  win32: ^5.15.0
  ffi: ^2.1.0
  crypto: ^3.0.6

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0

user nginx;
# `auto` matches the container's CPU limit rather than the host's core count.
worker_processes auto;
worker_rlimit_nofile 8192;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Correlation id is logged so a request can be joined to the gateway's structured logs,
    # its metrics exemplars, and its audit entries (ADR-009).
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"correlation_id":"$request_id",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    # Reject oversized or malformed requests before they reach the application.
    large_client_header_buffers 4 16k;
    client_header_timeout 15s;
    reset_timedout_connection on;

    include /etc/nginx/conf.d/*.conf;
}

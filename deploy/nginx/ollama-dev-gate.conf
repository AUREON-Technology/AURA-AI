# ollama-dev-gate (audit F46): the only way the aura-dev stack reaches prod's Ollama.
#
# Dev shares one CPU-only Ollama with prod to save RAM, over the cross-stack `aura_edge` network.
# Ollama has no authentication and its API also pulls, creates, copies and deletes models -- so
# while prod's Ollama sat on `aura_edge` itself, anything that compromised a dev container could
# delete or replace the model production serves. Ollama now sits only on prod networks and this
# gate answers as `ollama` on `aura_edge` instead, passing through the inference and read-only
# endpoints a provider uses and refusing everything else with 403.
#
# Mounted read-only into the `ollama-dev-gate` service in docker-compose.prod.yml. Not under
# conf.d/ on purpose: prod nginx loads that directory, and this server must not exist there.

server {
    listen 11434;
    server_name _;

    # Prompts and embeddings batches, not uploads: model blobs are refused below anyway.
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Resolve per request (Docker DNS, short TTL) so a recreated ollama container is followed
    # rather than cached. `ollama-upstream` is an alias that exists only on the prod-only
    # `ollama_gate` network: the plain name `ollama` on `aura_edge` is this gate itself.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ollama http://ollama-upstream:11434;
    # Streamed generations must reach dev token by token, and a CPU generation is slow:
    # AURA_PROVIDER_LOCAL_TIMEOUT_S is 180s in both stacks.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # OpenAI-compatible surface (`openai_compatible` provider kind, dev's default).
    location = /v1/chat/completions { limit_except POST { deny all; } proxy_pass $ollama; }
    location = /v1/completions      { limit_except POST { deny all; } proxy_pass $ollama; }
    location = /v1/embeddings       { limit_except POST { deny all; } proxy_pass $ollama; }
    location = /v1/models           { limit_except GET  { deny all; } proxy_pass $ollama; }
    location ^~ /v1/models/         { limit_except GET  { deny all; } proxy_pass $ollama; }

    # Native surface (`ollama` provider kind): inference and read-only model information only.
    location = /api/chat            { limit_except POST { deny all; } proxy_pass $ollama; }
    location = /api/generate        { limit_except POST { deny all; } proxy_pass $ollama; }
    location = /api/embed           { limit_except POST { deny all; } proxy_pass $ollama; }
    location = /api/embeddings      { limit_except POST { deny all; } proxy_pass $ollama; }
    location = /api/show            { limit_except POST { deny all; } proxy_pass $ollama; }
    location = /api/tags            { limit_except GET  { deny all; } proxy_pass $ollama; }
    location = /api/ps              { limit_except GET  { deny all; } proxy_pass $ollama; }
    location = /api/version         { limit_except GET  { deny all; } proxy_pass $ollama; }
    location = /                    { limit_except GET  { deny all; } proxy_pass $ollama; }

    # /api/pull, /api/push, /api/create, /api/copy, /api/delete, /api/blobs/* and anything Ollama
    # adds later: model administration stays with prod.
    location / { return 403; }
}

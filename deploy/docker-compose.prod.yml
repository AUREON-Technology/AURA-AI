# AURA AI -- production stack for a single VPS (Scalability Report, Stage 0).
#
# Differences from the repository-root docker-compose.yml, each closing a finding:
#
#   SEC-12  Only Nginx publishes a port. Postgres, Redis, and Qdrant sit on an internal
#           network with no host binding -- the existing compose file exposes 5432, 6379,
#           and 6333 on the host with no authentication on Redis or Qdrant.
#   SEC-08  Secrets come from Docker secret files, never from environment variables baked
#           into the image or readable via `docker inspect`. No secret has a default.
#   TD-06   Every stateful service has a named volume; nothing writes to a container path
#           that vanishes on restart.
#   Perf    Resource limits on every service, so one runaway container cannot starve the
#           inference process on a 4-vCPU box.
#
# Bring up:  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
# See docs/guides/deployment-guide.md for first-run setup and TLS.

name: aura

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-restart: &restart
  restart: unless-stopped

networks:
  # Ingress-facing. Only nginx and the gateway attach.
  edge:
    driver: bridge
  # Data tier. internal=true means no route to the host or the internet at all, so a
  # compromised datastore cannot call out.
  data:
    driver: bridge
    internal: true
  observability:
    driver: bridge
  # Outbound-only, for ollama to pull model weights from registry.ollama.ai. Not `edge`:
  # that network is documented as ingress-facing (nginx + gateway) and mixing egress into it
  # would blur that boundary. Model pulls are still gated by AURA_MODEL_ALLOWLIST (SEC-01).
  egress:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  ollama_models:
  prometheus_data:
  prometheus_multiproc:
  grafana_data:
  loki_data:
  aura_workspace:
  nginx_certs:
  backup_textfile:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  qdrant_api_key:
    file: ./secrets/qdrant_api_key
  jwt_secret:
    file: ./secrets/jwt_secret
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  # Google Play Integrity service-account key, used by services/security.py to verify
  # device attestation on /api/v2/auth/token. Not generated by bootstrap-secrets.sh -- it
  # comes from Firebase/Google Cloud Console, tied to the Android app's own project, and has
  # to be placed here by hand: cp/scp the downloaded key to deploy/secrets/firebase_credentials.json.
  firebase_credentials:
    file: ./secrets/firebase_credentials.json
  # Alertmanager's own webhook receiver URL. alertmanager-entrypoint.sh already
  # defaults to reading /run/secrets/alertmanager_webhook_url when
  # ALERTMANAGER_WEBHOOK_URL[_FILE] is unset -- this was documented in .env.example
  # but never actually declared/mounted, so a populated deploy/secrets/ file backed
  # nothing and the receiver stayed silently empty.
  alertmanager_webhook_url:
    file: ./secrets/alertmanager_webhook_url

services:
  # ------------------------------------------------------------------ ingress
  nginx:
    image: nginx:1.27-alpine
    <<: *restart
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    # AURA_DOMAIN must reach nginx's actual config, not just docker-compose.yml's own
    # interpolation -- ${AURA_DOMAIN} inside aura.conf.template is nginx's own envsubst, run by
    # its entrypoint against *.template files, not docker compose's variable substitution (which
    # only applies within this YAML file). NGINX_ENVSUBST_FILTER restricts that substitution to
    # this one name; without it, envsubst would also stomp nginx's own $host, $request_uri, etc.,
    # replacing them with empty strings since those aren't real environment variables.
    environment:
      AURA_DOMAIN: ${AURA_DOMAIN}
      NGINX_ENVSUBST_FILTER: ^AURA_DOMAIN$$
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      # Not :ro -- the entrypoint's envsubst step renders *.template into this directory.
      # proxy_headers.inc (no variables, untouched by envsubst) lives here as a plain file too.
      - ./nginx/conf.d:/etc/nginx/conf.d
      - nginx_certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot:ro
    networks: [edge, observability]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  # ------------------------------------------------------------------ application
  gateway:
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
    <<: *restart
    logging: *logging
    command: >
      uvicorn aura_service:app
      --host 0.0.0.0 --port 8000
      --workers ${AURA_WORKERS:-4}
      --proxy-headers --forwarded-allow-ips='*'
      --timeout-keep-alive 65
    environment:
      AURA_ENVIRONMENT: ${AURA_ENVIRONMENT:-production}
      AURA_LOG_FORMAT: json
      AURA_LOG_LEVEL: ${AURA_LOG_LEVEL:-INFO}
      AURA_METRICS_ENABLED: "true"
      # Shared mmap dir so /metrics from any of the uvicorn workers aggregates all four
      # (AURA-019). The image entrypoint wipes leftover *.db files before workers spawn.
      PROMETHEUS_MULTIPROC_DIR: /var/lib/aura/prometheus
      # Backends. In-memory is refused in production by AuraSettings.validate().
      AURA_VECTOR_BACKEND: qdrant
      AURA_DOCUMENT_BACKEND: postgres
      AURA_MEMORY_BACKEND: postgres
      AURA_CACHE_BACKEND: redis
      AURA_QDRANT_URL: http://qdrant:6333
      # Nginx is the single trusted hop; this is what makes X-Forwarded-For parsing correct.
      AURA_TRUSTED_PROXY_COUNT: "1"
      AURA_LLM_PROVIDERS: ${AURA_LLM_PROVIDERS:-local}
      # CPU inference on this VPS exceeds the 60s library default; both the router
      # deadline (LLM_TIMEOUT_S) and the local provider HTTP client must match.
      AURA_LLM_TIMEOUT_S: ${AURA_LLM_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_KIND: openai_compatible
      AURA_PROVIDER_LOCAL_BASE_URL: http://ollama:11434/v1
      AURA_PROVIDER_LOCAL_MODEL: ${AURA_PROVIDER_LOCAL_MODEL:-${AURA_LOCAL_MODEL:-qwen2.5:3b-instruct-q4_K_M}}
      AURA_PROVIDER_LOCAL_TIMEOUT_S: ${AURA_PROVIDER_LOCAL_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_IS_LOCAL: "true"
      AURA_PROVIDER_LOCAL_QUALITY_TIER: "1"
      AURA_PROVIDER_LOCAL_MAX_CONCURRENCY: ${AURA_PROVIDER_LOCAL_MAX_CONCURRENCY:-1}
      AURA_EMBEDDING_PROVIDER: ${AURA_EMBEDDING_PROVIDER:-sentence-transformers}
      AURA_EMBEDDING_MODEL: ${AURA_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      AURA_EMBEDDING_DIMENSION: ${AURA_EMBEDDING_DIMENSION:-384}
      AURA_MODEL_ALLOWLIST: ${AURA_MODEL_ALLOWLIST:-}
      # Secrets are read from files by the entrypoint, never passed as values.
      AURA_DATABASE_URL_FILE: /run/secrets/postgres_password
      AURA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      AURA_QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      AURA_JWT_SECRET_FILE: /run/secrets/jwt_secret
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # config.py (the v1/v2 legacy settings, not aura_core) reads this directly as a file
      # path -- no _FILE-suffix hydration needed, it already supports pointing at any path.
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase_credentials
      # Flutter web CORS. Native clients ignore this. Hostname must match AURA_DOMAIN
      # (and the cert / client BACKEND_URL). Add extra origins in deploy/.env if the
      # web bundle is hosted off this box.
      AURA_DOMAIN: ${AURA_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080,https://${AURA_DOMAIN}}
      # Debug Flutter APKs send aura_dev_attestation. Release builds send a
      # Play Integrity / App Attest token. Must stay false in production.
      ALLOW_MOCK_ATTESTATION: ${ALLOW_MOCK_ATTESTATION:-false}
      # Fail-closed: DEBUG_MODE mints mock_user for unauthenticated v1 calls.
      # AuraSettings.validate() and config.Settings refuse boot if this is true
      # in staging/production. Do not interpolate from .env.
      DEBUG_MODE: "false"
      # App Attest app ID is APPLE_TEAM_ID + '.' + ios bundle id.
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      AURA_IOS_BUNDLE_ID: ${AURA_IOS_BUNDLE_ID:-com.auraai.auraClient}
      # Shared workspace for staged Drive PDFs (API downloads, Celery ingests).
      DATA_DIR: /var/lib/aura/workspace
    secrets: [postgres_password, redis_password, qdrant_api_key, jwt_secret, firebase_credentials]
    volumes:
      - aura_workspace:/var/lib/aura/workspace
      - prometheus_multiproc:/var/lib/aura/prometheus
    networks: [edge, data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      # Readiness, not liveness: this gates traffic, so it must reflect dependencies.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).status==200 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 3G}
        reservations: {memory: 1G}

  worker-realtime:
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
    <<: *restart
    logging: *logging
    # Separate queues so a multi-minute ingestion backlog cannot delay a user-facing task.
    command: celery -A tasks worker -Q realtime -c 4 --loglevel=info --max-tasks-per-child=200
    environment: &worker_env
      AURA_ENVIRONMENT: ${AURA_ENVIRONMENT:-production}
      AURA_LOG_FORMAT: json
      AURA_VECTOR_BACKEND: qdrant
      AURA_DOCUMENT_BACKEND: postgres
      AURA_MEMORY_BACKEND: postgres
      AURA_CACHE_BACKEND: redis
      AURA_QDRANT_URL: http://qdrant:6333
      # Same provider/embedder set as the gateway so build_container() on the
      # learning-queue worker does not fall through to the echo provider
      # (refused in production) when running 02:00 refresh / consolidate.
      AURA_LLM_PROVIDERS: ${AURA_LLM_PROVIDERS:-local}
      AURA_LLM_TIMEOUT_S: ${AURA_LLM_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_KIND: openai_compatible
      AURA_PROVIDER_LOCAL_BASE_URL: http://ollama:11434/v1
      AURA_PROVIDER_LOCAL_MODEL: ${AURA_PROVIDER_LOCAL_MODEL:-${AURA_LOCAL_MODEL:-qwen2.5:3b-instruct-q4_K_M}}
      AURA_PROVIDER_LOCAL_TIMEOUT_S: ${AURA_PROVIDER_LOCAL_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_IS_LOCAL: "true"
      AURA_PROVIDER_LOCAL_QUALITY_TIER: "1"
      AURA_PROVIDER_LOCAL_MAX_CONCURRENCY: "1"
      AURA_EMBEDDING_PROVIDER: ${AURA_EMBEDDING_PROVIDER:-sentence-transformers}
      AURA_EMBEDDING_MODEL: ${AURA_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      AURA_EMBEDDING_DIMENSION: ${AURA_EMBEDDING_DIMENSION:-384}
      AURA_LEARNING_REFRESH_ENABLED: ${AURA_LEARNING_REFRESH_ENABLED:-true}
      AURA_LEARNING_REFRESH_CRON: ${AURA_LEARNING_REFRESH_CRON:-0 2 * * *}
      AURA_DATABASE_URL_FILE: /run/secrets/postgres_password
      AURA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      AURA_QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATA_DIR: /var/lib/aura/workspace
      DEBUG_MODE: "false"
    secrets: [postgres_password, redis_password, qdrant_api_key]
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  worker-ingestion:
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
    <<: *restart
    logging: *logging
    command: celery -A tasks worker -Q ingestion,learning -c 2 --loglevel=info --max-tasks-per-child=50
    environment: *worker_env
    secrets: [postgres_password, redis_password, qdrant_api_key]
    volumes:
      - aura_workspace:/var/lib/aura/workspace
    # egress: HttpSourceFetcher pulls approved https sources during refresh.
    networks: [data, egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 2G}

  beat:
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
    <<: *restart
    logging: *logging
    # Scheduler only. knowledge_refresh_task and memory_consolidate_task run on
    # worker-ingestion (`learning` queue), which has Postgres/Qdrant/Ollama.
    command: celery -A celery_app beat --loglevel=info
    environment: *worker_env
    secrets: [postgres_password, redis_password, qdrant_api_key]
    networks: [data]
    depends_on:
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}

  # ------------------------------------------------------------------ inference
  ollama:
    # Digest-pinned :latest tags match the images already running on the VPS (2026-08-21).
    image: ollama/ollama:latest@sha256:9d30908e41144b1f1da89b9d8e33c07e4aeb43ff41a8660241b1686e2cc330ad
    <<: *restart
    logging: *logging
    volumes:
      - ollama_models:/root/.ollama
    # data: reachable by the gateway that calls it. egress: the only service that needs a
    # route to the internet, to pull model weights -- see the `egress` network's comment above.
    networks: [data, egress]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # One model resident; a second would evict the first on a 16 GB box and turn every
      # other request into a cold load.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 30m
      # One in-flight generation: two concurrent CPU jobs on this 8-core box
      # time-share the model and both miss the chat timeout.
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        # 6 of 8 cores for inference; leave 2 for postgres/redis/gateway/nginx.
        limits: {cpus: "6.0", memory: 10G}
    # For a GPU host, uncomment and install the NVIDIA container toolkit:
    #   deploy.resources.reservations.devices:
    #     - {driver: nvidia, count: 1, capabilities: [gpu]}

  # ------------------------------------------------------------------ data tier
  postgres:
    image: postgres:16-alpine
    <<: *restart
    logging: *logging
    environment:
      POSTGRES_USER: aura
      POSTGRES_DB: aura
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # scram-sha-256 rather than the md5 default.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2G}

  redis:
    image: redis:7-alpine
    <<: *restart
    logging: *logging
    # requirepass from a secret file, appendonly for durability (refresh tokens and rate
    # limit state live here), and a bounded maxmemory with LRU so a cache flood cannot OOM.
    command: >
      sh -c 'redis-server
      --requirepass "$$(cat /run/secrets/redis_password)"
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --protected-mode yes'
    secrets: [redis_password]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 768M}

  qdrant:
    image: qdrant/qdrant:latest@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    <<: *restart
    logging: *logging
    environment:
      QDRANT__SERVICE__API_KEY_FILE: /run/secrets/qdrant_api_key
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT_SHARE: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: "2"
    secrets: [qdrant_api_key]
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [data]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2G}

  # ------------------------------------------------------------------ observability
  prometheus:
    image: prom/prometheus:latest@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    <<: *restart
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    networks: [observability, edge]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 1G}

  alertmanager:
    image: prom/alertmanager:latest@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    <<: *restart
    logging: *logging
    entrypoint: ["/bin/sh", "/scripts/alertmanager-entrypoint.sh"]
    environment:
      # Receivers come from env/secrets, never from a committed URL (AURA-015).
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      ALERTMANAGER_CRITICAL_WEBHOOK_URL: ${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-}
      ALERTMANAGER_WEBHOOK_URL_FILE: ${ALERTMANAGER_WEBHOOK_URL_FILE:-}
      ALERTMANAGER_SMTP_SMARTHOST: ${ALERTMANAGER_SMTP_SMARTHOST:-}
      ALERTMANAGER_SMTP_FROM: ${ALERTMANAGER_SMTP_FROM:-}
      ALERTMANAGER_SMTP_TO: ${ALERTMANAGER_SMTP_TO:-}
      ALERTMANAGER_SMTP_TO_CRITICAL: ${ALERTMANAGER_SMTP_TO_CRITICAL:-}
      ALERTMANAGER_SMTP_AUTH_USERNAME: ${ALERTMANAGER_SMTP_AUTH_USERNAME:-}
      ALERTMANAGER_SMTP_AUTH_PASSWORD: ${ALERTMANAGER_SMTP_AUTH_PASSWORD:-}
      ALERTMANAGER_SMTP_REQUIRE_TLS: ${ALERTMANAGER_SMTP_REQUIRE_TLS:-}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./scripts/alertmanager-entrypoint.sh:/scripts/alertmanager-entrypoint.sh:ro
    secrets: [alertmanager_webhook_url]
    networks: [observability]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}

  grafana:
    image: grafana/grafana:latest@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    <<: *restart
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${AURA_DOMAIN:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets: [grafana_admin_password]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [observability]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  loki:
    image: grafana/loki:latest@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    <<: *restart
    logging: *logging
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks: [observability]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 768M}

  promtail:
    image: grafana/promtail:latest@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    <<: *restart
    logging: *logging
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [observability]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}

  node-exporter:
    image: prom/node-exporter:latest@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    <<: *restart
    logging: *logging
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro,rslave
      - backup_textfile:/textfile:ro
    networks: [observability]
    deploy:
      resources:
        limits: {cpus: "0.2", memory: 128M}

  # ------------------------------------------------------------------ maintenance
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    <<: *restart
    logging: *logging
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGUSER: aura
      PGDATABASE: aura
      PGHOST: postgres
      PGPASSFILE: /run/secrets/postgres_password
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_OFFSITE_RETENTION_DAYS: ${BACKUP_OFFSITE_RETENTION_DAYS:-14}
      QDRANT_URL: http://qdrant:6333
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ACCESS_KEY_FILE: /run/backup-secrets/backup_s3_access_key
      BACKUP_S3_SECRET_KEY_FILE: /run/backup-secrets/backup_s3_secret_key
      RCLONE_CONFIG_FILE: /run/backup-secrets/rclone.conf
      BACKUP_METRICS_DIR: /textfile
    secrets: [postgres_password, qdrant_api_key, redis_password]
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
      - ./secrets:/run/backup-secrets:ro
      - backup_textfile:/textfile
    # data = Postgres/Qdrant/Redis. egress = rclone to S3-compatible storage.
    networks: [data, egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  AURA_PROVIDER_HOSTED1_WORKLOADS: ${AURA_PROVIDER_HOSTED1_WORKLOADS:-}
  AURA_PROVIDER_HOSTED1_USER_TPD: ${AURA_PROVIDER_HOSTED1_USER_TPD:-0}

networks:
  # Ingress-facing. nginx, the gateway, and the operator console attach.
  # The fixed subnet exists so nginx can hold a static address (below): the gateway trusts
  # X-Forwarded-For from that one address only (audit FSA-012). uvicorn's --forwarded-allow-ips
  # takes addresses, never names, and nginx is force-recreated on every deploy, so a dynamic
  # address would be stale after the first one. 10.77.0.0/16 is outside Docker's default pools
  # (172.17-31/16, 192.168/16), so these cannot overlap a network Docker assigned on its own.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.10.0/24
  # Data tier. internal=true means no route to the host or the internet at all, so a
  # compromised datastore cannot call out.
  data:
    driver: bridge
    internal: true
  observability:
    driver: bridge
  # Outbound-only, for ollama to pull model weights from registry.ollama.ai (gated by
  # AURA_MODEL_ALLOWLIST, SEC-01) and, when the optional `gpu` profile is enabled, for vllm to
  # pull weights from Hugging Face -- vllm has no equivalent allowlist API; the model it loads
  # is fixed by AURA_VLLM_MODEL, an operator decision made once at container start, not an
  # exposed runtime action. Not `edge`: that network is documented as ingress-facing (nginx +
  # gateway) and mixing egress into it would blur that boundary.
  egress:
    driver: bridge
  # Cross-compose bridge: prod nginx + ollama share this with aura-dev gateway/console.
  # Fixed subnet for the same reason as `edge`: the dev gateway trusts forwarded headers from
  # nginx's static address here (docker-compose.dev.yml), and only from it.
  aura_edge:
    name: aura_edge
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.11.0/24
  # Engineer agent (AURA_SANDBOX_ENABLED, off by default): gateway <-> sandbox-broker only.
  # The gateway cannot reach docker-socket-proxy at all (audit F19): the proxy filters by
  # endpoint, not by request body, so with CONTAINERS and POST on it would accept a create for a
  # privileged container with `/` bind-mounted. sandbox-broker is what checks the body, and it is
  # the only thing on this network besides the gateway.
  sandbox_ctl:
    driver: bridge
    internal: true
  # sandbox-broker <-> docker-socket-proxy only. Nothing else attaches here; the proxy is the only
  # container with the real socket.
  sandbox_docker:
    driver: bridge
    internal: true
  # Where engineer-agent workspace containers (aura_core/adapters/docker_sandbox.py) actually run.
  # Isolated from `data` and `edge` by construction -- a workspace can reach neither
  # Postgres/Qdrant/Redis nor the gateway/nginx tier.
  #
  # `internal: true` as of the egress-allowlist work: this network now has no route out at all,
  # and the only way to the internet is the `sandbox-proxy` sidecar, which attaches here *and* to
  # `egress` and forwards solely to AURA_SANDBOX_ALLOWED_EGRESS_HOSTS. That closes the
  # open follow-up this comment used to describe -- a workspace can install packages and fetch
  # the repository it works on, and can reach nothing else, rather than the previous choice
  # between "no egress, so unusable" and "full egress, so a model-chosen command reaches the
  # whole internet".
  sandbox_egress:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  ollama_models:
  # Only used when the optional `gpu` profile is enabled -- Hugging Face cache for vllm's
  # weights, so a container restart does not re-download several GB of model.
  vllm_models:
  prometheus_data:
  prometheus_multiproc:
  grafana_data:
  loki_data:
  aura_workspace:
  aura_datasets:
  nginx_certs:
  backup_textfile:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  qdrant_api_key:
    file: ./secrets/qdrant_api_key
  jwt_secret:
    file: ./secrets/jwt_secret
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  # Google Play Integrity service-account key, used by services/security.py to verify
  # device attestation on /api/v2/auth/token. Not generated by bootstrap-secrets.sh -- it
  # comes from Firebase/Google Cloud Console, tied to the Android app's own project, and has
  # to be placed here by hand: cp/scp the downloaded key to deploy/secrets/firebase_credentials.json.
  firebase_credentials:
    file: ./secrets/firebase_credentials.json
  # Alertmanager's own webhook receiver URL. alertmanager-entrypoint.sh already
  # defaults to reading /run/secrets/alertmanager_webhook_url when
  # ALERTMANAGER_WEBHOOK_URL[_FILE] is unset -- this was documented in .env.example
  # but never actually declared/mounted, so a populated deploy/secrets/ file backed
  # nothing and the receiver stayed silently empty.
  alertmanager_webhook_url:
    file: ./secrets/alertmanager_webhook_url
  # Symmetric key aura_core/adapters/secrets_crypto.py uses to encrypt a per-user GitHub OAuth
  # token before it is written to Postgres (github_identities table). Only needed once
  # AURA_GITHUB_OAUTH_ENABLED is set. bootstrap-secrets.sh generates a valid Fernet key here;
  # losing it makes every already-connected user's stored token undecryptable, forcing them to
  # reconnect -- back it up the same way jwt_secret is backed up.
  secrets_encryption_key:
    file: ./secrets/secrets_encryption_key
  # Server-side encryption at rest for memory content and personal-OS record fields
  # (aura_core/adapters/field_crypto.py; ADR-004 "Encryption at rest"). NOT end-to-end: the
  # gateway and workers hold it. REQUIRED -- settings.validate() refuses to start in
  # staging/production without it. bootstrap-secrets.sh generates one; for rotation the file may
  # hold several Fernet keys, one per line, NEWEST FIRST (then run
  # `python scripts/reencrypt_fields.py` in the gateway before dropping the old line).
  # Losing it makes every encrypted memory and record unreadable, and a database backup is
  # useless without it -- back it up separately from the backups themselves.
  data_encryption_keys:
    file: ./secrets/data_encryption_keys
  # The GitHub App's client secret for the per-user OAuth connect flow
  # (api/v2/github_integration.py). bootstrap-secrets.sh fills this with a random placeholder
  # unconditionally (same "the file must exist for the service to start" reasoning as
  # hfspace_api_key below) -- overwrite it with the real value from the GitHub App's settings
  # page (Developer settings -> GitHub Apps -> your app -> "Generate a new client secret")
  # before setting AURA_GITHUB_OAUTH_ENABLED=true:
  #   printf '%s' "$CLIENT_SECRET" > deploy/secrets/github_oauth_client_secret
  github_oauth_client_secret:
    file: ./secrets/github_oauth_client_secret
  # API key for the optional HF Space vLLM failover provider (see docs/guides/
  # split-inference-deployment.md §8). Generated by bootstrap-secrets.sh; empty/unused unless
  # AURA_PROVIDER_HFSPACE_* is configured, matching the pattern of every other file-backed secret
  # here rather than the plain-env AURA_PROVIDER_LARGE_API_KEY_ENV convention (that provider is
  # co-located and trusted-network-only; this one crosses the public internet).
  hfspace_api_key:
    file: ./secrets/hfspace_api_key
  # API keys for the hosted open-weight slots (x-hosted-providers above). Placeholders from
  # bootstrap-secrets.sh until overwritten; unused unless the slot is enabled.
  hosted1_api_key:
    file: ./secrets/hosted1_api_key
  hosted2_api_key:
    file: ./secrets/hosted2_api_key
  hosted3_api_key:
    file: ./secrets/hosted3_api_key

services:
  # ------------------------------------------------------------------ ingress
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    <<: *restart
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    # AURA_DOMAIN must reach nginx's actual config, not just docker-compose.yml's own
    # interpolation -- ${AURA_DOMAIN} inside aura.conf.template is nginx's own envsubst, run by
    # its entrypoint against *.template files, not docker compose's variable substitution (which
    # only applies within this YAML file). NGINX_ENVSUBST_FILTER restricts that substitution to
    # this one name; without it, envsubst would also stomp nginx's own $host, $request_uri, etc.,
    # replacing them with empty strings since those aren't real environment variables.
    environment:
      AURA_DOMAIN: ${AURA_DOMAIN}
      AURA_DEV_DOMAIN: ${AURA_DEV_DOMAIN:-dev.${AURA_DOMAIN}}
      NGINX_ENVSUBST_FILTER: ^AURA_(DOMAIN|DEV_DOMAIN)$
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      # Not :ro -- the entrypoint's envsubst step renders *.template into this directory.
      # proxy_headers.inc (no variables, untouched by envsubst) lives here as a plain file too.
      - ./nginx/conf.d:/etc/nginx/conf.d
      - nginx_certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot:ro
    # Static addresses: what the prod gateway (edge) and the dev gateway (aura_edge) name in
    # --forwarded-allow-ips. Change one and change the other in the same commit; pinned by
    # tests/unit/test_compose_security_parity.py.
    networks:
      edge:
        ipv4_address: 10.77.10.10
      observability: {}
      aura_edge:
        ipv4_address: 10.77.11.10
    # service_started, never service_healthy (audit F-25). The edge must come up whether or not
    # the gateway is ready: readiness needs a working LLM provider, so with `service_healthy` an
    # Ollama outage plus any nginx recreate (vps-update.sh force-recreates it on every deploy)
    # left nothing listening on 80/443 -- not even /healthz, the ACME challenge, or the dev vhost.
    # nginx resolves the upstream lazily and answers 502 until the gateway listens, which is the
    # honest answer. Pinned by tests/unit/test_deploy_robustness.py.
    depends_on:
      gateway:
        condition: service_started
      console:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  console:
    build:
      context: ../aura_admin
      dockerfile: Dockerfile
      args:
        NEXT_BASE_PATH: /console
        NEXT_PUBLIC_BASE_PATH: /console
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-87789110323-5picq501c0834g6g0amjqqpk628jaoh2.apps.googleusercontent.com}
        NEXT_PUBLIC_GRAFANA_EMBED: "1"
    <<: *restart
    logging: *logging
    environment:
      AURA_API_URL: http://gateway:8000
      NEXT_BASE_PATH: /console
      NEXT_PUBLIC_BASE_PATH: /console
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_GRAFANA_EMBED: "1"
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    networks: [edge]
    # service_started for the same reason as nginx above: nginx depends on this service, so a
    # console that waited for a *ready* gateway held the edge down with it.
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/console/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  # ------------------------------------------------------------------ application
  gateway:
    # Root, explicitly (the backend image itself now runs as uid 10002 `aura`). The secret files
    # bootstrap-secrets.sh writes are root-owned mode 600 and file secrets are bind-mounted with
    # those permissions, and the existing named volumes are root-owned, so this stack cannot drop
    # root until both are migrated. Railway, which has neither, runs the image's own user.
    # tests/unit/test_backend_image_user.py pins this on every service built from the image.
    user: "0:0"
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
      args: *release_args
    <<: *restart
    logging: *logging
    # Graceful drain on deploy (audit F-25). Docker's default is SIGKILL 10 s after SIGTERM, which
    # cut off every in-flight chat stream on every deploy. Now: SIGTERM reaches uvicorn directly
    # (the entrypoint `exec`s this command, so uvicorn is PID 1), it stops accepting, closes idle
    # keep-alives and WebSockets (close 1012, which hostd and the voice client reconnect on), and
    # waits up to --timeout-graceful-shutdown for in-flight responses; stop_grace_period leaves
    # 30 s on top of that for lifespan shutdown (container.shutdown()) before the SIGKILL.
    #
    # Why 150 s and not the 600 s /api/v3/chat read timeout: the single gateway replica refuses
    # new connections for as long as it drains, so the drain window is also the deploy's
    # worst-case edge outage (uvicorn returns as soon as the last response ends, so that is only
    # paid when something is actually streaming). 150 s is above the planner call's own worst
    # case on the 5-10 tok/s CPU model (700 tokens at 5 tok/s = 140 s, PlanningEngine.plan), so an
    # ordinary turn already past planning finishes. What it does not cover is a multi-iteration
    # engineer loop (600 s deadline): that is cut and surfaces as an interrupted stream -- the
    # trade for not holding the edge down for ten minutes on every deploy.
    stop_grace_period: 180s
    command: >
      uvicorn aura_service:app
      --host 0.0.0.0 --port 8000
      --workers ${AURA_WORKERS:-4}
      --proxy-headers --forwarded-allow-ips=10.77.10.10
      --timeout-keep-alive 65
      --timeout-graceful-shutdown ${AURA_GRACEFUL_SHUTDOWN_S:-150}
    environment:
      <<: *hosted_providers
      AURA_ENVIRONMENT: ${AURA_ENVIRONMENT:-production}
      AURA_LOG_FORMAT: json
      AURA_LOG_LEVEL: ${AURA_LOG_LEVEL:-INFO}
      AURA_METRICS_ENABLED: "true"
      # Shared mmap dir so /metrics from any of the uvicorn workers aggregates all four
      # (AURA-019). The image entrypoint wipes leftover *.db files before workers spawn.
      PROMETHEUS_MULTIPROC_DIR: /var/lib/aura/prometheus
      # Backends. In-memory is refused in production by AuraSettings.validate().
      AURA_VECTOR_BACKEND: qdrant
      AURA_DOCUMENT_BACKEND: postgres
      AURA_MEMORY_BACKEND: postgres
      AURA_CACHE_BACKEND: redis
      AURA_QDRANT_URL: http://qdrant:6333
      # Nginx is the single trusted hop; this is what makes X-Forwarded-For parsing correct.
      AURA_TRUSTED_PROXY_COUNT: "1"
      AURA_LLM_PROVIDERS: ${AURA_LLM_PROVIDERS:-local}
      # CPU inference on this VPS exceeds the 60s library default; both the router
      # deadline (LLM_TIMEOUT_S) and the local provider HTTP client must match.
      AURA_LLM_TIMEOUT_S: ${AURA_LLM_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_KIND: openai_compatible
      AURA_PROVIDER_LOCAL_BASE_URL: http://ollama:11434/v1
      AURA_PROVIDER_LOCAL_MODEL: ${AURA_PROVIDER_LOCAL_MODEL:-${AURA_LOCAL_MODEL:-qwen2.5:3b-instruct-q4_K_M}}
      AURA_PROVIDER_LOCAL_TIMEOUT_S: ${AURA_PROVIDER_LOCAL_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_IS_LOCAL: "true"
      AURA_PROVIDER_LOCAL_QUALITY_TIER: "1"
      AURA_PROVIDER_LOCAL_MAX_CONCURRENCY: ${AURA_PROVIDER_LOCAL_MAX_CONCURRENCY:-1}
      # Admission control (roadmap P2.4, aura_core/llm/admission.py). With the local provider's
      # cap of 1 (matching OLLAMA_NUM_PARALLEL=1), a request that finds Ollama busy now waits in
      # AURA's bounded priority queue -- interactive/voice ahead of Engineer ahead of background
      # work -- and is refused with 503 + Retry-After after the timeout, instead of piling up
      # invisibly inside Ollama until the 180s provider timeout cancels it mid-generation.
      # The cap is divided among the gateway's AURA_WORKERS (AURA_LLM_ADMISSION_PROCESSES below);
      # each Celery child still adds its own floor of one slot (audit FSA-025).
      # Audit FSA-025: the declared cap is divided among the gateway's uvicorn workers, so the
      # server sees the cap, not cap x AURA_WORKERS. Keep in step with --workers above.
      AURA_LLM_ADMISSION_PROCESSES: ${AURA_WORKERS:-4}
      AURA_LLM_ADMISSION_MAX_QUEUE: ${AURA_LLM_ADMISSION_MAX_QUEUE:-4}
      AURA_LLM_ADMISSION_QUEUE_TIMEOUT_S: ${AURA_LLM_ADMISSION_QUEUE_TIMEOUT_S:-90}
      AURA_LLM_USER_MAX_CONCURRENT_GENERATIONS: ${AURA_LLM_USER_MAX_CONCURRENT_GENERATIONS:-2}
      # Per-turn latency bounds (PP-06/PP-07, aura_core/llm/deadline.py); 0 = off, the code default.
      AURA_LLM_TURN_GENERATION_BUDGET_S: ${AURA_LLM_TURN_GENERATION_BUDGET_S:-0}
      AURA_LLM_STREAM_MAX_S: ${AURA_LLM_STREAM_MAX_S:-0}
      # Optional second "large" provider for a GPU-backed vllm node (hybrid setup --
      # docs/reports/OLLAMA_VLLM_COMPARISON.md §4 Option B, docs/guides/gpu-hybrid-setup.md).
      # A no-op until AURA_LLM_PROVIDERS also lists "large": aura_core only builds a
      # ProviderConfig for names it's told to look up.
      AURA_PROVIDER_LARGE_KIND: ${AURA_PROVIDER_LARGE_KIND:-}
      AURA_PROVIDER_LARGE_MODEL: ${AURA_PROVIDER_LARGE_MODEL:-}
      AURA_PROVIDER_LARGE_BASE_URL: ${AURA_PROVIDER_LARGE_BASE_URL:-}
      AURA_PROVIDER_LARGE_QUALITY_TIER: ${AURA_PROVIDER_LARGE_QUALITY_TIER:-3}
      AURA_PROVIDER_LARGE_TIMEOUT_S: ${AURA_PROVIDER_LARGE_TIMEOUT_S:-180}
      AURA_PROVIDER_LARGE_MAX_CONCURRENCY: ${AURA_PROVIDER_LARGE_MAX_CONCURRENCY:-4}
      AURA_PROVIDER_LARGE_IS_LOCAL: ${AURA_PROVIDER_LARGE_IS_LOCAL:-true}
      # Optional third provider: a real vLLM server on a rented Hugging Face Space GPU, used only
      # as failover when `local` (Contabo Ollama) is unhealthy -- see
      # docs/guides/split-inference-deployment.md §8. is_local is deliberately "false" here
      # (unlike LARGE above): a Space is rented compute we don't control, not a box we own, so
      # local_first must always rank it behind `local` while `local`'s circuit is closed. A
      # no-op until AURA_LLM_PROVIDERS also lists "hfspace" and AURA_ALLOW_REMOTE_INFERENCE=true.
      AURA_ALLOW_REMOTE_INFERENCE: ${AURA_ALLOW_REMOTE_INFERENCE:-}
      AURA_PROVIDER_HFSPACE_KIND: ${AURA_PROVIDER_HFSPACE_KIND:-}
      AURA_PROVIDER_HFSPACE_MODEL: ${AURA_PROVIDER_HFSPACE_MODEL:-}
      AURA_PROVIDER_HFSPACE_BASE_URL: ${AURA_PROVIDER_HFSPACE_BASE_URL:-}
      AURA_PROVIDER_HFSPACE_QUALITY_TIER: ${AURA_PROVIDER_HFSPACE_QUALITY_TIER:-2}
      AURA_PROVIDER_HFSPACE_CONTEXT_WINDOW: ${AURA_PROVIDER_HFSPACE_CONTEXT_WINDOW:-8192}
      # ADR-031: `text,image` once the Space serves a vision-language model (inference-plane.md §8).
      AURA_PROVIDER_HFSPACE_MODALITIES: ${AURA_PROVIDER_HFSPACE_MODALITIES:-text}
      AURA_PROVIDER_HFSPACE_MODEL_REVISION: ${AURA_PROVIDER_HFSPACE_MODEL_REVISION:-}
      AURA_PROVIDER_HFSPACE_TIMEOUT_S: ${AURA_PROVIDER_HFSPACE_TIMEOUT_S:-45}
      # A Space scales to zero, so the liveness probe needs a longer deadline than the
      # 5s default: measured cold, 20 consecutive probes failed at a flat ~5150ms over
      # five and a half minutes before the Space finished waking (EV-28). At 5s the probe
      # cannot observe the recovery at all and /health/ready reports the same
      # `healthy: false` for "asleep, warming" as for "broken".
      AURA_PROVIDER_HFSPACE_HEALTH_TIMEOUT_S: ${AURA_PROVIDER_HFSPACE_HEALTH_TIMEOUT_S:-30}
      AURA_PROVIDER_HFSPACE_HEALTH_PROBE: ${AURA_PROVIDER_HFSPACE_HEALTH_PROBE:-active}
      AURA_PROVIDER_HFSPACE_MAX_CONCURRENCY: ${AURA_PROVIDER_HFSPACE_MAX_CONCURRENCY:-8}
      AURA_PROVIDER_HFSPACE_IS_LOCAL: ${AURA_PROVIDER_HFSPACE_IS_LOCAL:-false}
      AURA_PROVIDER_HFSPACE_API_KEY_ENV: ${AURA_PROVIDER_HFSPACE_API_KEY_ENV:-}
      AURA_EMBEDDING_PROVIDER: ${AURA_EMBEDDING_PROVIDER:-sentence-transformers}
      AURA_EMBEDDING_MODEL: ${AURA_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      # Hub commit of the embedding weights (audit FSA-110). Part of the index identity: changing
      # it builds and promotes a new index. Empty = the repo's head, as before.
      AURA_EMBEDDING_MODEL_REVISION: ${AURA_EMBEDDING_MODEL_REVISION:-}
      AURA_EMBEDDING_DIMENSION: ${AURA_EMBEDDING_DIMENSION:-384}
      # Read directly by huggingface_hub/sentence-transformers, not by aura_core -- avoids the
      # Hub's anonymous rate limit on embedding-model (and Piper ONNX asset) downloads. Optional.
      HF_TOKEN: ${HF_TOKEN:-}
      AURA_MODEL_ALLOWLIST: ${AURA_MODEL_ALLOWLIST:-}
      # Secrets are read from files by the entrypoint, never passed as values.
      # Connection budget (audit FSA-073). Per uvicorn worker: asyncpg pool + legacy SQLAlchemy
      # pool (size + overflow) = 10 + 5 + 5 = 20. With AURA_WORKERS gateway processes and the
      # Celery children below (4 each), the worst case must fit under postgresql.conf's
      # max_connections with headroom for alembic, the backup job and psql.
      # tests/unit/test_postgres_connection_budget.py does that arithmetic on this file.
      # Hub commit of the Whisper weights (audit FSA-110); shown as the STT engine name in
      # /health/ready. Whisper is also loaded at startup in production so the first live-voice
      # turn of a fresh container does not pay the download (AURA_VOICE_STT_WARM_ON_STARTUP).
      AURA_VOICE_STT_MODEL_REVISION: ${AURA_VOICE_STT_MODEL_REVISION:-}
      # Arabic search (docs/plans/arabic-language_plan.md, stage 4, decision 17; measured in
      # docs/reports/ARABIC_RETRIEVAL_EVAL_2026-11-17.md): multilingual E5 embeddings (384-dim,
      # so the dimension is unchanged, but a new index -- run scripts/rebuild_index.py after the
      # first deploy) and the "either" relevance gate, which passes a passage the word-overlap
      # heuristic OR the multilingual cross-encoder accepts (~100-300 ms CPU per search).
      AURA_KNOWLEDGE_RERANK_PROVIDER: ${AURA_KNOWLEDGE_RERANK_PROVIDER:-either}
      AURA_KNOWLEDGE_RERANK_MODEL: ${AURA_KNOWLEDGE_RERANK_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      AURA_KNOWLEDGE_RERANK_MODEL_REVISION: ${AURA_KNOWLEDGE_RERANK_MODEL_REVISION:-}
      AURA_POSTGRES_POOL_MAX_SIZE: ${AURA_POSTGRES_POOL_MAX_SIZE:-10}
      AURA_LEGACY_DB_POOL_SIZE: ${AURA_LEGACY_DB_POOL_SIZE:-5}
      AURA_LEGACY_DB_MAX_OVERFLOW: ${AURA_LEGACY_DB_MAX_OVERFLOW:-5}
      # Retention for personal data in the logs (audit FSA-016): audit events (actor, source IP)
      # and turn telemetry (conversation ids). 0 keeps a table forever. Applied daily by
      # purge_audit_and_telemetry_task on the realtime worker.
      # Readable chunk text in vector payloads (audit FSA-018): empty decides by where Qdrant
      # runs -- on this host (the compose service) keeps it, an off-host Qdrant never sees it.
      AURA_KNOWLEDGE_VECTOR_PAYLOAD_CONTENT: ${AURA_KNOWLEDGE_VECTOR_PAYLOAD_CONTENT:-}
      AURA_AUDIT_RETENTION_DAYS: ${AURA_AUDIT_RETENTION_DAYS:-365}
      AURA_TELEMETRY_RETENTION_DAYS: ${AURA_TELEMETRY_RETENTION_DAYS:-90}
      AURA_DATABASE_URL_FILE: /run/secrets/postgres_password
      AURA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      AURA_QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      AURA_JWT_SECRET_FILE: /run/secrets/jwt_secret
      # Token environment binding (F-03; services/jwt_auth.py). Empty = derived from
      # AURA_ENVIRONMENT (aura-<env> / aura-api-<env>), so prod and dev already differ.
      AURA_JWT_ISSUER: ${AURA_JWT_ISSUER:-}
      AURA_JWT_AUDIENCE: ${AURA_JWT_AUDIENCE:-}
      AURA_JWT_LEGACY_TOKENS_UNTIL: ${AURA_JWT_LEGACY_TOKENS_UNTIL:-}
      # Same file-backed pattern as the secrets above, but generic: secret_hydration.py
      # resolves it via whatever name AURA_PROVIDER_HFSPACE_API_KEY_ENV points at, so this line
      # applies even if that env var name is changed. A no-op until that env var is set.
      AURA_PROVIDER_HFSPACE_API_KEY_FILE: /run/secrets/hfspace_api_key
      # Per-user GitHub OAuth connect flow (see AURA_GITHUB_OAUTH_* below). A no-op until
      # AURA_GITHUB_OAUTH_ENABLED is set, same as the sandbox/GitHub block further down.
      AURA_SECRETS_ENCRYPTION_KEY_FILE: /run/secrets/secrets_encryption_key
      AURA_GITHUB_OAUTH_CLIENT_SECRET_FILE: /run/secrets/github_oauth_client_secret
      # Encryption at rest for memories/personal-OS records -- see the top-level `secrets:` block.
      AURA_DATA_ENCRYPTION_KEYS_FILE: /run/secrets/data_encryption_keys
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # config.py (the v1/v2 legacy settings, not aura_core) reads this directly as a file
      # path -- no _FILE-suffix hydration needed, it already supports pointing at any path.
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase_credentials
      # Flutter web CORS. Native clients ignore this. Hostname must match AURA_DOMAIN
      # (and the cert / client BACKEND_URL). Add extra origins in deploy/.env if the
      # web bundle is hosted off this box.
      AURA_DOMAIN: ${AURA_DOMAIN}
      # Production origins only (audit FSA-010): a localhost origin here, with credentials
      # allowed, lets a page on a developer's machine call production as the signed-in user.
      # Local Flutter web against this stack is what the dev stack and `deploy/.env` are for.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${AURA_DOMAIN}}
      # Debug Flutter APKs send aura_dev_attestation. Release builds send a
      # Play Integrity / App Attest token. Must stay false in production.
      ALLOW_MOCK_ATTESTATION: ${ALLOW_MOCK_ATTESTATION:-false}
      # Fail-closed: DEBUG_MODE mints mock_user for unauthenticated v1 calls.
      # AuraSettings.validate() and config.Settings refuse boot if this is true
      # in staging/production. Do not interpolate from .env.
      DEBUG_MODE: "false"
      # App Attest app ID is APPLE_TEAM_ID + '.' + ios bundle id.
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      AURA_IOS_BUNDLE_ID: ${AURA_IOS_BUNDLE_ID:-com.auraai.auraClient}
      # Role allowlists for services.rbac.get_user_role. Unset means nobody is
      # minted Admin/Developer/SuperAdmin from env; consumers stay User.
      # SUPERADMIN_EMAILS is the only list that can mint SuperAdmin.
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEVELOPER_EMAILS: ${DEVELOPER_EMAILS:-}
      # Which of the roles above (User/Developer/Admin/SuperAdmin) get the "engineer_agent"
      # capability -- the gate on the `engineer` persona and every tool in tools/coding.py
      # (sandboxed filesystem/command/git, GitHub read+write). Empty by default: unlike the
      # email lists above, this grants a capability, not a role, and that persona can run shell
      # commands and push commits/PRs, so nobody gets it until explicitly opted in here.
      AURA_ENGINEER_AGENT_ROLES: ${AURA_ENGINEER_AGENT_ROLES:-}
      # Shared workspace for staged Drive PDFs (API downloads, Celery ingests).
      DATA_DIR: /var/lib/aura/workspace
      # Phase H live duplex WebSocket. Default on for this stack (STT/TTS are baked
      # into the image); set false in deploy/.env to refuse sessions. Local/dev
      # AuraSettings still default live_enabled=false unless this env is set.
      AURA_VOICE_LIVE_ENABLED: ${AURA_VOICE_LIVE_ENABLED:-true}
      AURA_VOICE_LIVE_MAX_SESSIONS: ${AURA_VOICE_LIVE_MAX_SESSIONS:-8}
      # ADR-031 image understanding. Off until a provider declares
      # AURA_PROVIDER_<NAME>_MODALITIES=text,image (no vision pool ships yet: GAP-012).
      AURA_VISION_ENABLED: ${AURA_VISION_ENABLED:-false}
      AURA_VISION_MAX_IMAGES: ${AURA_VISION_MAX_IMAGES:-4}
      # Loop B: digest-addressed ChatML artefacts shared with learning workers.
      AURA_LEARNING_DATASET_DIR: /var/lib/aura/datasets
      # The gateway never trains (GAP-017/018): `scripted` records every launched job as
      # NOT_TRAINED and registers nothing. Real LoRA runs only on worker-training (profile
      # `training`), which consumes the `training` queue. Same fixed value in
      # docker-compose.dev.yml.
      AURA_FINETUNE_TRAINER: scripted
      # Engineer agent (Phase J). Every one of these defaults to inert/off; enabling any is a
      # deliberate per-deployment decision, not a side effect of upgrading.
      AURA_SANDBOX_ENABLED: ${AURA_SANDBOX_ENABLED:-false}
      # Built by the `sandbox-image` service below, not pulled. That is what lets IMAGES stay
      # off docker-socket-proxy's allowlist -- see that service's comment.
      AURA_SANDBOX_IMAGE: ${AURA_SANDBOX_IMAGE:-aura-sandbox:latest}
      # Proxy for egress from sandbox containers (tinyproxy on sandbox-proxy:8888)
      AURA_SANDBOX_PROXY_URL: ${AURA_SANDBOX_PROXY_URL:-http://sandbox-proxy:8888}
      # Network name must match docker-compose's actual network name (project_prefix + _ + network_name)
      AURA_SANDBOX_NETWORK: ${AURA_SANDBOX_NETWORK:-aura_sandbox_egress}
      AURA_SANDBOX_MEMORY_LIMIT: ${AURA_SANDBOX_MEMORY_LIMIT:-512m}
      AURA_SANDBOX_CPU_LIMIT: ${AURA_SANDBOX_CPU_LIMIT:-1.0}
      # Where engineer-agent workspaces live. This value is a *host* path, and it is bind-mounted
      # into this container at the very same path (see `volumes:` below) on purpose: the gateway
      # asks the host's daemon to mount a workspace, and the daemon resolves that source on the
      # host. A path that existed only inside this container would name a different, empty
      # directory once mounted -- write_file and run_command would silently stop agreeing. Keep
      # the two sides identical if you change it.
      AURA_SANDBOX_HOST_ROOT: ${AURA_SANDBOX_HOST_ROOT:-/opt/aura-stack/deploy/sandboxes}
      # Workspace lifecycle. A workspace is stopped (not deleted) between turns, so peak memory
      # is MAX_RUNNING * MEMORY_LIMIT no matter how many exist; it is deleted once idle past the
      # TTL. On a 16 GB host, set MAX_RUNNING=1 and MAX_WORKSPACES=2.
      AURA_SANDBOX_WORKSPACE_TTL_HOURS: ${AURA_SANDBOX_WORKSPACE_TTL_HOURS:-72}
      AURA_SANDBOX_HOT_IDLE_S: ${AURA_SANDBOX_HOT_IDLE_S:-900}
      AURA_SANDBOX_MAX_WORKSPACES: ${AURA_SANDBOX_MAX_WORKSPACES:-4}
      AURA_SANDBOX_MAX_RUNNING: ${AURA_SANDBOX_MAX_RUNNING:-2}
      AURA_SANDBOX_WORKSPACE_DISK_QUOTA_MB: ${AURA_SANDBOX_WORKSPACE_DISK_QUOTA_MB:-2048}
      AURA_SANDBOX_MIN_FREE_MEMORY_MB: ${AURA_SANDBOX_MIN_FREE_MEMORY_MB:-1024}
      AURA_SANDBOX_IN_CONTAINER_GIT: ${AURA_SANDBOX_IN_CONTAINER_GIT:-false}
      # docker-py's `docker.from_env()` reads this. It names sandbox-broker, never the socket
      # proxy or the socket: the broker refuses any container the sandbox would not create (see
      # its service below and `sandbox_ctl` above).
      DOCKER_HOST: tcp://sandbox-broker:2375
      AURA_GITHUB_ENABLED: ${AURA_GITHUB_ENABLED:-false}
      AURA_GITHUB_DEFAULT_OWNER: ${AURA_GITHUB_DEFAULT_OWNER:-}
      AURA_GITHUB_DEFAULT_REPO: ${AURA_GITHUB_DEFAULT_REPO:-}
      # Per-user GitHub OAuth connect flow (aura_core/config/settings.py's GitHubSettings,
      # api/v2/github_integration.py). Independent of AURA_GITHUB_ENABLED above: that path is
      # one shared admin PAT for every user, this one lets each user connect their own account.
      # AURA_GITHUB_OAUTH_CLIENT_SECRET itself is file-backed above (secrets_encryption_key /
      # github_oauth_client_secret must both be present in deploy/secrets/ once this is true --
      # see the top-level `secrets:` block for how to get them).
      AURA_GITHUB_OAUTH_ENABLED: ${AURA_GITHUB_OAUTH_ENABLED:-false}
      AURA_GITHUB_OAUTH_CLIENT_ID: ${AURA_GITHUB_OAUTH_CLIENT_ID:-}
      AURA_GITHUB_OAUTH_CALLBACK_URL: ${AURA_GITHUB_OAUTH_CALLBACK_URL:-https://${AURA_DOMAIN}/api/v3/integrations/github/callback}
      AURA_MCP_ENABLED: ${AURA_MCP_ENABLED:-false}
      AURA_MCP_SERVERS_JSON: ${AURA_MCP_SERVERS_JSON:-}
      # Track AP connectors (ADR-021), off by default. Credentials are vaulted under the
      # secrets_encryption_key mounted above; without it a credentialed connector is refused.
      AURA_ADAPTATION_ENABLED: ${AURA_ADAPTATION_ENABLED:-false}
      # Project Twin labeling (AP4, ADR-026): off = humanised identifiers, the complete
      # degraded mode. On, it batches names through the self-hosted router, never a turn.
      AURA_ADAPTATION_LABELER_ENABLED: ${AURA_ADAPTATION_LABELER_ENABLED:-false}
      # Blueprint runtime (AP7): who may use generated agents/tools (empty = nobody), and the
      # AP8 evaluation gate's mode -- enforce in every stack; advisory only as a rollback lever.
      AURA_PROJECT_DATA_ROLES: ${AURA_PROJECT_DATA_ROLES:-}
      AURA_ADAPTATION_GATE_MODE: ${AURA_ADAPTATION_GATE_MODE:-enforce}
    secrets:
      [
        postgres_password,
        redis_password,
        qdrant_api_key,
        jwt_secret,
        firebase_credentials,
        hfspace_api_key,
        hosted1_api_key,
        hosted2_api_key,
        hosted3_api_key,
        secrets_encryption_key,
        github_oauth_client_secret,
        data_encryption_keys,
      ]
    volumes:
      - aura_workspace:/var/lib/aura/workspace
      - aura_datasets:/var/lib/aura/datasets
      - prometheus_multiproc:/var/lib/aura/prometheus
      # Same path on both sides -- see AURA_SANDBOX_HOST_ROOT above. A named volume cannot serve
      # here: the daemon would have to resolve the *host* side of an engineer-agent workspace
      # mount, and a volume name is not a path it can hand to a sibling container's bind.
      - ${AURA_SANDBOX_HOST_ROOT:-/opt/aura-stack/deploy/sandboxes}:${AURA_SANDBOX_HOST_ROOT:-/opt/aura-stack/deploy/sandboxes}
    networks: [edge, data, sandbox_ctl]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      # Liveness, not readiness (audit F-25). This status is what `depends_on: service_healthy`
      # waits on, and /health/ready is false whenever no LLM provider is healthy -- so a
      # readiness healthcheck turned an Ollama outage into "gateway unhealthy", which held the
      # edge down. Nothing routes on this status (nginx proxies regardless), so it only has to
      # say "the process is up and serving HTTP". Readiness stays where it belongs: the deploy
      # gate (vps-update.sh polls /health/ready and fails the deploy) and Prometheus.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=5).status==200 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 3G}
        reservations: {memory: 1G}

  # Engineer agent (AURA_SANDBOX_ENABLED, off by default; `profiles` keeps it from starting
  # otherwise). The only container with the real Docker socket. The env vars below are
  # tecnativa/docker-socket-proxy's own allowlist: CONTAINERS (create/start/stop/wait/logs/remove)
  # is on; IMAGES is off because the workspace image is built locally by `sandbox-image`; EXEC,
  # NETWORKS, VOLUMES, SERVICES, SWARM and everything else stay off, since `DockerSandboxRunner`
  # never calls any of them.
  #
  # What this allowlist does NOT do (audit F19): it filters by endpoint and method, never by
  # request body. With CONTAINERS and POST on, `POST /containers/create` is accepted whatever it
  # carries -- `Privileged`, a bind of `/`, `NetworkMode: host` -- and that is host root. So the
  # proxy is not the boundary: only `sandbox-broker` can reach it (`sandbox_docker`), and the
  # broker is what refuses a container the sandbox would not create.
  docker-socket-proxy:
    profiles: [sandbox]
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    <<: *restart
    logging: *logging
    environment:
      CONTAINERS: "1"
      IMAGES: "0"
      POST: "1"
      EXEC: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      SERVICES: "0"
      SWARM: "0"
      SYSTEM: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      INFO: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SESSION: "0"
      TASKS: "0"
      AUTH: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sandbox_docker]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  # The gateway's only Docker API (audit F19). docker-socket-proxy filters endpoints, not request
  # bodies, so this is the server-side check on what the gateway asks for: it forwards only the
  # calls DockerSandboxRunner makes, refuses a create unless it is exactly the sandbox container
  # (this image, uid 10001, all capabilities dropped, no-new-privileges, read-only rootfs, limits
  # set, the sandbox network or none, binds only from one directory directly under the workspace
  # root with no symlink on the way), and refuses to start, stop, read or remove any container
  # that does not carry a sandbox label. deploy/sandbox-broker/broker.py has the whole policy.
  #
  # Its image, network and root settings are the gateway's own (same variables, same defaults):
  # a mismatch refuses every legitimate command rather than allowing anything. The workspace root
  # is mounted read-only at the same path so the broker can resolve symlinks in a bind source;
  # it runs as the sandbox uid because bootstrap-host.sh makes that root 0750 owned by it.
  # Built, not proven: no Docker daemon has run behind it in CI.
  sandbox-broker:
    profiles: [sandbox]
    build:
      context: ./sandbox-broker
      dockerfile: Dockerfile
    image: aura-sandbox-broker:latest
    <<: *restart
    logging: *logging
    environment:
      AURA_SANDBOX_IMAGE: ${AURA_SANDBOX_IMAGE:-aura-sandbox:latest}
      AURA_SANDBOX_NETWORK: ${AURA_SANDBOX_NETWORK:-aura_sandbox_egress}
      AURA_SANDBOX_HOST_ROOT: ${AURA_SANDBOX_HOST_ROOT:-/opt/aura-stack/deploy/sandboxes}
      BROKER_UPSTREAM: docker-socket-proxy:2375
      BROKER_LISTEN: 0.0.0.0:2375
    volumes:
      - ${AURA_SANDBOX_HOST_ROOT:-/opt/aura-stack/deploy/sandboxes}:${AURA_SANDBOX_HOST_ROOT:-/opt/aura-stack/deploy/sandboxes}:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [sandbox_ctl, sandbox_docker]
    depends_on: [docker-socket-proxy]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  # Builds the engineer-agent workspace image on this host and exits. `docker compose up` runs it
  # to completion before the gateway needs it, and it re-runs on every deploy, so the image tracks
  # deploy/sandbox/Dockerfile rather than whatever was cached months ago.
  #
  # It exists so nothing is *pulled* at runtime: that is what allows IMAGES: "0" on the socket
  # proxy above. `restart: "no"` because a build container that finishes is not a crash, and
  # `unless-stopped` would rebuild it in a loop forever.
  sandbox-image:
    profiles: [sandbox]
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: ${AURA_SANDBOX_IMAGE:-aura-sandbox:latest}
    restart: "no"
    command: ["true"]
    logging: *logging
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  # The only route out of `sandbox_egress`, which is `internal: true`. Workspaces get
  # HTTP(S)_PROXY pointing here (AURA_SANDBOX_PROXY_URL), and this forwards only to the hosts in
  # AURA_SANDBOX_ALLOWED_EGRESS_HOSTS -- enough to clone a repository and install packages, and
  # nothing else. Before this existed the choice was between a workspace with no network (unable
  # to do the job) and one with the whole internet (a model-chosen command exfiltrating a
  # checkout); neither was acceptable for a container that lives for days.
  #
  # tinyproxy rather than squid: no cache to manage, a config small enough to read in full, and a
  # 64M footprint on a host whose memory is already the binding constraint.
  sandbox-proxy:
    profiles: [sandbox]
    image: ${AURA_SANDBOX_PROXY_IMAGE:-vimagick/tinyproxy:latest@sha256:72b441b95ee1e641af948f68f09492f9f795ead72b73954414e339168c98ad8c}
    <<: *restart
    logging: *logging
    volumes:
      - ./sandbox/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./sandbox/filter:/etc/tinyproxy/filter:ro
    # sandbox_egress to be reachable by workspaces; egress to actually reach the allowed hosts.
    # Deliberately not on `data` or `edge`: a proxy that could reach Postgres would hand every
    # workspace a route to it.
    networks: [sandbox_egress, egress]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}

  worker-realtime:
    user: "0:0"  # root until secrets/volumes are migrated; see the gateway service
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
      args: *release_args
    <<: *restart
    logging: *logging
    # Separate queues so a multi-minute ingestion backlog cannot delay a user-facing task.
    command: celery -A tasks worker -Q realtime -c 4 --loglevel=info --max-tasks-per-child=200
    # SIGTERM is Celery's warm shutdown: stop consuming, let running tasks finish. 120 s lets a
    # realtime task through one full provider call; anything still running then is SIGKILLed,
    # and because tasks are acks_late (celery_app.py) its message is redelivered rather than
    # lost. Same value on every worker, in both compose files.
    stop_grace_period: 120s
    healthcheck: *celery_worker_healthcheck
    environment: &worker_env
      <<: *hosted_providers
      AURA_ENVIRONMENT: ${AURA_ENVIRONMENT:-production}
      AURA_LOG_FORMAT: json
      AURA_VECTOR_BACKEND: qdrant
      AURA_DOCUMENT_BACKEND: postgres
      AURA_MEMORY_BACKEND: postgres
      AURA_CACHE_BACKEND: redis
      AURA_QDRANT_URL: http://qdrant:6333
      # Same provider/embedder set as the gateway so build_container() on the
      # learning-queue worker does not fall through to the echo provider
      # (refused in production) when running 02:00 refresh / consolidate.
      AURA_LLM_PROVIDERS: ${AURA_LLM_PROVIDERS:-local}
      AURA_LLM_TIMEOUT_S: ${AURA_LLM_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_KIND: openai_compatible
      AURA_PROVIDER_LOCAL_BASE_URL: http://ollama:11434/v1
      AURA_PROVIDER_LOCAL_MODEL: ${AURA_PROVIDER_LOCAL_MODEL:-${AURA_LOCAL_MODEL:-qwen2.5:3b-instruct-q4_K_M}}
      AURA_PROVIDER_LOCAL_TIMEOUT_S: ${AURA_PROVIDER_LOCAL_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_IS_LOCAL: "true"
      AURA_PROVIDER_LOCAL_QUALITY_TIER: "1"
      AURA_PROVIDER_LOCAL_MAX_CONCURRENCY: "1"
      # Admission control -- see the matching block on the gateway. Background work waits longer
      # (nobody is watching a spinner) but still cannot queue without bound.
      AURA_LLM_ADMISSION_MAX_QUEUE: ${AURA_LLM_ADMISSION_MAX_QUEUE:-4}
      AURA_LLM_ADMISSION_QUEUE_TIMEOUT_S: ${AURA_LLM_WORKER_ADMISSION_QUEUE_TIMEOUT_S:-300}
      # See the matching block on `gateway` above -- same no-op-until-enabled second provider,
      # needed here too so build_container() sees it on the learning-queue worker as well.
      AURA_PROVIDER_LARGE_KIND: ${AURA_PROVIDER_LARGE_KIND:-}
      AURA_PROVIDER_LARGE_MODEL: ${AURA_PROVIDER_LARGE_MODEL:-}
      AURA_PROVIDER_LARGE_BASE_URL: ${AURA_PROVIDER_LARGE_BASE_URL:-}
      AURA_PROVIDER_LARGE_QUALITY_TIER: ${AURA_PROVIDER_LARGE_QUALITY_TIER:-3}
      AURA_PROVIDER_LARGE_TIMEOUT_S: ${AURA_PROVIDER_LARGE_TIMEOUT_S:-180}
      AURA_PROVIDER_LARGE_MAX_CONCURRENCY: ${AURA_PROVIDER_LARGE_MAX_CONCURRENCY:-4}
      AURA_PROVIDER_LARGE_IS_LOCAL: ${AURA_PROVIDER_LARGE_IS_LOCAL:-true}
      # See the matching block on `gateway` above -- HF Space vLLM failover provider, needed
      # here too so build_container() sees it on the learning-queue worker as well.
      AURA_ALLOW_REMOTE_INFERENCE: ${AURA_ALLOW_REMOTE_INFERENCE:-}
      AURA_PROVIDER_HFSPACE_KIND: ${AURA_PROVIDER_HFSPACE_KIND:-}
      AURA_PROVIDER_HFSPACE_MODEL: ${AURA_PROVIDER_HFSPACE_MODEL:-}
      AURA_PROVIDER_HFSPACE_BASE_URL: ${AURA_PROVIDER_HFSPACE_BASE_URL:-}
      AURA_PROVIDER_HFSPACE_QUALITY_TIER: ${AURA_PROVIDER_HFSPACE_QUALITY_TIER:-2}
      AURA_PROVIDER_HFSPACE_CONTEXT_WINDOW: ${AURA_PROVIDER_HFSPACE_CONTEXT_WINDOW:-8192}
      # ADR-031: `text,image` once the Space serves a vision-language model (inference-plane.md §8).
      AURA_PROVIDER_HFSPACE_MODALITIES: ${AURA_PROVIDER_HFSPACE_MODALITIES:-text}
      AURA_PROVIDER_HFSPACE_MODEL_REVISION: ${AURA_PROVIDER_HFSPACE_MODEL_REVISION:-}
      AURA_PROVIDER_HFSPACE_TIMEOUT_S: ${AURA_PROVIDER_HFSPACE_TIMEOUT_S:-45}
      # A Space scales to zero, so the liveness probe needs a longer deadline than the
      # 5s default: measured cold, 20 consecutive probes failed at a flat ~5150ms over
      # five and a half minutes before the Space finished waking (EV-28). At 5s the probe
      # cannot observe the recovery at all and /health/ready reports the same
      # `healthy: false` for "asleep, warming" as for "broken".
      AURA_PROVIDER_HFSPACE_HEALTH_TIMEOUT_S: ${AURA_PROVIDER_HFSPACE_HEALTH_TIMEOUT_S:-30}
      AURA_PROVIDER_HFSPACE_HEALTH_PROBE: ${AURA_PROVIDER_HFSPACE_HEALTH_PROBE:-active}
      AURA_PROVIDER_HFSPACE_MAX_CONCURRENCY: ${AURA_PROVIDER_HFSPACE_MAX_CONCURRENCY:-8}
      AURA_PROVIDER_HFSPACE_IS_LOCAL: ${AURA_PROVIDER_HFSPACE_IS_LOCAL:-false}
      AURA_PROVIDER_HFSPACE_API_KEY_ENV: ${AURA_PROVIDER_HFSPACE_API_KEY_ENV:-}
      AURA_PROVIDER_HFSPACE_API_KEY_FILE: /run/secrets/hfspace_api_key
      AURA_EMBEDDING_PROVIDER: ${AURA_EMBEDDING_PROVIDER:-sentence-transformers}
      AURA_EMBEDDING_MODEL: ${AURA_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      # Hub commit of the embedding weights (audit FSA-110). Part of the index identity: changing
      # it builds and promotes a new index. Empty = the repo's head, as before.
      AURA_EMBEDDING_MODEL_REVISION: ${AURA_EMBEDDING_MODEL_REVISION:-}
      AURA_EMBEDDING_DIMENSION: ${AURA_EMBEDDING_DIMENSION:-384}
      # See the matching line on `gateway` above -- same anonymous-rate-limit concern applies to
      # the learning-queue worker's own embedding calls (refresh/consolidate).
      HF_TOKEN: ${HF_TOKEN:-}
      AURA_LEARNING_REFRESH_ENABLED: ${AURA_LEARNING_REFRESH_ENABLED:-true}
      AURA_LEARNING_REFRESH_CRON: ${AURA_LEARNING_REFRESH_CRON:-0 2 * * *}
      # Connection budget (audit FSA-073): each prefork child (`-c N`) holds its own pools, so a
      # worker process gets 2 + 1 + 1 = 4 connections. See the gateway's block for the arithmetic.
      AURA_POSTGRES_POOL_MIN_SIZE: ${AURA_WORKER_POSTGRES_POOL_MIN_SIZE:-1}
      AURA_POSTGRES_POOL_MAX_SIZE: ${AURA_WORKER_POSTGRES_POOL_MAX_SIZE:-2}
      AURA_LEGACY_DB_POOL_SIZE: ${AURA_WORKER_LEGACY_DB_POOL_SIZE:-1}
      AURA_LEGACY_DB_MAX_OVERFLOW: ${AURA_WORKER_LEGACY_DB_MAX_OVERFLOW:-1}
      # Retention for personal data in the logs (audit FSA-016): audit events (actor, source IP)
      # and turn telemetry (conversation ids). 0 keeps a table forever. Applied daily by
      # purge_audit_and_telemetry_task on the realtime worker.
      # Readable chunk text in vector payloads (audit FSA-018): empty decides by where Qdrant
      # runs -- on this host (the compose service) keeps it, an off-host Qdrant never sees it.
      AURA_KNOWLEDGE_VECTOR_PAYLOAD_CONTENT: ${AURA_KNOWLEDGE_VECTOR_PAYLOAD_CONTENT:-}
      AURA_AUDIT_RETENTION_DAYS: ${AURA_AUDIT_RETENTION_DAYS:-365}
      AURA_TELEMETRY_RETENTION_DAYS: ${AURA_TELEMETRY_RETENTION_DAYS:-90}
      AURA_DATABASE_URL_FILE: /run/secrets/postgres_password
      AURA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      AURA_QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      # Workers read and write memories too (memory consolidation), so they need the same
      # encryption-at-rest key as the gateway -- see the top-level `secrets:` block.
      AURA_DATA_ENCRYPTION_KEYS_FILE: /run/secrets/data_encryption_keys
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATA_DIR: /var/lib/aura/workspace
      AURA_LEARNING_DATASET_DIR: /var/lib/aura/datasets
      DEBUG_MODE: "false"
    secrets: [postgres_password, redis_password, qdrant_api_key, hfspace_api_key, hosted1_api_key, hosted2_api_key, hosted3_api_key, data_encryption_keys]
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  worker-ingestion:
    user: "0:0"  # root until secrets/volumes are migrated; see the gateway service
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
      args: *release_args
    <<: *restart
    logging: *logging
    command: celery -A tasks worker -Q ingestion,learning -c 2 --loglevel=info --max-tasks-per-child=50
    stop_grace_period: 120s
    healthcheck: *celery_worker_healthcheck
    environment: *worker_env
    secrets: [postgres_password, redis_password, qdrant_api_key, hfspace_api_key, hosted1_api_key, hosted2_api_key, hosted3_api_key, data_encryption_keys]
    volumes:
      - aura_workspace:/var/lib/aura/workspace
      - aura_datasets:/var/lib/aura/datasets
    # egress: HttpSourceFetcher pulls approved https sources during refresh.
    networks: [data, egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 2G}

  # Optional Loop B trainer: real PEFT LoRA (LocalLoraTrainer). Not started by default, and
  # the only image built with requirements-train.txt (peft stays out of the gateway). Bring up:
  #   docker compose -f deploy/docker-compose.prod.yml --profile training up -d worker-training
  # Consumes only the `training` queue. On a CPU-only host also set
  # LEARNING_FINETUNE_ALLOW_CPU=true; the base model must be a Hugging Face id on
  # LEARNING_FINETUNE_CPU_BASES (Ollama tags cannot be trained). See docs/guides/mlops-guide.md.
  worker-training:
    user: "0:0"  # root until secrets/volumes are migrated; see the gateway service
    profiles: [training]
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
      # The only image with requirements-train.txt (peft). Without it LocalLoraTrainer fails
      # every job with a ConfigurationError -- see docs/guides/mlops-guide.md.
      args:
        <<: *release_args
        AURA_TRAINING_DEPS: "true"
    <<: *restart
    logging: *logging
    command: celery -A tasks worker -Q training -c 1 --loglevel=info --max-tasks-per-child=1
    # A training run outlives any grace period; training tasks are not acks_late (a redelivery
    # would retrain for hours), so a deploy that stops this worker fails the running job.
    stop_grace_period: 120s
    healthcheck: *celery_worker_healthcheck
    environment:
      <<: *worker_env
      AURA_FINETUNE_TRAINER: local
      AURA_LEARNING_DATASET_DIR: /var/lib/aura/datasets
    secrets: [postgres_password, redis_password, qdrant_api_key, hfspace_api_key, hosted1_api_key, hosted2_api_key, hosted3_api_key, data_encryption_keys]
    volumes:
      - aura_workspace:/var/lib/aura/workspace
      - aura_datasets:/var/lib/aura/datasets
    networks: [data, egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      ollama: {condition: service_started}
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 4G}

  beat:
    user: "0:0"  # root until secrets/volumes are migrated; see the gateway service
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
      args: *release_args
    <<: *restart
    logging: *logging
    # Scheduler only. knowledge_refresh_task and memory_consolidate_task run on
    # worker-ingestion (`learning` queue), which has Postgres/Qdrant/Ollama.
    # --schedule names the default path explicitly so the beat healthcheck and beat agree on it.
    command: celery -A celery_app beat --loglevel=info --schedule=/app/celerybeat-schedule
    stop_grace_period: 30s
    healthcheck: *celery_beat_healthcheck
    environment: *worker_env
    secrets: [postgres_password, redis_password, qdrant_api_key, hfspace_api_key, hosted1_api_key, hosted2_api_key, hosted3_api_key, data_encryption_keys]
    networks: [data]
    depends_on:
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}

  # ------------------------------------------------------------------ inference
  ollama:
    # Digest-pinned :latest tags match the images already running on the VPS (2026-08-21).
    image: ollama/ollama:latest@sha256:9d30908e41144b1f1da89b9d8e33c07e4aeb43ff41a8660241b1686e2cc330ad
    <<: *restart
    logging: *logging
    volumes:
      - ollama_models:/root/.ollama
    # data: reachable by the gateway that calls it. egress: the only service that needs a
    # route to the internet, to pull model weights -- see the `egress` network's comment above.
    networks: [data, egress, aura_edge]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # One model resident; a second would evict the first on a 16 GB box and turn every
      # other request into a cold load.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 30m
      # One in-flight generation: two concurrent CPU jobs on this 8-core box
      # time-share the model and both miss the chat timeout.
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        # 6 of 8 cores for inference; leave 2 for postgres/redis/gateway/nginx.
        limits: {cpus: "6.0", memory: 10G}
    # For a GPU host, uncomment and install the NVIDIA container toolkit:
    #   deploy.resources.reservations.devices:
    #     - {driver: nvidia, count: 1, capabilities: [gpu]}

  # Optional GPU-backed vLLM node for the "large" quality-tier provider (hybrid setup --
  # docs/reports/OLLAMA_VLLM_COMPARISON.md §4 Option B, walkthrough in
  # docs/guides/gpu-hybrid-setup.md). Not started by a plain `docker compose up -d`: it
  # requires an NVIDIA GPU + the NVIDIA container toolkit on this host, so it is gated behind
  # a compose profile rather than a commented device-reservation block like `ollama`'s --
  # there is no CPU fallback worth shipping for vllm the way there is for ollama. Bring up with:
  #   docker compose -f deploy/docker-compose.prod.yml --profile gpu up -d vllm
  # then add the AURA_PROVIDER_LARGE_* variables (see deploy/.env.example) to deploy/.env and
  # restart gateway/workers so they pick up the second provider.
  #
  # Production multi-pool serving (general + coder + embedding, revision-pinned, prefix caching,
  # admission-aligned --max-num-seqs) is the opt-in override deploy/docker-compose.gpu.yml, which
  # extends this service rather than duplicating it -- see docs/guides/gpu-hybrid-setup.md §6.
  vllm:
    profiles: [gpu]
    # Version tag + digest (Docker Hub manifest list for v0.29.0, looked up 2026-09-24). Never
    # :latest -- an unpinned inference server changes sampling/tokenizer behaviour under you.
    image: vllm/vllm-openai:v0.29.0@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
    <<: *restart
    logging: *logging
    command: >
      --model ${AURA_VLLM_MODEL:-Qwen/Qwen2.5-32B-Instruct-AWQ}
      --host 0.0.0.0 --port 8000
      --gpu-memory-utilization ${AURA_VLLM_GPU_MEMORY_UTILIZATION:-0.90}
    volumes:
      - vllm_models:/root/.cache/huggingface
    # data: reachable by the gateway/workers that call it. egress: to pull weights from
    # Hugging Face -- see the `egress` network's comment above.
    networks: [data, egress]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/models', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 16G}
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}

  # ------------------------------------------------------------------ data tier
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    <<: *restart
    logging: *logging
    environment:
      POSTGRES_USER: aura
      POSTGRES_DB: aura
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # scram-sha-256 rather than the md5 default.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2G}

  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    <<: *restart
    logging: *logging
    # requirepass from a secret file, appendonly for durability (refresh tokens and rate
    # limit state live here), and a bounded maxmemory with LRU so a cache flood cannot OOM.
    command: >
      sh -c 'redis-server
      --requirepass "$$(cat /run/secrets/redis_password)"
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --protected-mode yes'
    secrets: [redis_password]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 768M}

  qdrant:
    image: qdrant/qdrant:latest@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    <<: *restart
    logging: *logging
    environment:
      QDRANT__SERVICE__API_KEY_FILE: /run/secrets/qdrant_api_key
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT_SHARE: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: "2"
    secrets: [qdrant_api_key]
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [data]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2G}

  # ------------------------------------------------------------------ observability
  prometheus:
    image: prom/prometheus:latest@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    <<: *restart
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    networks: [observability, edge]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 1G}

  alertmanager:
    image: prom/alertmanager:latest@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    <<: *restart
    logging: *logging
    entrypoint: ["/bin/sh", "/scripts/alertmanager-entrypoint.sh"]
    environment:
      # Receivers come from env/secrets, never from a committed URL (AURA-015).
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      ALERTMANAGER_CRITICAL_WEBHOOK_URL: ${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-}
      ALERTMANAGER_WEBHOOK_URL_FILE: ${ALERTMANAGER_WEBHOOK_URL_FILE:-}
      ALERTMANAGER_SMTP_SMARTHOST: ${ALERTMANAGER_SMTP_SMARTHOST:-}
      ALERTMANAGER_SMTP_FROM: ${ALERTMANAGER_SMTP_FROM:-}
      ALERTMANAGER_SMTP_TO: ${ALERTMANAGER_SMTP_TO:-}
      ALERTMANAGER_SMTP_TO_CRITICAL: ${ALERTMANAGER_SMTP_TO_CRITICAL:-}
      ALERTMANAGER_SMTP_AUTH_USERNAME: ${ALERTMANAGER_SMTP_AUTH_USERNAME:-}
      ALERTMANAGER_SMTP_AUTH_PASSWORD: ${ALERTMANAGER_SMTP_AUTH_PASSWORD:-}
      ALERTMANAGER_SMTP_REQUIRE_TLS: ${ALERTMANAGER_SMTP_REQUIRE_TLS:-}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./scripts/alertmanager-entrypoint.sh:/scripts/alertmanager-entrypoint.sh:ro
    secrets: [alertmanager_webhook_url]
    networks: [observability]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}

  grafana:
    image: grafana/grafana:latest@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    <<: *restart
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Nginx auth_request already gates /grafana/. Anonymous Viewer is what
      # lets the console iframe render dashboards without a second Grafana login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SERVER_ROOT_URL: https://${AURA_DOMAIN:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets: [grafana_admin_password]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [observability]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  loki:
    image: grafana/loki:latest@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    <<: *restart
    logging: *logging
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks: [observability]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 768M}

  promtail:
    image: grafana/promtail:latest@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    <<: *restart
    logging: *logging
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [observability]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}

  node-exporter:
    image: prom/node-exporter:latest@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    <<: *restart
    logging: *logging
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro,rslave
      - backup_textfile:/textfile:ro
    networks: [observability]
    deploy:
      resources:
        limits: {cpus: "0.2", memory: 128M}

  # ------------------------------------------------------------------ maintenance
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    <<: *restart
    logging: *logging
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGUSER: aura
      PGDATABASE: aura
      PGHOST: postgres
      PGPASSFILE: /run/secrets/postgres_password
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_OFFSITE_RETENTION_DAYS: ${BACKUP_OFFSITE_RETENTION_DAYS:-14}
      # P1.3: encryption is ON by default and fails closed -- with no recipient configured the
      # cycle refuses to run (AuraBackupMisconfigured) rather than write plaintext. Only the age
      # PUBLIC key goes here or in deploy/secrets/backup/backup_age_recipients.txt; the private key stays
      # offline. See docs/guides/maintenance-guide.md "Backup encryption keys".
      BACKUP_ENCRYPTION: ${BACKUP_ENCRYPTION:-age}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_AGE_RECIPIENTS_FILE: /run/backup-secrets/backup_age_recipients.txt
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_OFFSITE_KEEP_DAILY: ${BACKUP_OFFSITE_KEEP_DAILY:-}
      BACKUP_OFFSITE_KEEP_WEEKLY: ${BACKUP_OFFSITE_KEEP_WEEKLY:-}
      BACKUP_OFFSITE_KEEP_MONTHLY: ${BACKUP_OFFSITE_KEEP_MONTHLY:-}
      BACKUP_OFFSITE_VERIFY: ${BACKUP_OFFSITE_VERIFY:-check}
      QDRANT_URL: http://qdrant:6333
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      # Multi-provider offsite (docs/plans/distributed_storage_plan.md): space-separated rclone
      # remotes named in rclone.conf, e.g. "b2-aura:aura-backups r2-aura:aura-backups". A set
      # counts as durable only when BACKUP_OFFSITE_MIN_COPIES of them verify (default 2).
      BACKUP_OFFSITE_TARGETS: ${BACKUP_OFFSITE_TARGETS:-}
      BACKUP_OFFSITE_MIN_COPIES: ${BACKUP_OFFSITE_MIN_COPIES:-2}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ACCESS_KEY_FILE: /run/backup-secrets/backup_s3_access_key
      BACKUP_S3_SECRET_KEY_FILE: /run/backup-secrets/backup_s3_secret_key
      RCLONE_CONFIG_FILE: /run/backup-secrets/rclone.conf
      BACKUP_METRICS_DIR: /textfile
    secrets: [postgres_password, qdrant_api_key, redis_password]
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
      # Only the backup-specific files (age recipients, S3 keys, rclone.conf), never the
      # whole secrets directory: this container sits on the egress network running a
      # third-party sync tool, and the directory above also holds jwt_secret and the
      # data-encryption KEK (audit FSA-008 / GAP-046 / CB-08). bootstrap-secrets.sh creates
      # the subdirectory and moves files from the old flat location.
      - ./secrets/backup:/run/backup-secrets:ro
      - backup_textfile:/textfile
    # data = Postgres/Qdrant/Redis. egress = rclone to S3-compatible storage.
    networks: [data, egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

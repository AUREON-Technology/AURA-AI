# AURA AI -- production stack for a single VPS (Scalability Report, Stage 0).
#
# Differences from the repository-root docker-compose.yml, each closing a finding:
#
#   SEC-12  Only Nginx publishes a port. Postgres, Redis, and Qdrant sit on an internal
#           network with no host binding -- the existing compose file exposes 5432, 6379,
#           and 6333 on the host with no authentication on Redis or Qdrant.
#   SEC-08  Secrets come from Docker secret files, never from environment variables baked
#           into the image or readable via `docker inspect`. No secret has a default.
#   TD-06   Every stateful service has a named volume; nothing writes to a container path
#           that vanishes on restart.
#   Perf    Resource limits on every service, so one runaway container cannot starve the
#           inference process on a 4-vCPU box.
#
# Bring up:  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
# See docs/guides/deployment-guide.md for first-run setup and TLS.

name: aura

# Release identity (BLOCK-03), passed to every image built from aura_backend/Dockerfile so a
# running container can answer "which commit am I?" on /health/version. Exported into the
# process environment by deploy/scripts/vps-update.sh before it builds -- compose interpolation
# reads that ahead of --env-file, so the SHA never lingers in .env for the next run to inherit.
# Empty locally, which AuraSettings.validate() rejects only for a production environment.
x-release-args: &release_args
  GIT_SHA: ${AURA_GIT_SHA:-}
  GIT_REF: ${AURA_GIT_REF:-}
  BUILD_TIME: ${AURA_BUILD_TIME:-}
  DEPLOYMENT_ID: ${AURA_DEPLOYMENT_ID:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-restart: &restart
  restart: unless-stopped

# Celery healthchecks (audit F-25). Each worker pings only its own node; beat checks the broker
# and that its schedule file is still being written. Why each is shaped this way is in
# aura_backend/scripts/celery_healthcheck.py. Kept identical in docker-compose.dev.yml (parity).
x-celery-worker-healthcheck: &celery_worker_healthcheck
  test: ["CMD", "python", "/app/scripts/celery_healthcheck.py", "worker"]
  interval: 60s
  timeout: 30s
  retries: 3
  start_period: 120s

x-celery-beat-healthcheck: &celery_beat_healthcheck
  test: ["CMD", "python", "/app/scripts/celery_healthcheck.py", "beat"]
  interval: 120s
  timeout: 30s
  retries: 3
  start_period: 300s

# Hosted open-weight providers (ADR-030; docs/roadmaps/AURA_FREE_HOSTED_INFERENCE_PLAN.md).
# Three vendor-neutral slots, HOSTED1..HOSTED3, each pointed at a provider by .env. Every slot
# is a no-op until BOTH AURA_ALLOW_HOSTED_INFERENCE=true AND AURA_LLM_PROVIDERS lists it (e.g.
# `hosted1,hosted2,local`). Even then, ProviderConfig refuses a slot whose base URL is not on
# the hosted allowlist or whose model is not open-weight, and the router sends a slot only
# content at or below its MAX_DATA_CLASSIFICATION (internal by default: documents, memory,
# tool output and Engineer workspaces stay on `local`).
#
# Merged into the gateway AND every worker. Workers never route to a slot: their generations
# carry no turn classification, so they count as SENSITIVE and stay local. They still need the
# variables, though: AURA_LLM_PROVIDERS is shared, and a listed provider with no base URL is a
# boot failure. Workers sit on the internal `data` network and have no route out anyway. The
# gateway reaches the internet over `edge`, the same path it already uses for GitHub and the
# HF Space; no network was widened for this.
#
# Keys are file-backed like hfspace_api_key: secret_hydration.py reads
# /run/secrets/hostedN_api_key into AURA_PROVIDER_HOSTEDN_API_KEY. bootstrap-secrets.sh writes a
# random placeholder so the file exists; overwrite it with the real key before enabling a slot:
#   printf '%s' "$KEY" > deploy/secrets/hosted1_api_key
#
# AURA_ALLOW_HOSTED_INFERENCE defaults to "false", not empty: aura_core rejects an empty boolean,
# and that error would mask the one that explains the opt-in. AURA_LLM_ROUTING_POLICY was never
# forwarded before (the gateway ran the code default, `balanced`, whatever .env said); a
# hosted-primary topology needs `quality_first`, so it is forwarded here with the same default.
x-hosted-providers: &hosted_providers
  AURA_ALLOW_HOSTED_INFERENCE: ${AURA_ALLOW_HOSTED_INFERENCE:-false}
  AURA_LLM_ROUTING_POLICY: ${AURA_LLM_ROUTING_POLICY:-balanced}
  AURA_LLM_RATE_LIMIT_COOLDOWN_S: ${AURA_LLM_RATE_LIMIT_COOLDOWN_S:-30}
  # ADR-033: a slot may also be KIND=claude (no BASE_URL; MODEL=claude-opus-5-5). Refused
  # unless AURA_ALLOW_CLAUDE_INFERENCE=true, which AURA_ALLOW_HOSTED_INFERENCE does not cover.
  # COMPLEXITY_ROUTING sends complex interactive turns to the `reasoning` pool, so set that
  # slot's POOLS=reasoning.
  # For the Engineer (module readiness WP6, D-02) the slot instead takes POOLS=coder,
  # MAX_DATA_CLASSIFICATION=sensitive, WORKLOADS=engineer (the fence: without it a sensitive slot
  # receives every unhinted generation) and USER_TPD (per-person daily cap, shared through Redis).
  AURA_ALLOW_CLAUDE_INFERENCE: ${AURA_ALLOW_CLAUDE_INFERENCE:-false}
  AURA_LLM_COMPLEXITY_ROUTING: ${AURA_LLM_COMPLEXITY_ROUTING:-false}
  AURA_LLM_COMPLEXITY_THRESHOLD: ${AURA_LLM_COMPLEXITY_THRESHOLD:-0.5}
  AURA_PROVIDER_HOSTED1_KIND: ${AURA_PROVIDER_HOSTED1_KIND:-openai_compatible}
  AURA_PROVIDER_HOSTED1_MODEL: ${AURA_PROVIDER_HOSTED1_MODEL:-}
  AURA_PROVIDER_HOSTED1_BASE_URL: ${AURA_PROVIDER_HOSTED1_BASE_URL:-}
  AURA_PROVIDER_HOSTED1_QUALITY_TIER: ${AURA_PROVIDER_HOSTED1_QUALITY_TIER:-3}
  AURA_PROVIDER_HOSTED1_SPEED_TIER: ${AURA_PROVIDER_HOSTED1_SPEED_TIER:-3}
  AURA_PROVIDER_HOSTED1_CONTEXT_WINDOW: ${AURA_PROVIDER_HOSTED1_CONTEXT_WINDOW:-8192}
  AURA_PROVIDER_HOSTED1_MAX_OUTPUT_TOKENS: ${AURA_PROVIDER_HOSTED1_MAX_OUTPUT_TOKENS:-1024}
  AURA_PROVIDER_HOSTED1_SUPPORTS_TOOLS: ${AURA_PROVIDER_HOSTED1_SUPPORTS_TOOLS:-true}
  AURA_PROVIDER_HOSTED1_SUPPORTS_JSON_MODE: ${AURA_PROVIDER_HOSTED1_SUPPORTS_JSON_MODE:-false}
  AURA_PROVIDER_HOSTED1_TIMEOUT_S: ${AURA_PROVIDER_HOSTED1_TIMEOUT_S:-60}
  AURA_PROVIDER_HOSTED1_HEALTH_TIMEOUT_S: ${AURA_PROVIDER_HOSTED1_HEALTH_TIMEOUT_S:-10}
  AURA_PROVIDER_HOSTED1_HEALTH_PATH: ${AURA_PROVIDER_HOSTED1_HEALTH_PATH:-/models}
  AURA_PROVIDER_HOSTED1_MAX_CONCURRENCY: ${AURA_PROVIDER_HOSTED1_MAX_CONCURRENCY:-4}
  AURA_PROVIDER_HOSTED1_RPM: ${AURA_PROVIDER_HOSTED1_RPM:-0}
  AURA_PROVIDER_HOSTED1_RPD: ${AURA_PROVIDER_HOSTED1_RPD:-0}
  AURA_PROVIDER_HOSTED1_TPM: ${AURA_PROVIDER_HOSTED1_TPM:-0}
  AURA_PROVIDER_HOSTED1_TPD: ${AURA_PROVIDER_HOSTED1_TPD:-0}
  AURA_PROVIDER_HOSTED1_MAX_DATA_CLASSIFICATION: ${AURA_PROVIDER_HOSTED1_MAX_DATA_CLASSIFICATION:-}
  AURA_PROVIDER_HOSTED1_TOKENS_PER_SECOND: ${AURA_PROVIDER_HOSTED1_TOKENS_PER_SECOND:-0}

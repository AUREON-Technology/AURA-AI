  AURA_PROVIDER_HOSTED1_ALLOW_PROMPT_TRAINING: ${AURA_PROVIDER_HOSTED1_ALLOW_PROMPT_TRAINING:-false}
  AURA_PROVIDER_HOSTED1_POOLS: ${AURA_PROVIDER_HOSTED1_POOLS:-}

# Egress allowlist for engineer-agent workspaces.
#
# The `sandbox_egress` network is `internal: true`, so this proxy is the only way out. A
# workspace runs shell commands a model chose against a repository an attacker may control, and
# it lives for days -- "it can reach the whole internet" is not a property to leave on for that.
#
# `ConnectPort` is the half that actually matters for HTTPS. Everything a workspace fetches
# (git clone, pip, npm) is TLS, which reaches the proxy as CONNECT, and a permissive CONNECT list
# would make every rule below decorative. Only 443 is allowed, so a workspace cannot use this to
# reach an arbitrary service on an arbitrary port.
#
# Adding a host: add a `Filter` entry, not a wildcard. The list is meant to be short enough to
# read and justify line by line.

User nobody
Group nogroup
Port 8888

# Bound to every interface *inside an internal Docker network* -- there is no route from the host
# or the internet to this container.
Listen 0.0.0.0
Timeout 600

MaxClients 40
StartServers 2
MinSpareServers 2
MaxSpareServers 8

LogLevel Notice

# Default deny. Without this the filter file would be an allowlist that permits everything not
# mentioned, which is the opposite of the intent.
FilterDefaultDeny Yes
FilterURLs Off
FilterExtended On
FilterCaseSensitive Off
Filter "/etc/tinyproxy/filter"

# TLS only. See the note above: this is what stops CONNECT being a general-purpose tunnel.
ConnectPort 443

# Do not advertise the proxy's own identity or the client's to upstream hosts.
DisableViaHeader Yes

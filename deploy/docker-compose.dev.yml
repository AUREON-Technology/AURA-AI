  AURA_PROVIDER_HOSTED3_API_KEY_FILE: /run/secrets/hosted3_api_key

networks:
  # Internal app bridge (gateway â†” console). Nginx reaches these via aura_edge.
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  # Shared with prod nginx + ollama (created by prod stack as `aura_edge`).
  aura_edge:
    external: true
    name: aura_edge
  # Engineer agent (AURA_SANDBOX_ENABLED, off by default) -- see docker-compose.prod.yml's
  # `sandbox_ctl`/`sandbox_egress`/`docker-socket-proxy` comments for the full rationale; this
  # dev stack mirrors the same shape rather than repeating it.
  sandbox_ctl:
    driver: bridge
    internal: true
  # Mirrors prod: no default route out; sandboxes reach the internet only via sandbox-proxy.
  sandbox_egress:
    driver: bridge
    internal: true

volumes:
  postgres_data_dev:
  qdrant_data_dev:
  redis_data_dev:
  aura_workspace_dev:
  aura_datasets_dev:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  qdrant_api_key:
    file: ./secrets/qdrant_api_key
  jwt_secret:
    file: ./secrets/jwt_secret
  firebase_credentials:
    file: ./secrets/firebase_credentials.json
  # See docker-compose.prod.yml's `secrets:` block for what these two are.
  secrets_encryption_key:
    file: ./secrets/secrets_encryption_key
  # Encryption-at-rest key for memories/personal-OS records -- see docker-compose.prod.yml's
  # `secrets:` block. Optional here (AURA_ENVIRONMENT=development runs in plaintext without it)
  # but wired the same way so the dev stack exercises the encrypted path prod runs.
  data_encryption_keys:
    file: ./secrets/data_encryption_keys
  github_oauth_client_secret:
    file: ./secrets/github_oauth_client_secret
  # API keys for the hosted open-weight slots (x-hosted-providers above). Placeholders from
  # bootstrap-secrets.sh until overwritten; unused unless the slot is enabled.
  hosted1_api_key:
    file: ./secrets/hosted1_api_key
  hosted2_api_key:
    file: ./secrets/hosted2_api_key
  hosted3_api_key:
    file: ./secrets/hosted3_api_key

services:
  console:
    container_name: aura-dev-console
    build:
      context: ../aura_admin
      dockerfile: Dockerfile
      args:
        NEXT_BASE_PATH: /console
        NEXT_PUBLIC_BASE_PATH: /console
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-87789110323-5picq501c0834g6g0amjqqpk628jaoh2.apps.googleusercontent.com}
        NEXT_PUBLIC_GRAFANA_EMBED: "0"
    <<: *restart
    logging: *logging
    environment:
      AURA_API_URL: http://dev-gateway:8000
      NEXT_BASE_PATH: /console
      NEXT_PUBLIC_BASE_PATH: /console
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_GRAFANA_EMBED: "0"
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    networks: [edge, aura_edge]
    depends_on:
      dev-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/console/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  dev-gateway:
    container_name: aura-dev-gateway
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
      args: *release_args
    <<: *restart
    logging: *logging
    command: >
      uvicorn aura_service:app
      --host 0.0.0.0 --port 8000
      --workers ${AURA_WORKERS:-2}
      --proxy-headers --forwarded-allow-ips='*'
      --timeout-keep-alive 65
    environment:
      <<: *hosted_providers
      AURA_ENVIRONMENT: ${AURA_ENVIRONMENT:-development}
      AURA_LOG_FORMAT: json
      AURA_LOG_LEVEL: ${AURA_LOG_LEVEL:-DEBUG}
      AURA_METRICS_ENABLED: "true"
      PROMETHEUS_MULTIPROC_DIR: /var/lib/aura/prometheus
      AURA_VECTOR_BACKEND: qdrant
      AURA_DOCUMENT_BACKEND: postgres
      AURA_MEMORY_BACKEND: postgres
      AURA_CACHE_BACKEND: redis
      AURA_QDRANT_URL: http://qdrant:6333
      AURA_TRUSTED_PROXY_COUNT: "1"
      AURA_LLM_PROVIDERS: ${AURA_LLM_PROVIDERS:-local}
      AURA_LLM_TIMEOUT_S: ${AURA_LLM_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_KIND: openai_compatible
      AURA_PROVIDER_LOCAL_BASE_URL: ${AURA_PROVIDER_LOCAL_BASE_URL:-http://ollama:11434/v1}
      AURA_PROVIDER_LOCAL_MODEL: ${AURA_PROVIDER_LOCAL_MODEL:-${AURA_LOCAL_MODEL:-qwen2.5:3b-instruct-q4_K_M}}
      AURA_PROVIDER_LOCAL_TIMEOUT_S: ${AURA_PROVIDER_LOCAL_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_IS_LOCAL: "true"
      AURA_PROVIDER_LOCAL_QUALITY_TIER: "1"
      AURA_PROVIDER_LOCAL_MAX_CONCURRENCY: ${AURA_PROVIDER_LOCAL_MAX_CONCURRENCY:-1}
      # Admission control (roadmap P2.4, aura_core/llm/admission.py). With the local provider's
      # cap of 1 (matching OLLAMA_NUM_PARALLEL=1), a request that finds Ollama busy now waits in
      # AURA's bounded priority queue -- interactive/voice ahead of Engineer ahead of background
      # work -- and is refused with 503 + Retry-After after the timeout, instead of piling up
      # invisibly inside Ollama until the 180s provider timeout cancels it mid-generation.
      # Per *process*: the effective cap on Ollama is this x AURA_WORKERS (+ Celery workers).
      AURA_LLM_ADMISSION_MAX_QUEUE: ${AURA_LLM_ADMISSION_MAX_QUEUE:-4}
      AURA_LLM_ADMISSION_QUEUE_TIMEOUT_S: ${AURA_LLM_ADMISSION_QUEUE_TIMEOUT_S:-90}
      AURA_LLM_USER_MAX_CONCURRENT_GENERATIONS: ${AURA_LLM_USER_MAX_CONCURRENT_GENERATIONS:-2}
      AURA_EMBEDDING_PROVIDER: ${AURA_EMBEDDING_PROVIDER:-sentence-transformers}
      AURA_EMBEDDING_MODEL: ${AURA_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      AURA_EMBEDDING_DIMENSION: ${AURA_EMBEDDING_DIMENSION:-384}
      AURA_MODEL_ALLOWLIST: ${AURA_MODEL_ALLOWLIST:-}
      AURA_DATABASE_URL_FILE: /run/secrets/postgres_password
      AURA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      AURA_QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      AURA_JWT_SECRET_FILE: /run/secrets/jwt_secret
      AURA_SECRETS_ENCRYPTION_KEY_FILE: /run/secrets/secrets_encryption_key
      AURA_GITHUB_OAUTH_CLIENT_SECRET_FILE: /run/secrets/github_oauth_client_secret
      # Encryption at rest for memories/personal-OS records -- see the top-level `secrets:` block.
      AURA_DATA_ENCRYPTION_KEYS_FILE: /run/secrets/data_encryption_keys
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase_credentials
      AURA_DOMAIN: ${AURA_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080,https://${AURA_DOMAIN}}
      ALLOW_MOCK_ATTESTATION: ${ALLOW_MOCK_ATTESTATION:-true}
      DEBUG_MODE: "false"
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      AURA_IOS_BUNDLE_ID: ${AURA_IOS_BUNDLE_ID:-com.auraai.auraClient}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEVELOPER_EMAILS: ${DEVELOPER_EMAILS:-}
      # See docker-compose.prod.yml's gateway env block for what this does.
      AURA_ENGINEER_AGENT_ROLES: ${AURA_ENGINEER_AGENT_ROLES:-}
      DATA_DIR: /var/lib/aura/workspace
      AURA_VOICE_LIVE_ENABLED: ${AURA_VOICE_LIVE_ENABLED:-true}
      AURA_VOICE_LIVE_MAX_SESSIONS: ${AURA_VOICE_LIVE_MAX_SESSIONS:-4}
      AURA_LEARNING_DATASET_DIR: /var/lib/aura/datasets
      LEARNING_FINETUNE_MIN_EXAMPLES: ${LEARNING_FINETUNE_MIN_EXAMPLES:-12}
      LEARNING_FINETUNE_MIN_USERS: ${LEARNING_FINETUNE_MIN_USERS:-5}
      LEARNING_FINETUNE_ALLOW_CPU: ${LEARNING_FINETUNE_ALLOW_CPU:-true}
      # The gateway never trains (GAP-017/018): `scripted` records every launched job as
      # NOT_TRAINED and registers nothing. Real LoRA runs only on worker-training (profile
      # `training`), which consumes the `training` queue. Fixed, not ${...}-overridable, and
      # identical in docker-compose.prod.yml -- it used to default to `local` here, which ran
      # the (then fake) trainer inside the gateway.
      AURA_FINETUNE_TRAINER: scripted
      # Engineer agent (Phase J) -- off by default, same as prod. See
      # docker-compose.prod.yml's gateway env block for what each setting does.
      AURA_SANDBOX_ENABLED: ${AURA_SANDBOX_ENABLED:-false}
      # Built by `sandbox-image` below (not pulled) so IMAGES stays off the socket proxy.
      AURA_SANDBOX_IMAGE: ${AURA_SANDBOX_IMAGE:-aura-sandbox:latest}
      AURA_SANDBOX_PROXY_URL: ${AURA_SANDBOX_PROXY_URL:-http://sandbox-proxy:8888}
      AURA_SANDBOX_NETWORK: sandbox_egress
      # Its own root, never prod's: the dev stack shares this host with prod, and one directory
      # for both would let a dev workspace collide with a production one. Bind-mounted at the
      # same path -- see docker-compose.prod.yml's AURA_SANDBOX_HOST_ROOT for why that matters.
      AURA_SANDBOX_HOST_ROOT: ${AURA_SANDBOX_DEV_HOST_ROOT:-/opt/aura-stack/deploy/sandboxes-dev}
      AURA_SANDBOX_WORKSPACE_TTL_HOURS: ${AURA_SANDBOX_WORKSPACE_TTL_HOURS:-72}
      AURA_SANDBOX_MAX_WORKSPACES: ${AURA_SANDBOX_DEV_MAX_WORKSPACES:-2}
      AURA_SANDBOX_MAX_RUNNING: ${AURA_SANDBOX_DEV_MAX_RUNNING:-1}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      AURA_GITHUB_ENABLED: ${AURA_GITHUB_ENABLED:-false}
      AURA_GITHUB_DEFAULT_OWNER: ${AURA_GITHUB_DEFAULT_OWNER:-}
      AURA_GITHUB_DEFAULT_REPO: ${AURA_GITHUB_DEFAULT_REPO:-}
      # Per-user GitHub OAuth connect flow -- off by default, same as prod. See
      # docker-compose.prod.yml's gateway env block for what each setting does.
      AURA_GITHUB_OAUTH_ENABLED: ${AURA_GITHUB_OAUTH_ENABLED:-false}
      AURA_GITHUB_OAUTH_CLIENT_ID: ${AURA_GITHUB_OAUTH_CLIENT_ID:-}
      AURA_GITHUB_OAUTH_CALLBACK_URL: ${AURA_GITHUB_OAUTH_CALLBACK_URL:-https://${AURA_DOMAIN}/api/v3/integrations/github/callback}
      AURA_MCP_ENABLED: ${AURA_MCP_ENABLED:-false}
      AURA_MCP_SERVERS_JSON: ${AURA_MCP_SERVERS_JSON:-}
      # Track AP connectors (ADR-021), off by default. Credentials are vaulted under the
      # secrets_encryption_key mounted above; without it a credentialed connector is refused.
      AURA_ADAPTATION_ENABLED: ${AURA_ADAPTATION_ENABLED:-false}
      # Project Twin labeling (AP4, ADR-026): off = humanised identifiers, the complete
      # degraded mode. On, it batches names through the self-hosted router, never a turn.
      AURA_ADAPTATION_LABELER_ENABLED: ${AURA_ADAPTATION_LABELER_ENABLED:-false}
      # Blueprint runtime (AP7): who may use generated agents/tools (empty = nobody), and the
      # AP8 evaluation gate's mode -- enforce in every stack; advisory only as a rollback lever.
      AURA_PROJECT_DATA_ROLES: ${AURA_PROJECT_DATA_ROLES:-}
      AURA_ADAPTATION_GATE_MODE: ${AURA_ADAPTATION_GATE_MODE:-enforce}
    secrets:
      [
        postgres_password,
        redis_password,
        qdrant_api_key,
        jwt_secret,
        firebase_credentials,
        secrets_encryption_key,
        github_oauth_client_secret,
        data_encryption_keys,
        hosted1_api_key,
        hosted2_api_key,
        hosted3_api_key,
      ]
    volumes:
      - aura_workspace_dev:/var/lib/aura/workspace
      - aura_datasets_dev:/var/lib/aura/datasets
      - ${AURA_SANDBOX_DEV_HOST_ROOT:-/opt/aura-stack/deploy/sandboxes-dev}:${AURA_SANDBOX_DEV_HOST_ROOT:-/opt/aura-stack/deploy/sandboxes-dev}
    networks: [edge, data, aura_edge, sandbox_ctl]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).status==200 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 2G}

  # Engineer agent (AURA_SANDBOX_ENABLED, off by default) -- mirrors prod: IMAGES off because
  # `sandbox-image` builds the workspace image locally. See prod's docker-socket-proxy comment.
  docker-socket-proxy:
    profiles: [sandbox]
    image: tecnativa/docker-socket-proxy:0.3.0
    <<: *restart
    logging: *logging
    environment:
      CONTAINERS: "1"
      IMAGES: "0"
      POST: "1"
      EXEC: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      SERVICES: "0"
      SWARM: "0"
      SYSTEM: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      INFO: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SESSION: "0"
      TASKS: "0"
      AUTH: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sandbox_ctl]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  sandbox-image:
    profiles: [sandbox]
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: ${AURA_SANDBOX_IMAGE:-aura-sandbox:latest}
    restart: "no"
    command: ["true"]
    logging: *logging
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  sandbox-proxy:
    profiles: [sandbox]
    image: ${AURA_SANDBOX_PROXY_IMAGE:-vimagick/tinyproxy:latest}
    <<: *restart
    logging: *logging
    volumes:
      - ./sandbox/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./sandbox/filter:/etc/tinyproxy/filter:ro
    networks: [sandbox_egress, egress]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}

  worker-realtime:
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
      args: *release_args
    <<: *restart
    logging: *logging
    command: celery -A tasks worker -Q realtime -c 2 --loglevel=info --max-tasks-per-child=200
    environment: &worker_env
      <<: *hosted_providers
      AURA_ENVIRONMENT: ${AURA_ENVIRONMENT:-development}
      AURA_LOG_FORMAT: json
      AURA_VECTOR_BACKEND: qdrant
      AURA_DOCUMENT_BACKEND: postgres
      AURA_MEMORY_BACKEND: postgres
      AURA_CACHE_BACKEND: redis
      AURA_QDRANT_URL: http://qdrant:6333
      AURA_LLM_PROVIDERS: ${AURA_LLM_PROVIDERS:-local}
      AURA_LLM_TIMEOUT_S: ${AURA_LLM_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_KIND: openai_compatible
      AURA_PROVIDER_LOCAL_BASE_URL: ${AURA_PROVIDER_LOCAL_BASE_URL:-http://ollama:11434/v1}
      AURA_PROVIDER_LOCAL_MODEL: ${AURA_PROVIDER_LOCAL_MODEL:-${AURA_LOCAL_MODEL:-qwen2.5:3b-instruct-q4_K_M}}
      AURA_PROVIDER_LOCAL_TIMEOUT_S: ${AURA_PROVIDER_LOCAL_TIMEOUT_S:-180}
      AURA_PROVIDER_LOCAL_IS_LOCAL: "true"
      AURA_PROVIDER_LOCAL_QUALITY_TIER: "1"
      AURA_PROVIDER_LOCAL_MAX_CONCURRENCY: "1"
      # Admission control -- see the matching block on the gateway. Background work waits longer
      # (nobody is watching a spinner) but still cannot queue without bound.
      AURA_LLM_ADMISSION_MAX_QUEUE: ${AURA_LLM_ADMISSION_MAX_QUEUE:-4}
      AURA_LLM_ADMISSION_QUEUE_TIMEOUT_S: ${AURA_LLM_WORKER_ADMISSION_QUEUE_TIMEOUT_S:-300}
      AURA_EMBEDDING_PROVIDER: ${AURA_EMBEDDING_PROVIDER:-sentence-transformers}
      AURA_EMBEDDING_MODEL: ${AURA_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      AURA_EMBEDDING_DIMENSION: ${AURA_EMBEDDING_DIMENSION:-384}
      AURA_LEARNING_REFRESH_ENABLED: ${AURA_LEARNING_REFRESH_ENABLED:-true}
      AURA_LEARNING_REFRESH_CRON: ${AURA_LEARNING_REFRESH_CRON:-0 2 * * *}
      AURA_DATABASE_URL_FILE: /run/secrets/postgres_password
      AURA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      AURA_QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      # Workers read and write memories too (memory consolidation), so they need the same
      # encryption-at-rest key as the gateway -- see the top-level `secrets:` block.
      AURA_DATA_ENCRYPTION_KEYS_FILE: /run/secrets/data_encryption_keys
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATA_DIR: /var/lib/aura/workspace
      AURA_LEARNING_DATASET_DIR: /var/lib/aura/datasets
      LEARNING_FINETUNE_ALLOW_CPU: ${LEARNING_FINETUNE_ALLOW_CPU:-true}
      DEBUG_MODE: "false"
    secrets: [postgres_password, redis_password, qdrant_api_key, data_encryption_keys, hosted1_api_key, hosted2_api_key, hosted3_api_key]
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 768M}

  worker-ingestion:
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
      args: *release_args
    <<: *restart
    logging: *logging
    command: celery -A tasks worker -Q ingestion,learning -c 2 --loglevel=info --max-tasks-per-child=50
    environment: *worker_env
    secrets: [postgres_password, redis_password, qdrant_api_key, data_encryption_keys, hosted1_api_key, hosted2_api_key, hosted3_api_key]
    volumes:
      - aura_workspace_dev:/var/lib/aura/workspace
      - aura_datasets_dev:/var/lib/aura/datasets
    networks: [data, egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1536M}

  worker-training:
    profiles: [training]
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
      # The only image with requirements-train.txt (peft). Without it LocalLoraTrainer fails
      # every job with a ConfigurationError -- see docs/guides/mlops-guide.md.
      args:
        <<: *release_args
        AURA_TRAINING_DEPS: "true"
    <<: *restart
    logging: *logging
    command: celery -A tasks worker -Q training -c 1 --loglevel=info --max-tasks-per-child=1
    environment:
      <<: *worker_env
      AURA_FINETUNE_TRAINER: local
      LEARNING_FINETUNE_ALLOW_CPU: ${LEARNING_FINETUNE_ALLOW_CPU:-true}
      AURA_LEARNING_DATASET_DIR: /var/lib/aura/datasets
    secrets: [postgres_password, redis_password, qdrant_api_key, data_encryption_keys, hosted1_api_key, hosted2_api_key, hosted3_api_key]
    volumes:
      - aura_workspace_dev:/var/lib/aura/workspace
      - aura_datasets_dev:/var/lib/aura/datasets
    networks: [data, egress, aura_edge]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 4G}

  beat:
    build:
      context: ../aura_backend
      dockerfile: Dockerfile
      args: *release_args
    <<: *restart
    logging: *logging
    command: celery -A celery_app beat --loglevel=info
    environment: *worker_env
    secrets: [postgres_password, redis_password, qdrant_api_key, data_encryption_keys, hosted1_api_key, hosted2_api_key, hosted3_api_key]
    networks: [data]
    depends_on:
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}

  postgres:
    image: postgres:16-alpine
    <<: *restart
    logging: *logging
    environment:
      POSTGRES_USER: aura
      POSTGRES_DB: aura
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets: [postgres_password]
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 1536M}

  redis:
    image: redis:7-alpine
    <<: *restart
    logging: *logging
    command: >
      sh -c 'redis-server
      --requirepass "$$(cat /run/secrets/redis_password)"
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --protected-mode yes'
    secrets: [redis_password]
    volumes:
      - redis_data_dev:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 384M}

  qdrant:
    image: qdrant/qdrant:latest@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    <<: *restart
    logging: *logging
    environment:
      QDRANT__SERVICE__API_KEY_FILE: /run/secrets/qdrant_api_key
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT_SHARE: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: "2"
    secrets: [qdrant_api_key]
    volumes:
      - qdrant_data_dev:/qdrant/storage
    networks: [data]
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 1536M}

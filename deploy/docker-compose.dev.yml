# AURA AI â€” development stack (parallel to production on the same VPS).
#
# Prod ingress (nginx in docker-compose.prod.yml) routes dev.aureon-ai.tech to
# this stack via the shared external network `aura_edge`. Ollama stays on prod
# to save RAM; dev gateway reaches it at http://ollama:11434/v1 over aura_edge.
#
# Bring up:
#   docker compose -p aura-dev -f deploy/docker-compose.dev.yml \
#     --env-file deploy/.env.development --profile training up -d
#
# See docs/guides/deployment-guide.md Â§ Dual-environment VPS.

name: aura-dev

# Release identity (BLOCK-03), mirroring docker-compose.prod.yml so the dev stack can answer
# /health/version too -- the two stacks share a host, and "which build is this?" has to be
# answerable of whichever one is being looked at.
x-release-args: &release_args
  GIT_SHA: ${AURA_GIT_SHA:-}
  GIT_REF: ${AURA_GIT_REF:-}
  BUILD_TIME: ${AURA_BUILD_TIME:-}
  DEPLOYMENT_ID: ${AURA_DEPLOYMENT_ID:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-restart: &restart
  restart: unless-stopped

# Mirrors docker-compose.prod.yml's x-hosted-providers exactly (parity rule: the stacks share
# a host). Hosted open-weight providers (ADR-030; docs/roadmaps/AURA_FREE_HOSTED_INFERENCE_PLAN.md).
# Three vendor-neutral slots, HOSTED1..HOSTED3, each pointed at a provider by .env. Every slot
# is a no-op until BOTH AURA_ALLOW_HOSTED_INFERENCE=true AND AURA_LLM_PROVIDERS lists it (e.g.
# `hosted1,hosted2,local`). Even then, ProviderConfig refuses a slot whose base URL is not on
# the hosted allowlist or whose model is not open-weight, and the router sends a slot only
# content at or below its MAX_DATA_CLASSIFICATION (internal by default: documents, memory,
# tool output and Engineer workspaces stay on `local`).
#
# Merged into the gateway AND every worker. Workers never route to a slot: their generations
# carry no turn classification, so they count as SENSITIVE and stay local. They still need the
# variables, though: AURA_LLM_PROVIDERS is shared, and a listed provider with no base URL is a
# boot failure. Workers sit on the internal `data` network and have no route out anyway. The
# gateway reaches the internet over `edge`, the same path it already uses for GitHub and the
# HF Space; no network was widened for this.
#
# Keys are file-backed like hfspace_api_key: secret_hydration.py reads
# /run/secrets/hostedN_api_key into AURA_PROVIDER_HOSTEDN_API_KEY. bootstrap-secrets.sh writes a
# random placeholder so the file exists; overwrite it with the real key before enabling a slot:
#   printf '%s' "$KEY" > deploy/secrets/hosted1_api_key
#
# AURA_ALLOW_HOSTED_INFERENCE defaults to "false", not empty: aura_core rejects an empty boolean,
# and that error would mask the one that explains the opt-in. AURA_LLM_ROUTING_POLICY was never
# forwarded before (the gateway ran the code default, `balanced`, whatever .env said); a
# hosted-primary topology needs `quality_first`, so it is forwarded here with the same default.
x-hosted-providers: &hosted_providers
  AURA_ALLOW_HOSTED_INFERENCE: ${AURA_ALLOW_HOSTED_INFERENCE:-false}
  AURA_LLM_ROUTING_POLICY: ${AURA_LLM_ROUTING_POLICY:-balanced}
  AURA_LLM_RATE_LIMIT_COOLDOWN_S: ${AURA_LLM_RATE_LIMIT_COOLDOWN_S:-30}
  AURA_PROVIDER_HOSTED1_KIND: ${AURA_PROVIDER_HOSTED1_KIND:-openai_compatible}
  AURA_PROVIDER_HOSTED1_MODEL: ${AURA_PROVIDER_HOSTED1_MODEL:-}
  AURA_PROVIDER_HOSTED1_BASE_URL: ${AURA_PROVIDER_HOSTED1_BASE_URL:-}
  AURA_PROVIDER_HOSTED1_QUALITY_TIER: ${AURA_PROVIDER_HOSTED1_QUALITY_TIER:-3}
  AURA_PROVIDER_HOSTED1_SPEED_TIER: ${AURA_PROVIDER_HOSTED1_SPEED_TIER:-3}
  AURA_PROVIDER_HOSTED1_CONTEXT_WINDOW: ${AURA_PROVIDER_HOSTED1_CONTEXT_WINDOW:-8192}
  AURA_PROVIDER_HOSTED1_MAX_OUTPUT_TOKENS: ${AURA_PROVIDER_HOSTED1_MAX_OUTPUT_TOKENS:-1024}
  AURA_PROVIDER_HOSTED1_SUPPORTS_TOOLS: ${AURA_PROVIDER_HOSTED1_SUPPORTS_TOOLS:-true}
  AURA_PROVIDER_HOSTED1_SUPPORTS_JSON_MODE: ${AURA_PROVIDER_HOSTED1_SUPPORTS_JSON_MODE:-false}
  AURA_PROVIDER_HOSTED1_TIMEOUT_S: ${AURA_PROVIDER_HOSTED1_TIMEOUT_S:-60}
  AURA_PROVIDER_HOSTED1_HEALTH_TIMEOUT_S: ${AURA_PROVIDER_HOSTED1_HEALTH_TIMEOUT_S:-10}
  AURA_PROVIDER_HOSTED1_HEALTH_PATH: ${AURA_PROVIDER_HOSTED1_HEALTH_PATH:-/models}
  AURA_PROVIDER_HOSTED1_MAX_CONCURRENCY: ${AURA_PROVIDER_HOSTED1_MAX_CONCURRENCY:-4}
  AURA_PROVIDER_HOSTED1_RPM: ${AURA_PROVIDER_HOSTED1_RPM:-0}
  AURA_PROVIDER_HOSTED1_RPD: ${AURA_PROVIDER_HOSTED1_RPD:-0}
  AURA_PROVIDER_HOSTED1_TPM: ${AURA_PROVIDER_HOSTED1_TPM:-0}
  AURA_PROVIDER_HOSTED1_TPD: ${AURA_PROVIDER_HOSTED1_TPD:-0}
  AURA_PROVIDER_HOSTED1_MAX_DATA_CLASSIFICATION: ${AURA_PROVIDER_HOSTED1_MAX_DATA_CLASSIFICATION:-}
  AURA_PROVIDER_HOSTED1_TOKENS_PER_SECOND: ${AURA_PROVIDER_HOSTED1_TOKENS_PER_SECOND:-0}
  AURA_PROVIDER_HOSTED1_EXTRA_BODY: ${AURA_PROVIDER_HOSTED1_EXTRA_BODY:-}
  AURA_PROVIDER_HOSTED1_IS_LOCAL: "false"
  AURA_PROVIDER_HOSTED1_API_KEY_ENV: AURA_PROVIDER_HOSTED1_API_KEY
  AURA_PROVIDER_HOSTED1_API_KEY_FILE: /run/secrets/hosted1_api_key
  AURA_PROVIDER_HOSTED2_KIND: ${AURA_PROVIDER_HOSTED2_KIND:-openai_compatible}
  AURA_PROVIDER_HOSTED2_MODEL: ${AURA_PROVIDER_HOSTED2_MODEL:-}
  AURA_PROVIDER_HOSTED2_BASE_URL: ${AURA_PROVIDER_HOSTED2_BASE_URL:-}
  AURA_PROVIDER_HOSTED2_QUALITY_TIER: ${AURA_PROVIDER_HOSTED2_QUALITY_TIER:-3}
  AURA_PROVIDER_HOSTED2_SPEED_TIER: ${AURA_PROVIDER_HOSTED2_SPEED_TIER:-3}
  AURA_PROVIDER_HOSTED2_CONTEXT_WINDOW: ${AURA_PROVIDER_HOSTED2_CONTEXT_WINDOW:-8192}
  AURA_PROVIDER_HOSTED2_MAX_OUTPUT_TOKENS: ${AURA_PROVIDER_HOSTED2_MAX_OUTPUT_TOKENS:-1024}
  AURA_PROVIDER_HOSTED2_SUPPORTS_TOOLS: ${AURA_PROVIDER_HOSTED2_SUPPORTS_TOOLS:-true}
  AURA_PROVIDER_HOSTED2_SUPPORTS_JSON_MODE: ${AURA_PROVIDER_HOSTED2_SUPPORTS_JSON_MODE:-false}
  AURA_PROVIDER_HOSTED2_TIMEOUT_S: ${AURA_PROVIDER_HOSTED2_TIMEOUT_S:-60}
  AURA_PROVIDER_HOSTED2_HEALTH_TIMEOUT_S: ${AURA_PROVIDER_HOSTED2_HEALTH_TIMEOUT_S:-10}
  AURA_PROVIDER_HOSTED2_HEALTH_PATH: ${AURA_PROVIDER_HOSTED2_HEALTH_PATH:-/models}
  AURA_PROVIDER_HOSTED2_MAX_CONCURRENCY: ${AURA_PROVIDER_HOSTED2_MAX_CONCURRENCY:-4}
  AURA_PROVIDER_HOSTED2_RPM: ${AURA_PROVIDER_HOSTED2_RPM:-0}
  AURA_PROVIDER_HOSTED2_RPD: ${AURA_PROVIDER_HOSTED2_RPD:-0}
  AURA_PROVIDER_HOSTED2_TPM: ${AURA_PROVIDER_HOSTED2_TPM:-0}
  AURA_PROVIDER_HOSTED2_TPD: ${AURA_PROVIDER_HOSTED2_TPD:-0}
  AURA_PROVIDER_HOSTED2_MAX_DATA_CLASSIFICATION: ${AURA_PROVIDER_HOSTED2_MAX_DATA_CLASSIFICATION:-}
  AURA_PROVIDER_HOSTED2_TOKENS_PER_SECOND: ${AURA_PROVIDER_HOSTED2_TOKENS_PER_SECOND:-0}
  AURA_PROVIDER_HOSTED2_EXTRA_BODY: ${AURA_PROVIDER_HOSTED2_EXTRA_BODY:-}
  AURA_PROVIDER_HOSTED2_IS_LOCAL: "false"
  AURA_PROVIDER_HOSTED2_API_KEY_ENV: AURA_PROVIDER_HOSTED2_API_KEY
  AURA_PROVIDER_HOSTED2_API_KEY_FILE: /run/secrets/hosted2_api_key
  AURA_PROVIDER_HOSTED3_KIND: ${AURA_PROVIDER_HOSTED3_KIND:-openai_compatible}
  AURA_PROVIDER_HOSTED3_MODEL: ${AURA_PROVIDER_HOSTED3_MODEL:-}
  AURA_PROVIDER_HOSTED3_BASE_URL: ${AURA_PROVIDER_HOSTED3_BASE_URL:-}
  AURA_PROVIDER_HOSTED3_QUALITY_TIER: ${AURA_PROVIDER_HOSTED3_QUALITY_TIER:-3}
  AURA_PROVIDER_HOSTED3_SPEED_TIER: ${AURA_PROVIDER_HOSTED3_SPEED_TIER:-3}
  AURA_PROVIDER_HOSTED3_CONTEXT_WINDOW: ${AURA_PROVIDER_HOSTED3_CONTEXT_WINDOW:-8192}
  AURA_PROVIDER_HOSTED3_MAX_OUTPUT_TOKENS: ${AURA_PROVIDER_HOSTED3_MAX_OUTPUT_TOKENS:-1024}
  AURA_PROVIDER_HOSTED3_SUPPORTS_TOOLS: ${AURA_PROVIDER_HOSTED3_SUPPORTS_TOOLS:-true}
  AURA_PROVIDER_HOSTED3_SUPPORTS_JSON_MODE: ${AURA_PROVIDER_HOSTED3_SUPPORTS_JSON_MODE:-false}
  AURA_PROVIDER_HOSTED3_TIMEOUT_S: ${AURA_PROVIDER_HOSTED3_TIMEOUT_S:-60}
  AURA_PROVIDER_HOSTED3_HEALTH_TIMEOUT_S: ${AURA_PROVIDER_HOSTED3_HEALTH_TIMEOUT_S:-10}
  AURA_PROVIDER_HOSTED3_HEALTH_PATH: ${AURA_PROVIDER_HOSTED3_HEALTH_PATH:-/models}
  AURA_PROVIDER_HOSTED3_MAX_CONCURRENCY: ${AURA_PROVIDER_HOSTED3_MAX_CONCURRENCY:-4}
  AURA_PROVIDER_HOSTED3_RPM: ${AURA_PROVIDER_HOSTED3_RPM:-0}
  AURA_PROVIDER_HOSTED3_RPD: ${AURA_PROVIDER_HOSTED3_RPD:-0}

# Tuned for a 4 vCPU / 16 GB VPS running the whole stack, not a dedicated database host.
listen_addresses = '*'
max_connections = 120          # prod worst case: 4 gateway workers x 20 + 7 Celery children x 4 = 108,
                               # + 8 headroom (alembic, backup, psql). Computed from the compose files by
                               # aura_backend/tests/unit/test_postgres_connection_budget.py (audit FSA-073).
shared_buffers = 512MB         # ~25% of the container's 2GB limit
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_level = replica            # enough for pg_basebackup and a future read replica
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1         # SSD; the 4.0 default assumes spinning disks
effective_io_concurrency = 200
# Log slow queries only. Logging every statement on a shared box costs more than it teaches.
log_min_duration_statement = 500
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_temp_files = 0
password_encryption = scram-sha-256
timezone = 'UTC'

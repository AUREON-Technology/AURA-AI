server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      # The gateway logs one JSON object per line (observability/logging.py). Extracting the
      # correlation id as a label is what makes a request joinable across services in Grafana.
      - json:
          expressions:
            level: level
            logger: logger
            correlation_id: correlation_id
      - labels:
          level:
          correlation_id:

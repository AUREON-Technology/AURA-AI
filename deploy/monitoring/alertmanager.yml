# Routing is grouped so a cascading outage produces one notification, not forty.
#
# Receivers are filled at container start by deploy/scripts/alertmanager-entrypoint.sh
# from ALERTMANAGER_WEBHOOK_URL (and optional SMTP). This file must not contain a
# live webhook: a placeholder that 404s looks configured and drops pages on the floor.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h
    - matchers: [severity="info"]
      receiver: default
      repeat_interval: 24h

# Silence lower-severity noise while a critical alert for the same component is firing.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname]

receivers:
  - name: default
  - name: critical

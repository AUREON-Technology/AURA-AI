# Scrape config. The gateway is reached over the internal network -- /metrics is never
# published through Nginx (it leaks provider names, model names, cost, and traffic volume).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: aura-vps

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: aura-gateway
    metrics_path: /metrics
    # Since SaaS P1 plan A the gateway 404s /metrics in production unless the scrape carries
    # AURA_METRICS_TOKEN (fail closed; aura_core/api/security_headers.py). On a production VPS
    # set the token and add here:
    #   authorization: {type: Bearer, credentials_file: /run/secrets/metrics_token}
    static_configs:
      - targets: [gateway:8000]
    # A turn can take tens of seconds; a scrape must never be the thing that times out.
    scrape_timeout: 10s

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

# Scrape config. The gateway is reached over the internal network -- /metrics is never
# published through Nginx (it leaks provider names, model names, cost, and traffic volume).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: aura-vps

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: aura-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:8000]
    # A turn can take tens of seconds; a scrape must never be the thing that times out.
    scrape_timeout: 10s

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
